name: Daily Learning Loop

# The studio's heartbeat: transcribe the next competitor video off the queue,
# extract its structural blueprint, log the day, commit back.
# LLM-free by design (deterministic; agent sessions do the creative work).
# YouTube bot-walls cloud IPs (ledger L-031) — blocked days stay green and retry.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily (09:00 EAT)
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if queue is empty (writes a log note)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-loop
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Git identity
        run: |
          git config user.name "youtube-engine bot"
          git config user.email "341060791+limitlessprojects@users.noreply.github.com"

      - name: Run the daily loop
        env:
          # Optional escape hatches for YouTube's cloud-IP bot-wall (docs/youtube-oauth.md):
          YTA_PROXY: ${{ secrets.YTA_PROXY }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > /tmp/yt_cookies.txt
            echo "YTDLP_COOKIES_FILE=/tmp/yt_cookies.txt" >> "$GITHUB_ENV"
          fi
          python tools/daily_loop.py

      - name: Push (retry-safe)
        run: |
          git push || (sleep 5 && git push) || echo "::warning::push failed; local changes preserved for next run"
