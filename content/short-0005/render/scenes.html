<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#070A18;overflow:hidden;}
  #stage{width:1080px;height:1920px;position:relative;}
  svg{display:block;}
</style>
</head>
<body>
<div id="stage"><svg id="frame" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script src="../../../engine/core.js"></script>
<script src="../../../engine/space.js"></script>
<script src="../../../engine/rig.js"></script>
<script src="../../../engine/world.js"></script>
<script src="../../../engine/diagram.js"></script>
<script src="../../../engine/caption.js"></script>
<script>
/* ============================================================
   Short #0005 v1 — "The loudest sound in history" (Krakatoa 1883)
   FIRST canvas-first short (L-085: subject owns the frame height,
   no diagram-in-panel default) + FIRST under the locked style bible
   (content/style-bible.md, boss 2026-11-13):
   · C13 palette = V2.P tokens; ONE accent per scene (amber/lava
     family; cool blue/teal only where the subject IS air/pressure)
   · C14 layered depth: sky / far ridge / sea / subject / near swell,
     rim lights on heroes, gradient shading, detail props
   · C15 motion design: parallax planes, eased everything, settle on
     impacts, slow camera pushes, grain + vignette (V2.grade)
   · C17 accuracy pass lives in gate/notes.json (object lists, one
     "wow" element per scene)
   · L-076 stamps/tags/kinetic titles ARE the text (one system/scene)
   · hook variants: HOOK_VARIANT "A" (island owns frame, rings) vs
     "B" (title-first, massive ring) — probed per L-087
   Deterministic: every frame a pure function of t (C6). SC_T0 is the
   current scene's global start (set by renderFrame) so every scene
   animates on scene-relative time without TL index bookkeeping.
   Timeline injected by tools/render_short.py (__TIMELINE__).
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
const HOOK_VARIANT = "B";   /* probe day-015: B 9 vs A 8 (cleaner focal, no mascot-vs-text clutter, better tiny-size contrast) — gate/hook_probe_verdict.json */
let SC_T0 = 0;
/* C14 asset layers: warm the cache so <image> draws on frame 0 */
["assets/wave.png", "assets/beach.png", "assets/cone.png"].forEach(h => { const i = new Image(); i.src = h; });
V2.root = document.getElementById("frame");
const P = V2.P;
const TITLE_FONT = "'Bricolage Grotesque', sans-serif";
const MONO = "'Fragment Mono', monospace";

/* ---------- NIGHT sea world (bible §1: deep space + nebula + amber) ---------- */
const NIGHT = {
  skyTop: P.bgDeep, skyMid: P.nebPurple2, skyLow: P.nebPurple,
  horizon: "#B98BA6", dawnBand: "#FF8A3D",
  seaFar: "#12224E", seaMid: "#142552", seaNear: "#101E44",
  foam: "#8FA8D8",
  rock: P.crust2, rockLit: P.rock, ink: P.ink,
  lava: "#FF5A4A", lavaHot: "#FFB054",
};

/* ---------- poses — 11 distinct, no adjacent repeats ---------- */
const POSES = {
  skygawk:  { tilt: -4, headTilt: -18, look: -0.4, expr: "shock",
              armL: { a: 30, b: -34 }, armR: { a: 148, b: -100 }, handR: "open",
              legL: { a: -14, b: 4 } },
  present:  { tilt: 3, look: 0.45, expr: "neutral",
              armL: { a: 96, b: -18 }, armR: { a: -18, b: -6 } },
  recoil:   { tilt: -10, headTilt: -12, look: -0.7, expr: "dizzy",
              armL: { a: 60, b: -110 }, armR: { a: 120, b: -120 },
              legL: { a: -26, b: 30 } },
  wince:    { tilt: 8, headTilt: 14, expr: "oops",
              armL: { a: 150, b: -128 }, armR: { a: 160, b: -132 } },
  brace:    { tilt: 14, headTilt: -8, look: -0.5, expr: "shock",
              armL: { a: 118, b: -104 }, armR: { a: 36, b: -58 },
              legL: { a: -22, b: 18 }, legR: { a: 18, b: -6 } },
  listen:   { tilt: -5, headTilt: -26, look: -0.8, expr: "neutral",
              armR: { a: 154, b: -138 }, armL: { a: 8, b: -4 } },
  amazed:   { tilt: 0, headTilt: -14, look: -0.6, expr: "happy",
              armL: { a: 40, b: -40 }, armR: { a: 132, b: -92 } },
  mourn:    { tilt: 6, headTilt: 22, look: 0.2, expr: "tired",
              armL: { a: 16, b: -10 }, armR: { a: 12, b: -8 } },
  stun:     { tilt: -8, headTilt: -10, look: -0.5, expr: "shock",
              armL: { a: 52, b: -66 }, armR: { a: 44, b: -60 } },
  point:    { tilt: 4, headTilt: -6, look: -0.55, expr: "happy",
              armR: { a: 108, b: -36 }, armL: { a: -6, b: -4 } },
};
const idleBlink = (t, seed) => (V2.rnd(seed, Math.floor(t / 2.7)) < 0.14 &&
  (t % 2.7) < 0.18 ? 1 : 0);
const pose = (name, t, x, y, scale, extra) => Object.assign({}, V2.basePose,
  POSES[name] || {},
  { x, y: y + Math.sin(t / 12) * 8, scale,
    blink: idleBlink(t, 41),
    look: (POSES[name] || {}).look !== undefined
      ? Math.max(-1, Math.min(1, POSES[name].look + Math.sin(t / 9) * 0.1)) : 0,
  }, extra || {});

/* ---------- shared world pieces (C14 layers) ---------- */
function skyBase(stops, warmGlow) {
  const g = V2.el("linearGradient", { id: "nSky", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  stops.forEach(([off, col]) => V2.el("stop", { offset: off, "stop-color": col }, g));
  V2.el("rect", { x: 0, y: 0, width: 1080, height: 1300, fill: "url(#nSky)" });
  if (warmGlow) V2.glow(540, 1268, 560, "Warm", 0.5);
}
const sky = (t) => skyBase([["0%", NIGHT.skyTop], ["52%", NIGHT.skyMid], ["86%", NIGHT.skyLow], ["100%", NIGHT.horizon]]);
const dawnSky = (t, warm) => skyBase([["0%", NIGHT.skyTop], ["55%", NIGHT.skyMid], ["84%", NIGHT.skyLow],
  ["100%", warm ? NIGHT.dawnBand : NIGHT.horizon]], warm);
function stars(t, seed, h) {
  V2.stars(t, seed, { x: 40, y: 60, w: 1000, h: h || 620 }, 44, 0.7);
}
function farRidge(t, y, amp, seed, col, dx) {
  let d = `M -30 1300 L -30 ${y}`;
  for (let i = 0; i <= 9; i++) {
    const x = -30 + i * 128 + dx;
    d += ` Q ${x - 40} ${y - amp * (0.4 + V2.rnd(seed, i))} ${x} ${y - amp * V2.rnd(seed + 3, i)}`;
  }
  d += " L 1110 1300 Z";
  V2.el("path", { d, fill: col });
}
function sea(t, top, litX) {
  V2.el("rect", { x: 0, y: top, width: 1080, height: 1920 - top, fill: NIGHT.seaMid });
  V2.el("rect", { x: 0, y: top, width: 1080, height: 4, fill: NIGHT.foam, opacity: 0.32 });
  farRidge(t, top + 34, 26, 71, NIGHT.seaFar, 0);
  V2.el("rect", { x: 0, y: top + 120, width: 1080, height: 1920 - top - 120, fill: NIGHT.seaNear });
  if (litX !== undefined) {
    const lg = V2.el("linearGradient", { id: "nLane", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
    V2.el("stop", { offset: "0%", "stop-color": NIGHT.lavaHot, "stop-opacity": 0.55 }, lg);
    V2.el("stop", { offset: "100%", "stop-color": NIGHT.lavaHot, "stop-opacity": 0 }, lg);
    for (let i = 0; i < 9; i++) {
      const yy = top + 46 + i * 92 + Math.sin(t / 14 + i) * 9;
      const w = 60 + V2.rnd(23, i) * 190;          /* varied widths — wave
        highlights, not placeholder bars (gate r1 s0/s8 directive) */
      const xo = (V2.rnd(24, i) - 0.5) * 130;
      V2.el("rect", { x: litX + xo - w / 2, y: yy, width: w, height: 5.5, rx: 2.75,
        fill: "url(#nLane)", opacity: 0.62 - i * 0.055 });
    }
  }
  for (let i = 0; i < 4; i++) {
    const yy = 1600 + i * 84 + Math.sin(t / 11 + i * 1.3) * 7;
    V2.el("path", { d: `M ${-40 + (i % 2) * 60} ${yy} q 170 ${-26} 340 0 q 170 ${26} 340 0 q 170 ${-26} 340 0`,
      stroke: NIGHT.foam, "stroke-width": 3, fill: "none", opacity: 0.09 + i * 0.018 });
  }
}
function volcano(t, x, baseY, hgt, wid, glowK, smokeK) {
  const apexY = baseY - hgt;
  const g = V2.el("g");
  const body = `M ${x - wid} ${baseY} Q ${x - wid * 0.62} ${baseY - hgt * 0.42} ${x - wid * 0.2} ${apexY + 34}
    L ${x - 26} ${apexY} L ${x + 30} ${apexY + 6} Q ${x + wid * 0.55} ${baseY - hgt * 0.38} ${x + wid} ${baseY} Z`;
  V2.el("path", { d: body, fill: NIGHT.rock, stroke: NIGHT.ink, "stroke-width": 5, "stroke-linejoin": "round" }, g);
  V2.el("path", { d: `M ${x - wid * 0.52} ${baseY} Q ${x - wid * 0.3} ${baseY - hgt * 0.3} ${x - 6} ${apexY + 40} L ${x - 6} ${baseY} Z`,
    fill: "#3A2A26", opacity: 0.75 }, g);
  if (glowK > 0) {
    V2.el("path", { d: `M ${x - 30} ${apexY + 4} L ${x} ${apexY + 34 + 26 * glowK} L ${x + 34} ${apexY + 6} Z`,
      fill: NIGHT.lava, opacity: 0.95 }, g);
    V2.glow(x, apexY + 26, 190 + 80 * glowK, "Red", 0.55 + 0.3 * glowK, g);
    V2.glow(x, apexY + 60, 320, "Warm", 0.28 + 0.2 * glowK, g);
    for (let i = 0; i < 9; i++) {
      /* D2 motion life: faster ember drift (carry_r3 D2) */
      const ph = (t * (15 + V2.rnd(5, i) * 9) + V2.rnd(7, i) * 400) % 420;
      const ex = x + Math.sin(ph / 60 + i * 2) * (26 + V2.rnd(9, i) * 40);
      V2.el("circle", { cx: ex, cy: apexY + 20 - ph, r: 3 + V2.rnd(11, i) * 3.5,
        fill: i % 3 ? NIGHT.lavaHot : NIGHT.lava, opacity: Math.max(0, 0.85 - ph / 420) }, g);
    }
  }
  if (smokeK > 0) {
    for (let i = 0; i < 3; i++) {
      const sy = apexY - 24 - i * 64, sw = 60 + i * 38, drift = Math.sin(t / 30 + i) * 22 + i * 12;
      V2.el("ellipse", { cx: x + drift, cy: sy, rx: sw, ry: 26 + i * 8,
        fill: "#2A2640", opacity: smokeK * (0.34 - i * 0.08) }, g);
    }
  }
}
function rings(t, x, y, t0, k) {
  for (let i = 0; i < 3; i++) {
    const lt = V2.clamp01((t - t0 - i * 0.55) / (2.6 - i * 0.5));
    if (lt <= 0) continue;
    const r = 70 + V2.easeOut(lt) * (1150 - i * 130) * k;
    V2.el("circle", { cx: x, cy: y, r, fill: "none", stroke: i === 1 ? P.teal : NIGHT.lavaHot,
      "stroke-width": 12 - i * 4, opacity: (1 - lt) * 0.62 });
  }
}
function shoreRock(t, hx, hy, hs, name) {
  /* ground glow + solid contact shadow: the hero must READ at 6 inches
     (gate r1: "tiny and dim" on 6 scenes — enlarged + lit everywhere) */
  V2.glow(hx, hy + 18 * hs, 230 * hs, "Warm", 0.85);
  V2.el("ellipse", { cx: hx, cy: hy + 44 * hs, rx: 170 * hs, ry: 36 * hs, fill: NIGHT.ink, opacity: 0.92 });
  V2.el("path", { d: `M ${hx - 140 * hs} ${hy + 40 * hs} Q ${hx - 86 * hs} ${hy - 52 * hs} ${hx - 10 * hs} ${hy + 40 * hs} Z`,
    fill: NIGHT.rockLit, stroke: NIGHT.ink, "stroke-width": 4 });
  V2.Hero(pose(name, t, hx, hy - 8 * hs, hs, {}), null, "vRimR");
}
function birds(t, seed, box, n, k) {
  for (let i = 0; i < n; i++) {
    const bx = box.x + V2.rnd(seed, i) * box.w + Math.sin(t / (18 + V2.rnd(seed, i) * 10) + i) * 16 * k;
    const by = box.y + V2.rnd(seed + 1, i) * box.h + Math.cos(t / (15 + i) + i * 2) * 9 * k;
    const s = 7 + V2.rnd(seed + 2, i) * 7;
    V2.el("path", { d: `M ${bx - s} ${by} Q ${bx - s / 2} ${by - s * 0.7} ${bx} ${by} Q ${bx + s / 2} ${by - s * 0.7} ${bx + s} ${by}`,
      stroke: NIGHT.ink, "stroke-width": 3, fill: "none", opacity: 0.7 });
  }
}
function boat(t, x, y, s) {
  V2.el("path", { d: `M ${x - 60 * s} ${y} L ${x + 60 * s} ${y} L ${x + 44 * s} ${y + 22 * s} L ${x - 48 * s} ${y + 22 * s} Z
     M ${x - 16 * s} ${y - 26 * s} L ${x + 30 * s} ${y - 26 * s} L ${x + 30 * s} ${y} L ${x - 16 * s} ${y} Z`,
    fill: NIGHT.ink, transform: `rotate(${Math.sin(t / 9) * 2} ${x} ${y})` });
  V2.el("circle", { cx: x + 8 * s, cy: y - 34 * s, r: 3.4 * s, fill: NIGHT.lavaHot, opacity: 0.9 });
  V2.glow(x + 8 * s, y - 34 * s, 26 * s, "Warm", 0.5);
}
function kineticTitle(t, lines, yTop, size, t0) {
  const gap = size * 1.09;
  for (let i = 0; i < lines.length; i++) {
    const lt = V2.clamp01((t - SC_T0 - t0 - i * 0.22) / 0.4);
    if (lt <= 0) continue;
    const pop = V2.backOut(lt);
    V2.txt(540, yTop + gap * i + (1 - pop) * 60, lines[i],
      { "text-anchor": "middle", "font-family": TITLE_FONT, "font-weight": 800,
        "font-size": lines[i].length > 12 ? size * 0.72 : size, fill: P.cream,
        stroke: NIGHT.ink, "stroke-width": 8, "paint-order": "stroke", opacity: pop });
  }
}
function stamp(t, x, y, text, t0, accent, dark) {
  /* INVERTED chip for the dark world (r2: dark pills vanished on navy):
     cream fill, ink mono text, accent tick — one text system per scene.
     dark=true flips it (ink fill, cream text) for scenes where the chip
     lands on WHITE foam (r7: cream-on-foam read ~0 contrast) */
  const lt = V2.clamp01((t - SC_T0 - t0) / 0.3);
  if (lt <= 0) return;
  const pop = V2.backOut(lt);
  const wpx = 46 + text.length * 21;
  const g = V2.el("g", { opacity: pop, transform: `translate(${x} ${y + (1 - pop) * 26})` });
  V2.el("rect", { x: -wpx / 2, y: -30, width: wpx, height: 60, rx: 14,
    fill: dark ? NIGHT.ink : P.cream, stroke: dark ? P.cream : NIGHT.ink,
    "stroke-width": 3.5 }, g);
  V2.el("rect", { x: -wpx / 2 + 10, y: -16, width: 7, height: 32, rx: 3.5,
    fill: accent || P.amber }, g);
  V2.txt(10, 11, text, { "text-anchor": "middle", "font-family": MONO, "font-size": 31,
    fill: dark ? P.cream : NIGHT.ink, "letter-spacing": 1.5 }, g);
}
/* camera push (C15): route implicit draws through a transformed group */
function withCam(cx, cy, s, fn) {
  const hold = V2.root;
  V2.root = V2.el("g", { transform: V2.cam(cx, cy, s) }, hold);
  fn();
  V2.root = hold;
}

/* ---------- scenes ---------- */
const SCENES = {};

SCENES.hook = (u, t) => {
  if (HOOK_VARIANT === "B") {
    sky(t); stars(t, 3, 700);
    /* upper-third interest (gate r1 hook_B directive): moon + cool halo */
    V2.el("circle", { cx: 190, cy: 220, r: 58, fill: P.cream, opacity: 0.9 });
    V2.el("circle", { cx: 214, cy: 204, r: 50, fill: NIGHT.skyTop });
    V2.glow(190, 220, 130, "Cool", 0.4);
    withCam(540, 960, 1 + V2.easeOut(V2.clamp01(u / 2)) * 0.05, () => {
      /* D2: crown pulse stronger/faster (carry_r3 D2) */
      volcano(t, 540, 1240, 300, 260, 0.7 + 0.38 * Math.sin(t / 1.7), 0.8);
      sea(t, 1240);
      rings(t, 540, 1230, SC_T0 + 0.15, 1.15);
      birds(t, 8, { x: 60, y: 240, w: 700, h: 380 }, 7, 1);
    });
    V2.grade(t);
    kineticTitle(t, ["THE LOUDEST", "SOUND EVER"], 1400, 150, 0.25);
    return;
  }
  dawnSky(t, true);
  stars(t, 3, 500);
  withCam(540, 980, 1 + V2.easeOut(V2.clamp01(u / 2.4)) * 0.06, () => {
    volcano(t, 540, 1240, 560, 330, 0.75 + 0.25 * Math.sin(t / 2), 0.9);
    sea(t, 1240, 540);
    rings(t, 540, 700, SC_T0 + 0.12, 1);
    birds(t, 8, { x: 90, y: 300, w: 380, h: 330 }, 6, 1);
    boat(t, 190, 1330, 0.5);
    shoreRock(t, 240, 1450, 0.9, "skygawk");
  });
  kineticTitle(t, ["THE LOUDEST", "SOUND EVER", "WAS AN ISLAND"], 1490, 118, 0.28);
  V2.grade(t);
};

SCENES.s0 = (u, t) => {
  dawnSky(t, true);
  stars(t, 4, 460);
  farRidge(t, 1176, 60, 31, "#0B1028", 0);
  farRidge(t, 1168, 74, 32, "#0B1028", 140);
  volcano(t, 540, 1240, 430, 280, 0.4, 0.7);
  sea(t, 1240, 540);
  boat(t, 830, 1318, 0.42);
  birds(t, 12, { x: 620, y: 330, w: 330, h: 260 }, 5, 1);
  stamp(t, 540, 760, "1883", 0.9, P.amber);
  /* D2 beat spike: one-shot reveal ring behind the 1883 card (carry_r3 D2,
     video directive: the 1883/gauge cards sat near-static 3-4s) */
  {
    const lt = V2.clamp01((t - SC_T0 - 0.95) / 1.5);
    if (lt > 0)
      V2.el("circle", { cx: 540, cy: 760, r: 60 + V2.easeOut(lt) * 240, fill: "none",
        stroke: P.amber, "stroke-width": 6, opacity: (1 - lt) * 0.45 });
  }
  V2.txt(790, 1210, "SUMATRA", { "text-anchor": "middle", "font-family": MONO,
    "font-size": 28, fill: P.cream, "letter-spacing": 4, opacity: 0.95,
    stroke: NIGHT.ink, "stroke-width": 4, "paint-order": "stroke" });
  V2.txt(250, 1216, "JAVA", { "text-anchor": "middle", "font-family": MONO,
    "font-size": 28, fill: P.cream, "letter-spacing": 4, opacity: 0.95,
    stroke: NIGHT.ink, "stroke-width": 4, "paint-order": "stroke" });
  shoreRock(t, 262, 1490, 1.0, "present");
  V2.grade(t);
};

SCENES.s1 = (u, t) => {
  sky(t); stars(t, 5, 420);
  sea(t, 1268);
  const g = V2.el("g", { transform: `translate(540 760) scale(${1 + V2.easeOut(V2.clamp01(u * 3)) * 0.04})` });
  V2.el("circle", { cx: 0, cy: 0, r: 330, fill: "#0E1430", stroke: P.cream, "stroke-width": 8 }, g);
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI * (1 - i / 10);
    V2.el("line", { x1: Math.cos(a) * 288, y1: -Math.sin(a) * 288,
      x2: Math.cos(a) * (i % 5 === 0 ? 240 : 262), y2: -Math.sin(a) * (i % 5 === 0 ? 240 : 262),
      stroke: P.cream, "stroke-width": i % 5 === 0 ? 6 : 3, opacity: 0.85 }, g);
    if (i % 5 === 0) V2.txt(Math.cos(a) * 205, -Math.sin(a) * 205 + 10, String(i * 20),
      { "text-anchor": "middle", "font-family": MONO, "font-size": 34, fill: P.cream }, g);
  }
  const a130 = Math.PI * (1 - 130 / 200);
  V2.el("path", { d: `M ${Math.cos(a130) * 330} ${-Math.sin(a130) * 330} A 330 330 0 0 1 330 0`,
    fill: "none", stroke: NIGHT.lava, "stroke-width": 18, opacity: 0.9 }, g);
  const ts = t - SC_T0;
  const ang = V2.kf(ts, [[0.15, 20], [0.55, 196], [0.9, 180]], V2.easeOut)
    + (ts > 0.55 ? V2.settle(ts - 0.55, 3.4, 5, 2.4) : 0);
  const rad = Math.PI * (1 - ang / 200);
  V2.el("line", { x1: 0, y1: 34, x2: Math.cos(rad) * 268, y2: -Math.sin(rad) * 268,
    stroke: NIGHT.lavaHot, "stroke-width": 12, "stroke-linecap": "round" }, g);
  V2.el("circle", { cx: 0, cy: 34, r: 22, fill: P.cream, stroke: NIGHT.ink, "stroke-width": 5 }, g);
  V2.glow(Math.cos(rad) * 268, -Math.sin(rad) * 268, 90, "Warm", 0.7, g);
  V2.glow(540, 1240, 200, "Warm", 0.6);
  /* r7: ONE text system — pill + caption merged */
  stamp(t, 540, 1240, "PRESSURE WAVE \u00B7 180 dB", 0.55, NIGHT.lavaHot);
  for (let i = 0; i < 3; i++) {
    const lt = V2.clamp01((t - SC_T0 - 0.5 - i * 0.4) / 1.6);
    if (lt > 0)
      V2.el("circle", { cx: 880, cy: 1560, r: 60 + V2.easeOut(lt) * 380, fill: "none",
        stroke: NIGHT.lavaHot, "stroke-width": 7, opacity: (1 - lt) * 0.4 });
  }
  shoreRock(t, 185, 1560, 1.0, "recoil");
  V2.grade(t);
};

SCENES.s2 = (u, t) => {
  sky(t); stars(t, 6, 300);
  sea(t, 1330);
  const g = V2.el("g", { transform: `translate(540 660) scale(${1 + V2.easeOut(V2.clamp01(u * 2.6)) * 0.05})` });
  V2.el("path", { d: "M -150 260 Q -330 60 -190 -170 Q -60 -350 170 -240 Q 330 -130 250 40 Q 200 150 120 190 Q 150 260 90 320 Q 30 380 -40 340 Q -120 320 -150 260 Z",
    fill: P.cream, stroke: NIGHT.ink, "stroke-width": 9, "stroke-linejoin": "round" }, g);
  V2.el("path", { d: "M -60 220 Q -160 90 -80 -60 Q -10 -180 120 -120 Q 210 -70 160 10 Q 120 70 60 80",

/* caption policy: every scene carries exactly ONE in-scene text system
   (stamps/titles above) — no second caption layer (L-076) */
const EMPHASIS = {};

function renderFrame(t) {
  V2.root.innerHTML = "";
  V2.defsHold = V2.el("defs", {}, V2.root);
  V2.defs(V2.root);
  let idx = TL.length - 1;
  for (let i = 0; i < TL.length; i++)
    if (t < TL[i].end - 1e-6) { idx = i; break; }
  const sc = TL[idx];
  SC_T0 = sc.start;
  const u = V2.clamp01((t - sc.start) / (sc.end - sc.start));
  const entryK = V2.clamp01((t - sc.start) / 0.12);
  (SCENES[sc.id] || SCENES.hook)(u, t);
  if (entryK < 1) V2.el("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: NIGHT.skyTop, opacity: (1 - entryK) * 0.55 });
  if (EMPHASIS[sc.id]) V2.caption(sc.narration, u, EMPHASIS[sc.id]);
}
window.renderFrame = renderFrame;
renderFrame(0);
