<script>
/* ============================================================
   Short #0009 — "The largest animal that ever existed is alive right now"
   Superlative formula #2 (topic bench lane); day-021 directive (b):
   bolder-composition world — ONE dominant object, the whale spans the
   frame in every scene. C14 layered body (mottled skin, pleats, fins),
   C15 parallax + idle breathing + tail sway, C18 all events timed on u.
   Deterministic: pure function of t (C6). Loop: last frame = frame 0.
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
V2.root = document.getElementById("frame");
const P = V2.P;
const TITLE_FONT = "'Bricolage Grotesque', sans-serif";
const MONO = "'Fragment Mono', monospace";
const E = V2.el, cl = V2.clamp01, lerp = V2.lerp;
const _ctx = document.createElement("canvas").getContext("2d");
const meas = (s, font) => { _ctx.font = font; return _ctx.measureText(s).width; };
const sstep = (a, b, v) => { const x = cl((v - a) / (b - a)); return x * x * (3 - 2 * x); };
const seg = (u, a, b) => cl((u - a) / (b - a));
const pathOf = (a, close) => "M " + a.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ") + (close ? " Z" : "");

/* world tokens — derived from the bible hues (cool water scene, amber = the ONE warm accent: krill/buses) */
const K = {
  whaleTop: "#6FA3D4", whaleLow: "#3E76AC", whaleMid: "#5C93C4",
  mottle: "#D8EAF8", belly: "#EDF4FA", pleat: "#2A5478",
  fin: "#3E6E9E", baleen: "#F6EFE3", baleenS: "#D2C4AD",
  krill: "#FFA95C", krillHi: "#FFD7A0",
  bus: "#FFB054", busWin: "#F6EFE3",
  el: "#B9C7D8", elS: "#93A6BC",
  heart: "#E06B60", heartHi: "#F5A69C", vein: "#4AA8FF", arte: "#F6EFE3",
  steel: "#DDE7F6",
};

/* ---------- water (screen space, parallax) — shared ocean backdrop ---------- */
function water(t, cam, day) {
  const bs = 1 + (cam[2] - 1) * 0.25;
  const g = E("g", { transform: `translate(540 960) scale(${bs}) translate(${-540 - (cam[0] - 540) * 0.25} ${-960 - (cam[1] - 940) * 0.25})` });
  const lg = E("linearGradient", { id: "kSea", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#2E7FB4"], ["30%", P.earthSea2], ["70%", "#173A66"], ["100%", "#0B1C38"]].forEach(([o, c]) => E("stop", { offset: o, c }, lg));
  E("rect", { x: -500, y: -500, width: 2080, height: 2920, fill: "url(#kSea)" }, g);
  const sg = E("linearGradient", { id: "kShaft", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#CFF3FF", 0.42], ["100%", "#CFF3FF", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, sg));
  for (let i = 0; i < 5; i++) {
    const x = 120 + i * 220 + Math.sin(t * 0.5 + i * 1.7) * 40, w = 90 + (i % 2) * 60, lean = -160 + Math.sin(t * 0.4 + i) * 30;
    E("path", { d: `M ${x} -200 L ${x + w} -200 L ${x + w * 2.2 + lean} 1500 L ${x - w + lean} 1500 Z`, fill: "url(#kShaft)", opacity: (0.5 + 0.2 * Math.sin(t * 0.9 + i * 2)) * (day === undefined ? 1 : day), style: "mix-blend-mode:screen" }, g);
  }
  for (let i = 0; i < 46; i++) {
    const sp = 0.4 + V2.rnd(3, i), x = ((V2.rnd(1, i) * 1400 - 160 + Math.sin(t * 0.7 * sp + i) * 26 - t * 14 * sp) % 1400 + 1400) % 1400 - 160;
    const y = ((V2.rnd(2, i) * 2100 - t * 46 * sp) % 2100 + 2100) % 2100 - 90, r = 2 + V2.rnd(4, i) * 5;
    if (i % 5 === 0) E("circle", { cx: x, cy: y, r: r + 5, fill: "none", stroke: "#CFF3FF", "stroke-width": 2.5, opacity: 0.45 }, g);
    else E("circle", { cx: x, cy: y, r, fill: i % 3 ? "#9FD8F0" : "#7DF0E4", opacity: 0.2 + V2.rnd(5, i) * 0.3 }, g);
  }
}

function halo(x, y, r, o) {
  if (!document.getElementById("kHalo")) {
    const hg = E("radialGradient", { id: "kHalo" }, V2.defsHold);
    [["0%", "#9FC0FF", 0.30], ["60%", "#9FC0FF", 0.10], ["100%", "#9FC0FF", 0]].forEach(([off, c, a]) => E("stop", { offset: off, "stop-color": c, "stop-opacity": a }, hg));
  }
  E("ellipse", { cx: x, cy: y, rx: r * 1.15, ry: r, fill: "url(#kHalo)", opacity: o === undefined ? 0.8 : o });
}
/* ---------- krill: comma-shaped swimmers (the ONE warm accent) ---------- */
function krill(parent, x, y, s, o) {
  o = o || {};
  const g = E("g", { transform: `translate(${x} ${y}) rotate(${o.rot === undefined ? -20 : o.rot}) scale(${s})`, opacity: o.alpha === undefined ? 1 : o.alpha }, parent);
  E("path", { d: "M 0 0 C -30 -22 -46 -8 -58 -30 C -46 -34 -36 -26 -30 -34 C -20 -26 -8 -10 0 0", fill: K.krill, stroke: P.ink, "stroke-width": 6, "stroke-linejoin": "round" }, g);
  E("path", { d: "M -22 -20 C -28 -12 -34 -12 -40 -22", stroke: P.ink, "stroke-width": 3.5, fill: "none", "stroke-linecap": "round" }, g);
  E("path", { d: "M -46 -24 L -56 -40 M -50 -18 L -62 -30 M -52 -10 L -66 -20", stroke: K.krillHi, "stroke-width": 3, "stroke-linecap": "round" }, g);
  E("circle", { cx: -6, cy: -9, r: 3.2, fill: P.ink }, g);
}

/* ---------- elephant: African silhouette (mass reference) ---------- */
function elephant(parent, x, y, s, o) {
  o = o || {};
  const g = E("g", { transform: `translate(${x} ${y}) rotate(${o.rot || 0}) scale(${s})`, opacity: o.alpha === undefined ? 1 : o.alpha }, parent);
  const bd = pathOf([[0, -78], [66, -92], [104, -60], [112, -8], [96, 0], [-88, 0], [-104, -26], [-92, -70], [-52, -90]], true);
  E("path", { d: bd, fill: o.flat ? K.elS : K.el, stroke: P.ink, "stroke-width": 7, "stroke-linejoin": "round" }, g);
  E("path", { d: "M -60 -74 C -96 -86 -108 -52 -84 -34 C -70 -28 -58 -40 -60 -74", fill: K.elS, stroke: P.ink, "stroke-width": 6, "stroke-linejoin": "round" }, g);
  E("path", { d: `M -104 -34 C ${-128 + (o.sw || 0)} -28 ${-132 + (o.sw || 0) * 1.6} -4 ${-118 + (o.sw || 0) * 2} 14`, stroke: P.ink, "stroke-width": 11, fill: "none", "stroke-linecap": "round" }, g);
  E("path", { d: `M -118 ${-4 + (o.sw || 0) * 2} q -18 10 -4 26`, stroke: K.steel, "stroke-width": 6, fill: "none", "stroke-linecap": "round" }, g);
  [[-76, 0], [-40, 0], [58, 0], [88, 0]].forEach(([lx, ly], i) => E("path", { d: `M ${lx} ${ly - 8} L ${lx} ${ly + 30 + Math.sin((o.t || 0) * 3 + i) * 2}`, stroke: P.ink, "stroke-width": 13, "stroke-linecap": "round" }, g));
  E("path", { d: "M 64 -92 C 96 -110 118 -84 104 -58", fill: K.elS, stroke: P.ink, "stroke-width": 6, "stroke-linejoin": "round" }, g);
  E("circle", { cx: -66, cy: -58, r: 5.5, fill: P.ink }, g);
}

/* ---------- school bus (US yellow, window band, wheels) ---------- */
function bus(parent, x, y, s, o) {
  o = o || {};
  const g = E("g", { transform: `translate(${x} ${y}) rotate(${o.rot || 0}) scale(${o.flip ? [-s, s] : s})`, opacity: o.alpha === undefined ? 1 : o.alpha }, parent);
  E("path", { d: pathOf([[-150, 46], [-150, -34], [-128, -34], [-118, -56], [96, -56], [146, -18], [150, 0], [150, 46]], true), fill: K.bus, stroke: P.ink, "stroke-width": 7, "stroke-linejoin": "round" }, g);
  E("rect", { x: -138, y: -40, width: 274, height: 26, rx: 5, fill: K.busWin, stroke: P.ink, "stroke-width": 4 }, g);
  for (let i = 0; i < 6; i++) E("path", { d: `M ${-112 + i * 45} -40 L ${-112 + i * 45} -14`, stroke: P.ink, "stroke-width": 4 }, g);
  E("rect", { x: 116, y: -44, width: 26, height: 22, rx: 4, fill: K.busWin, stroke: P.ink, "stroke-width": 4 }, g);
  E("rect", { x: -150, y: 8, width: 300, height: 9, rx: 4, fill: P.ink, opacity: 0.75 }, g);
  E("circle", { cx: -92, cy: 52, r: 24, fill: "#1A2540", stroke: P.ink, "stroke-width": 6 }, g);
  E("circle", { cx: -92, cy: 52, r: 9, fill: K.steel }, g);
  E("circle", { cx: 92, cy: 52, r: 24, fill: "#1A2540", stroke: P.ink, "stroke-width": 6 }, g);
  E("circle", { cx: 92, cy: 52, r: 9, fill: K.steel }, g);
  E("circle", { cx: 146, cy: -12, r: 7, fill: K.busWin, stroke: P.ink, "stroke-width": 4 }, g);
}

/* ---------- the whale (origin = body centre, faces right) ---------- */
/* whale geometry — origin = body centre; nose +330, flukes -396 (blue whale profile:
   rounded rostrum, flat back, tail stock, broad two-lobe flukes, long jaw line) */
function whaleBodyPath() {
  return "M 330 -8 C 296 -36 232 -54 140 -60 C 30 -66 -80 -58 -170 -40 C -225 -28 -252 -16 -272 -4 L -272 8 C -240 26 -180 44 -100 56 C 40 70 180 62 260 40 C 300 30 326 12 330 -8 Z";
}
const FLUKES = "M -268 -4 C -330 -52 -372 -66 -396 -60 C -366 -26 -354 -4 -358 4 C -362 16 -372 40 -394 66 C -368 64 -326 48 -268 16 Z";
const PEC = "M 120 40 C 90 70 40 92 0 96 C 30 72 50 56 70 38 Z";
const MOUTH_LINE = "M 326 18 C 260 36 180 44 110 44";
function whale(parent, x, y, s, o) {
  o = o || {};
  const br = 1 + 0.012 * Math.sin((o.t || 0) * 1.9);           /* idle breathing */
  const g = E("g", { transform: `translate(${x} ${y}) rotate(${o.rot || 0}) scale(${s * br} ${s * (2 - br)})`, opacity: o.alpha === undefined ? 1 : o.alpha }, parent);
  const id = V2.uid("wb"), cp = E("clipPath", { id }, V2.defsHold); E("path", { d: whaleBodyPath() }, cp);
  const bg = E("linearGradient", { id: V2.uid("wg"), x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", K.whaleTop], ["55%", K.whaleMid], ["100%", K.whaleLow]].forEach(([off, c]) => E("stop", { offset: off, "stop-color": c }, bg));
  /* flukes + tail stock (secondary motion: sway) */
  const sway = (o.sway === undefined ? 1 : o.sway) * Math.sin((o.t || 0) * 1.3) * 14;
  E("path", { d: FLUKES, fill: K.fin, stroke: P.ink, "stroke-width": 7, "stroke-linejoin": "round", transform: `rotate(${sway} -272 2)` }, g);
  E("path", { d: "M -272 -4 L -238 -18 L -238 14 Z", fill: K.fin, stroke: P.ink, "stroke-width": 6, "stroke-linejoin": "round", transform: `rotate(${sway * 0.5} -250 0)` }, g);
  /* body fill */
  E("path", { d: whaleBodyPath(), fill: `url(#${bg.id})`, stroke: P.ink, "stroke-width": 8, "stroke-linejoin": "round", opacity: o.xray ? 1 - 0.82 * o.xray : 1 }, g);
  const inn = E("g", { "clip-path": `url(#${id})` }, g);
  /* mottled skin (real blue whale pattern) */
  for (let i = 0; i < 26; i++) {
    const mx = -220 + V2.rnd(11, i) * 500, my = -48 + V2.rnd(12, i) * 88;
    E("ellipse", { cx: mx, cy: my, rx: 14 + V2.rnd(13, i) * 26, ry: 6 + V2.rnd(14, i) * 9, fill: K.mottle, opacity: (0.35 + V2.rnd(15, i) * 0.22) * (o.xray ? 1 - 0.8 * o.xray : 1), transform: `rotate(${V2.rnd(16, i) * 40 - 20} ${mx} ${my})` }, inn);
  }
  /* ventral pleats along the jaw-belly zone */
  for (let i = 0; i < 11; i++) {
    const yy = 24 + i * 3.4;
    E("path", { d: `M 310 ${yy - 4} C 210 ${yy + 10} 60 ${yy + 18} -70 ${yy + 16}`, stroke: K.pleat, "stroke-width": 3.4, fill: "none", opacity: 0.5 * (o.xray ? 1 - 0.8 * o.xray : 1) }, inn);
  }
  /* pale ventral wash under the mouth line */
  E("ellipse", { cx: 70, cy: 44, rx: 250, ry: 24, fill: K.belly, opacity: (o.xray ? 1 - 0.88 * o.xray : 0.5) }, inn);
  /* D1 (carry_r4): internal value structure — spine streak, head folds, belly shadow */
  const xf = o.xray ? 1 - 0.8 * o.xray : 1;
  E("path", { d: "M 296 -34 C 180 -54 60 -60 -60 -52 C -160 -46 -232 -30 -262 -16", stroke: K.mottle, "stroke-width": 13, fill: "none", "stroke-linecap": "round", opacity: 0.42 * xf }, inn);
  E("path", { d: "M 286 -22 C 176 -42 66 -48 -50 -40 C -150 -34 -224 -20 -256 -6", stroke: K.mottle, "stroke-width": 7, fill: "none", "stroke-linecap": "round", opacity: 0.24 * xf }, inn);
  for (let i = 0; i < 3; i++) {
    const fx = 196 - i * 32;
    E("path", { d: `M ${fx} ${-42 + i * 4} C ${fx - 6} ${-18 + i * 5} ${fx - 5} ${2 + i * 6} ${fx + 4} ${18 + i * 6}`, stroke: K.pleat, "stroke-width": 4.5, fill: "none", "stroke-linecap": "round", opacity: 0.55 * xf }, inn);
  }
  E("ellipse", { cx: 20, cy: 64, rx: 330, ry: 22, fill: "#1B3A5E", opacity: 0.42 * xf }, inn);
  if (o.inside) o.inside(inn);
  /* fins */
  E("path", { d: PEC, fill: K.fin, stroke: P.ink, "stroke-width": 6, "stroke-linejoin": "round", transform: `rotate(${Math.sin((o.t || 0) * 1.3) * 6} 120 40)` }, g);
  E("path", { d: "M -150 -44 L -122 -24 L -178 -28 Z", fill: K.fin, stroke: P.ink, "stroke-width": 6, "stroke-linejoin": "round" }, g);
  /* mouth line */
  E("path", { d: MOUTH_LINE, stroke: P.ink, "stroke-width": 7, fill: "none", "stroke-linecap": "round" }, g);
  /* lunge: mouth interior wedge + baleen comb (no rotation — alpha + grow) */
  const jaw = o.jaw || 0;
  if (jaw > 0.02) {
    const wg = E("g", { opacity: cl(jaw * 1.6) }, g);
    const drop = 18 + jaw * 46;
    E("path", { d: `M 326 18 L 318 ${drop + 12} C 250 ${drop + 30} 170 ${drop + 34} 108 ${drop + 26} L 110 44 C 180 44 260 36 326 18 Z`, fill: "#0A1626", stroke: P.ink, "stroke-width": 5, "stroke-linejoin": "round" }, wg);
    for (let i = 0; i < 16; i++) {
      const bx = 118 + i * 13.5, top = lerp(44, 18, (bx - 110) / 216), h = (drop + 14 - top) * 0.85;
      E("path", { d: `M ${bx} ${top} L ${bx - 3} ${top + h}`, stroke: K.baleen, "stroke-width": 5.5, "stroke-linecap": "round", opacity: 0.95 }, wg);
    }
    if (o.krillIn) o.krillIn(wg);
  }
  /* eye + blowhole (blink: lid sweeps down on a slow cycle) */
  const bl = (o.t || 0) % 2.7 < 0.16 ? cl(1 - Math.abs(((o.t || 0) % 2.7) - 0.08) / 0.08) : 0;
  E("circle", { cx: 210, cy: 4, r: 7.5, fill: P.ink }, g);
  if (bl > 0) E("path", { d: `M 200 ${4 - 7.5 * bl} L 220 ${4 - 7.5 * bl}`, stroke: K.whaleMid, "stroke-width": 16 * bl, "stroke-linecap": "round" }, g);
  if (bl < 0.5) E("circle", { cx: 212, cy: 2, r: 2.6, fill: K.steel, opacity: 1 - bl * 2 }, g);
  E("ellipse", { cx: 140, cy: -60, rx: 13, ry: 6, fill: P.ink, transform: `rotate(-14 140 -60)` }, g);
  /* teal rim light on the back */
  E("path", { d: "M 140 -60 C 30 -66 -80 -58 -170 -40", stroke: "#7DF0E4", "stroke-width": 9, fill: "none", "stroke-linecap": "round", opacity: 0.8 }, g);
  return g;
}
/* krill stream flowing into the mouth wedge (whale-local coords) */
function krillStream(parent, k, t) {
  for (let i = 0; i < 9; i++) {
    const at = 0.05 + i * 0.085, kk = cl((k - at) / 0.22);
    if (kk <= 0 || kk >= 1) continue;
    const px = lerp(400, 150, kk) + V2.rnd(61, i) * 30, py = lerp(6, 34 + V2.rnd(62, i) * 14, kk);
    krill(parent, px, py, 0.5 + V2.rnd(63, i) * 0.3, { rot: lerp(-6, -34, kk), alpha: 1 - kk * 0.4 });
  }
}

/* ---------- stick hero (scale refs) — rig from #0008, navy shadow ---------- */
const POSES = {
  point:   { tilt: -5, headTilt: -8, look: -0.6, expr: "happy", armL: { a: 74, b: -14 }, armR: { a: -8, b: -6 } },
  amazed:  { tilt: 0, headTilt: -12, look: -0.5, expr: "shock", armL: { a: 44, b: -44 }, armR: { a: 132, b: -92 } },
  happy:   { tilt: -3, headTilt: 6, look: -0.3, expr: "happy", armL: { a: 150, b: -24 }, armR: { a: 150, b: -24 } },
  inspect: { tilt: -16, headTilt: -16, look: -0.8, expr: "neutral", armL: { a: 52, b: 6 }, armR: { a: -24, b: -18 }, legL: { a: 10, b: 0 }, legR: { a: -14, b: 10 } },
};
function hero(t, name, x, z, sc, extra) {
  const base = POSES[name] || {}, sw = Math.sin(t * 2.2) * 5;
  const p = Object.assign({}, V2.basePose, base, { x, y: z - 140 * sc - 6 * sc + Math.sin(t * 2.6) * 3 * sc, scale: sc, blink: 0,
    tilt: (base.tilt || 0) + Math.sin(t * 1.7) * 2, squash: 0.012 * Math.sin(t * 2.6), sway: Math.sin(t * 2.2) * 6 }, extra || {});
  p.armL = Object.assign({}, p.armL, { a: p.armL.a + sw });
  p.armR = Object.assign({}, p.armR, { a: p.armR.a - sw * 0.7 });
  V2.Hero(p, null, "vRimL", 0);
  return p;
}
/* crawling newborn (s4) */
function crawler(parent, x, y, s, ph) {
  const g = E("g", { transform: `translate(${x} ${y}) scale(${s})` }, parent);
  E("path", { d: "M -34 6 Q 0 -26 36 4", stroke: P.ink, "stroke-width": 12, fill: "none", "stroke-linecap": "round" }, g);
  E("path", { d: "M -34 6 Q 0 -22 36 4", stroke: "#F3B7A8", "stroke-width": 7, fill: "none", "stroke-linecap": "round" }, g);
  E("circle", { cx: 44, cy: -8, r: 17, fill: "#F3B7A8", stroke: P.ink, "stroke-width": 6 }, g);
  [[-26, 1, 1], [-6, -1, -1], [22, 1, 1], [36, -1, -1]].forEach(([lx, dir, k], i) => {
    const a = Math.sin(ph * Math.PI * 2 + i * 1.57) * 10 * k;
    E("path", { d: `M ${lx} 2 L ${lx + a * dir} 22`, stroke: P.ink, "stroke-width": 9, "stroke-linecap": "round" }, g);
  });
}

/* ---------- text systems (C1: one per scene, ≤5 words) ---------- */
function title(lines, y, size, kf) {
  lines.forEach((ln, i) => {
    const k = kf(i); if (k <= 0.001) return;
    const pop = V2.backOut(cl(k));
    V2.txt(540, y + i * size * 1.06 + (1 - pop) * 50, ln, { "text-anchor": "middle", "font-family": TITLE_FONT, "font-weight": 800,
      "font-size": size, fill: P.cream, stroke: P.ink, "stroke-width": 16, "stroke-linejoin": "round", "paint-order": "stroke", opacity: cl(k * 2) });
  });
}
function chip(k, x, y, text, accent, size, strike) {
  if (k <= 0.001) return;
  size = size || 44;
  const pop = V2.backOutBig(cl(k)), w = text.length * size * 0.6 + 86, h = size * 1.75;
  const g = E("g", { opacity: cl(k * 3), transform: `translate(${x} ${y}) scale(${0.7 + 0.3 * pop})` });
  E("rect", { x: -w / 2, y: -h / 2 + 7, width: w, height: h, rx: h * 0.28, fill: "#000", opacity: 0.35 }, g);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: h * 0.28, fill: P.ink, stroke: P.cream, "stroke-width": 4 }, g);
  E("rect", { x: -w / 2 + 18, y: -h * 0.25, width: 10, height: h * 0.5, rx: 5, fill: accent || P.teal }, g);
  V2.txt(14, size * 0.34, text, { "text-anchor": "middle", "font-family": MONO, "font-size": size, fill: P.cream, "letter-spacing": 1 }, g);
  if (strike > 0) E("path", { d: `M ${-w / 2 + 34} 0 L ${-w / 2 + 34 + (w - 56) * cl(strike)} -6`, stroke: "#FF5A4A", "stroke-width": 9, "stroke-linecap": "round" }, g);
}
function plate(k, y, big, sub, col, bump) {
  if (k <= 0.001) return;
  const pop = V2.backOutBig(cl(k)), font = `800 112px ${TITLE_FONT}`, w = Math.max(meas(big, font), sub.length * 28) + 110;
  const g = E("g", { opacity: cl(k * 3), transform: `translate(540 ${y}) scale(${(0.7 + 0.3 * pop) * (1 + 0.14 * Math.sin(cl(bump || 0) * Math.PI))})` });

function withCam(cam, fn) {

}
function camOf(idx, lt, dur) {
  const sc = SC[TL[idx].id], a = sc.cam[0], b = sc.cam[1], u = V2.easeInOut(cl(lt / dur) * 0.85 + 0.075);
  let c = [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];

}
