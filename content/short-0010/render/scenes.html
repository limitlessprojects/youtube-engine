<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div id="stage"><svg id="frame" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script src="../../../engine/core.js"></script>

<script>
/* ============================================================
   Short #0010 — "In this town, everyone has a price over their head"
   FICTION LANE test #1 (Larptuber one-rule world, boss day-022 brief).
   The Zero-Dollar Bait: weaponized helplessness -> town-wide Trojan
   Horse lure. Double twist: fake $0 -> $999,999,999; monsters collect.
   Deadpan law: the hero's face NEVER moves (expr neutral, every scene).
   Production specs: research/larpniverse-sweep-2026-11-18.md
   (intown beat template, no CTA, hard cut on the last word).
   Deterministic: pure function of t (C6). Register: night-town
   (indigo/ember); money = amber; the ONE red = the Purge + the bounty.
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
V2.root = document.getElementById("frame");
const P = V2.P;
const TITLE_FONT = "'Bricolage Grotesque', sans-serif";
const MONO = "'Fragment Mono', monospace";
const E = V2.el, cl = V2.clamp01, lerp = V2.lerp;
const _ctx = document.createElement("canvas").getContext("2d");
const meas = (s, font) => { _ctx.font = font; return _ctx.measureText(s).width; };
const seg = (u, a, b) => cl((u - a) / (b - a));
const pathOf = (a, close) => "M " + a.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ") + (close ? " Z" : "");

/* the vigil look: all-dark coat hero (Fang Yuan archetype) */
V2.LOOKS.vigil = {
  skin: "#F6EFE3", skinShade: "#E2D3BE", hand: "#F6EFE3",
  jacket: "#181B30", jacketShade: "#10121F", accent: "#FFB054",
  limb: "#EFE2CC", line: "#121019", shoe: "#181B30",
  face: "#1D2033", hair: "#1D2033", extra: "hood",
};

/* world tokens — night town */
const K = {
  duskTop: "#2A1E4A", duskLow: "#63304E", nightTop: "#0A0E24", nightLow: "#1A1440",
  bldg: "#1B2142", bldgShade: "#141833", bldgFar: "#232A52",
  win: "#FFC878", winDim: "#8A6B4A", winOff: "#242A4A",
  street: "#262E52", streetFar: "#12162E",
  steel: "#93A1C0", steelHi: "#D5DEF0", steelShade: "#525E80",
  money: P.amber, moneyHi: "#FFD7A0",
  red: "#FF3B30", redDeep: "#5E0B0B", redGlow: "#FF6A55",
  bounty: "#FF2A1E",
  ink2: "#0A0A18", ember: "#FF6A2A",
  ash: "#3A4268",
};

/* ---------- price tag: the format's signature device ---------- */
function tag(parent, x, y, text, col, s, bob) {
  s = s || 1;
  const g = E("g", { transform: `translate(${x} ${y + Math.sin(bob || 0) * 5}) scale(${s})` }, parent);
  const w = Math.max(76, text.length * 30 + 44), h = 62;
  E("path", { d: `M ${-w / 2 - 12} ${-h / 2} L ${-w / 2 + 10} ${-h} L ${-w / 2 + 10} ${h / 2} Z`, fill: col, opacity: 0.9 }, g);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 12, fill: col, stroke: P.ink, "stroke-width": 5 }, g);
  V2.txt(0, 9, text, { "text-anchor": "middle", "font-family": MONO, "font-size": 40, "font-weight": 700, fill: P.ink }, g);
  return g;
}

/* ---------- town backdrop: sky + 2 building bands + street ---------- */
/* phase: 0 dusk · 1 purge night (red) · 2 post-reveal (red deep) */
function townscape(t, phase, cam, sweepU) {
  const g = E("g", { transform: `translate(540 960) scale(${1 + (cam[2] - 1) * 0.22}) translate(${-540 - (cam[0] - 540) * 0.22} ${-960 - (cam[1] - 940) * 0.22})` });
  const top = phase === 0 ? K.duskTop : phase === 1 ? K.nightTop : "#070513";
  const low = phase === 0 ? K.duskLow : phase === 1 ? K.nightLow : K.redDeep;
  const lg = E("linearGradient", { id: "kSky", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", top], ["62%", low], ["100%", phase === 0 ? "#3A2450" : "#0C0A22"]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, lg));
  E("rect", { x: -300, y: -500, width: 1680, height: 2400, fill: "url(#kSky)" }, g);
  /* dusk sun / purge moon */
  if (phase === 0) {
    E("circle", { cx: 820, cy: 560, r: 120, fill: "#FFB054", opacity: 0.85 }, g);
    E("circle", { cx: 820, cy: 560, r: 170, fill: "#FFB054", opacity: 0.18 }, g);
  } else {
    E("circle", { cx: 260, cy: 420, r: 84, fill: "#D8E0F4", opacity: 0.5 }, g);
    E("circle", { cx: 296, cy: 404, r: 84, fill: top, opacity: 0.9 }, g);
  }
  /* far band (behind) */
  for (let i = 0; i < 9; i++) {
    const bx = -260 + i * 200 + V2.rnd(201, i) * 60, bw = 130 + V2.rnd(202, i) * 90, bh = 320 + V2.rnd(203, i) * 260;
    E("rect", { x: bx, y: 1480 - bh, width: bw, height: bh + 420, fill: K.bldgFar, opacity: 0.55 }, g);
    if (phase > 0) for (let w = 0; w < 4; w++) if (V2.rnd(204, i * 7 + w) > 0.55)
      E("rect", { x: bx + 18 + w * 26, y: 1480 - bh + 40 + V2.rnd(205, i + w) * 120, width: 14, height: 20, fill: K.winOff }, g);
  }
  /* near band: facades with warm windows */
  for (let i = 0; i < 7; i++) {
    const bx = -220 + i * 230 + V2.rnd(206, i) * 50, bw = 165 + V2.rnd(207, i) * 80, bh = 420 + V2.rnd(208, i) * 330;
    E("rect", { x: bx, y: 1500 - bh, width: bw, height: bh + 460, fill: K.bldg, stroke: P.ink, "stroke-width": 4 }, g);
    E("rect", { x: bx, y: 1500 - bh, width: 18, height: bh + 460, fill: K.bldgShade }, g);
    for (let wy = 0; wy < Math.floor(bh / 150); wy++) for (let wx = 0; wx < 3; wx++) {
      /* L-127: windows must NOT compete with the money-amber tag system —
         dusk windows rare + muted, purge windows rarer + dimmer. Tags own the amber. */
      const lit = phase === 0 ? V2.rnd(209, i * 11 + wy * 3 + wx) > 0.8 : V2.rnd(209, i * 11 + wy * 3 + wx) > 0.88;
      E("rect", { x: bx + 30 + wx * (bw - 55) / 2.4, y: 1500 - bh + 46 + wy * 150, width: 34, height: 52, rx: 4,
        fill: lit ? (phase === 2 ? K.red : phase === 0 ? "#C08A50" : "#6E5238") : K.winOff, opacity: lit ? 0.72 : 1 }, g);
    }
    E("rect", { x: bx + bw * 0.3, y: 1500, width: bw * 0.4, height: 26, fill: K.bldgShade, opacity: 0.7 }, g);
  }
  /* street */
  E("rect", { x: -300, y: 1500, width: 1680, height: 620, fill: K.street }, g);
  E("rect", { x: -300, y: 1500, width: 1680, height: 16, fill: K.streetFar }, g);
  for (let i = 0; i < 7; i++) E("rect", { x: -240 + i * 260, y: 1560 + V2.rnd(210, i) * 300, width: 120, height: 10, fill: "#3A4272", opacity: 0.5 }, g);
  /* L-127 street life: the bottom third must carry content. Far-side lampposts
     (correct occlusion: they sit at the far curb, y=1500), wet reflections,
     curb line, crosswalk, manhole — all flat markings or far-side verticals. */
  const refC = phase === 0 ? "#C08A50" : phase === 1 ? K.red : K.bounty;
  for (let i = 0; i < 9; i++) {
    const sx2 = -180 + i * 160 + V2.rnd(240, i) * 50;
    E("rect", { x: sx2, y: 1512 + V2.rnd(241, i) * 130, width: 16, height: 50 + V2.rnd(242, i) * 90, rx: 8,
      fill: refC, opacity: 0.09, style: "mix-blend-mode:screen" }, g);
  }
  E("rect", { x: -300, y: 1500, width: 1680, height: 12, fill: "#3A4272", opacity: 0.8 }, g);
  for (let i = 0; i < 4; i++) E("rect", { x: 140 + i * 190, y: 1800, width: 96, height: 13, rx: 3, fill: "#3A4272", opacity: 0.55 }, g);
  for (let i = 0; i < 3; i++) E("rect", { x: 240 + i * 260, y: 1856, width: 120, height: 15, rx: 3, fill: "#333B66", opacity: 0.45 }, g);
  [[150, 1], [935, -1]].forEach(([lx, sd]) => {
    E("rect", { x: lx - 6, y: 1082, width: 12, height: 424, fill: "#0C0F22", stroke: P.ink, "stroke-width": 3 }, g);
    E("path", { d: `M ${lx} 1092 L ${lx} 1064 L ${lx + sd * 34} 1072`, stroke: "#0C0F22", "stroke-width": 9, fill: "none", "stroke-linecap": "round" }, g);
    E("circle", { cx: lx + sd * 38, cy: 1078, r: 13, fill: "#FFD9A0", opacity: 0.95 }, g);
    E("circle", { cx: lx + sd * 38, cy: 1078, r: 26, fill: "#FFD9A0", opacity: 0.25 }, g);
    E("path", { d: `M ${lx + sd * 20} 1082 L ${lx + sd * 92} 1500 L ${lx - sd * 30} 1500 Z`, fill: "#FFD9A0", opacity: 0.07, style: "mix-blend-mode:screen" }, g);
    E("ellipse", { cx: lx + sd * 30, cy: 1516, rx: 130, ry: 24, fill: "#FFD9A0", opacity: 0.12, style: "mix-blend-mode:screen" }, g);
  });
  E("ellipse", { cx: 560, cy: 1688, rx: 44, ry: 13, fill: "#101426", stroke: "#3A4272", "stroke-width": 4 }, g);
  if (phase > 0) E("ellipse", { cx: 560, cy: 1688, rx: 30, ry: 8, fill: K.ember, opacity: 0.35 }, g);
  E("rect", { x: -300, y: 1908, width: 1680, height: 212, fill: "#141833" }, g);
  E("rect", { x: -300, y: 1908, width: 1680, height: 8, fill: "#232A52", opacity: 0.8 }, g);
  /* the purge: red wash + sweep + siren rings */
  if (phase > 0) {
    const rg = E("radialGradient", { id: "kRed", cx: 0.5, cy: 0.42 }, V2.defsHold);
    [["0%", K.redGlow, 0.0], ["55%", K.red, 0.13], ["100%", "#3A0505", 0.42]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, rg));
    E("rect", { x: -300, y: -500, width: 1680, height: 2400, fill: "url(#kRed)", opacity: 0.55 + 0.12 * Math.sin(t * 3.1) }, g);
    if (sweepU !== undefined && sweepU > 0 && sweepU < 1) {
      const sx = lerp(-400, 1500, sweepU);
      E("rect", { x: sx - 220, y: -500, width: 220, height: 2400, fill: K.red, opacity: 0.3 * (1 - Math.abs(sweepU - 0.5) * 1.2), style: "mix-blend-mode:screen" }, g);
    }
    for (let i = 0; i < 3; i++) {
      const rk = ((t * 0.45 + i / 3) % 1);
      E("ellipse", { cx: 540, cy: 620, rx: 180 + rk * 900, ry: 60 + rk * 320, fill: "none", stroke: K.red, "stroke-width": 10 * (1 - rk), opacity: 0.5 * (1 - rk) }, g);
    }
  }
  return g;
}

/* ---------- NPC: mini stick figure (laugh / point / armed / frozen) ---------- */
function npc(parent, x, y, s, o) {
  o = o || {};
  const t = o.t || 0;
  const p = Object.assign({}, V2.basePose, {
    x, y: y - 140 * s, scale: s, expr: o.expr || "happy", facing: o.facing || 1,
    tilt: (o.tilt || 0) + (o.laugh ? Math.sin(t * 9 + x) * 6 : Math.sin(t * 1.4 + x) * 1.5),
    sway: Math.sin(t * 1.2 + x) * 4, blink: 0,
    armL: o.armL || { a: 20, b: -10 }, armR: o.armR || { a: 20, b: -10 },
    legL: o.legL || { a: 4, b: 0 }, legR: o.legR || { a: -4, b: 0 },
    look: o.look || 0, headTilt: o.headTilt || 0,
  }, o.extra || {});
  if (o.laugh) { p.armL = { a: 150 + Math.sin(t * 9 + x) * 14, b: -30 }; p.armR = { a: 150 + Math.cos(t * 9 + x) * 14, b: -30 }; p.headTilt = -10; }
  if (o.point) { p.armR = { a: 135, b: -25 }; p.headTilt = 6; }
  if (!o.noShadow) E("ellipse", { cx: x + 5, cy: y + 4, rx: 46 * s, ry: 12 * s, fill: "#04040A", opacity: 0.48 }, parent);
  /* look OBJECT, not name string — a string made every look value undefined:
     black heads/hands, no faces, no limbs (the r1/r2 "stick figure" read) */
  V2.Hero(p, o.look2 || V2.LOOKS.kip, "vRimR", 0.6, parent);
  /* weapon silhouette for the armed neighbors */
  if (o.weapon) {
    const wg = E("g", { transform: `translate(${x + (o.wepSide === undefined ? 52 : o.wepSide) * s * (o.facing || 1)} ${y - (o.wepHigh ? 265 : 150) * s}) rotate(${o.wrot || -20}) scale(${s})` }, parent);
    if (o.weapon === "bat") E("path", { d: "M 0 0 L 12 -120 L 26 -118 L 18 4 Z", fill: "#6B5136", stroke: P.ink, "stroke-width": 5 }, wg);
    if (o.weapon === "pipe") E("rect", { x: 4, y: -130, width: 13, height: 138, rx: 5, fill: K.steelShade, stroke: P.ink, "stroke-width": 4 }, wg);
    if (o.weapon === "fork") { E("rect", { x: 2, y: -128, width: 12, height: 136, rx: 4, fill: "#6B5136", stroke: P.ink, "stroke-width": 4 }, wg);
      E("path", { d: "M -10 -128 L -10 -158 M 8 -128 L 8 -158 M 26 -128 L 26 -158 M -10 -148 L 26 -148", stroke: K.steelHi, "stroke-width": 7, fill: "none" }, wg); }
  }
  if (o.price !== undefined) tag(parent, x + (o.tagDX || 0), y - 440 * s, o.price, o.priceRed ? K.bounty : K.money, 0.8 * s, t * 2 + x);
}

/* ---------- the hero: deadpan law + long coat + the $0 sticker ---------- */
function hero2(parent, x, y, s, o) {
  o = o || {};
  const t = o.t || 0;
  /* physiological blink only — the face never MOVES (deadpan law), but it blinks */
  const bc = (t * 0.85) % 3.2;
  const bl = o.blinkOff ? 0 : (bc < 0.13 ? cl(1 - Math.abs(bc - 0.065) / 0.065) : 0);
  const p = Object.assign({}, V2.basePose, {
    x, y: y - 140 * s, scale: s, expr: "neutral", facing: o.facing || 1,
    tilt: o.tilt || 0, headTilt: o.headTilt || 0, look: o.look || 0, blink: bl,
    sway: o.sway === undefined ? Math.sin(t * 1.5) * 3 : o.sway, squash: o.squash || 0,
    armL: o.armL || { a: 12, b: -8 }, armR: o.armR || { a: 12, b: -8 },
    legL: o.legL || { a: 4, b: 0 }, legR: o.legR || { a: -4, b: 0 },
    handL: o.handL || "open", handR: o.handR || "open",
  });
  /* grounding + separation: contact shadow, then a soft streetlight pool behind the figure (L-127) */
  if (!o.noShadow) E("ellipse", { cx: x + 8, cy: y + 6, rx: 68 * s, ry: 17 * s, fill: "#03030A", opacity: 0.58 }, parent);
  if (!o.noPool) V2.glow(x + (o.poolDX || 0), y - 180 * s, 230 * s, "Warm", o.poolOp || 0.13, parent);
  /* long coat: back cape (behind rig) + front panel (over torso, under arms) */
  const capeK = o.cape || 0;
  if (capeK > 0.01) {
    const cg = E("g", { transform: `translate(${x} ${y - 150 * s}) rotate(${p.tilt} 0 -40) scale(${s})` }, parent);
    const flare = 26 + capeK * 66;
    E("path", { d: `M -34 -96 C -44 -20 ${-flare - 18} 70 ${-flare} 150 L ${flare * 0.7} 148 C ${flare * 0.55} 60 ${flare * 0.4} -20 30 -96 Z`,
      fill: "#10121F", stroke: P.ink, "stroke-width": 6, "stroke-linejoin": "round", opacity: 0.97 }, cg);
  }
  V2.Hero(p, V2.LOOKS.vigil, "vRimL", 0.65, parent);
  if (!o.noCoat) {
    const fg = E("g", { transform: `translate(${x} ${y - 150 * s}) rotate(${p.tilt} 0 -40) scale(${s})` }, parent);
    E("path", { d: "M -40 -100 C -48 -30 -40 40 -30 108 L 30 108 C 42 40 48 -30 40 -100 C 14 -110 -14 -110 -40 -100 Z",
      fill: "#181B30", stroke: P.ink, "stroke-width": 5, "stroke-linejoin": "round" }, fg);
    E("path", { d: "M 0 -104 L 4 104", stroke: P.ink, "stroke-width": 3, opacity: 0.5 }, fg);
    E("path", { d: "M -34 -92 L -26 96", stroke: "#2A2F52", "stroke-width": 5, opacity: 0.8 }, fg);
    E("path", { d: "M 34 -92 L 26 96", stroke: "#10121F", "stroke-width": 5, opacity: 0.8 }, fg);
    /* warm rim on the lit edge so the black coat survives the night backdrop (L-127) */
    E("path", { d: "M 40 -100 C 48 -30 42 40 30 108", stroke: "#FFB054", "stroke-width": 6, opacity: 0.5, fill: "none", "stroke-linecap": "round" }, fg);
    E("path", { d: "M -40 -100 C -14 -114 16 -114 40 -100", stroke: "#FFD7A0", "stroke-width": 7, opacity: 0.55, fill: "none", "stroke-linecap": "round" }, fg);
  }
  /* the $0 sticker: floats clear above the head; peels in s7 (peel 0..1) */
  const sx = x + (o.stickerDX || 0), sy = y - 440 * s + Math.sin(t * 2) * 6;
  if (o.bounty) {
    const bScale = s * (o.bountyS || 1.15);
    let bfont = 76, w = meas("$999,999,999", `700 ${bfont}px ${MONO}`) + 70;
    if (w * bScale > 940) { bfont = Math.floor(bfont * 940 / (w * bScale)); w = meas("$999,999,999", `700 ${bfont}px ${MONO}`) + 70; }
    /* keep the banner fully in frame regardless of hero x (L-127: no clipped money) */
    const halfW = (w * bScale) / 2;
    const cx = Math.max(60 + halfW, Math.min(sx, 1020 - halfW));
    const bg = E("g", { transform: `translate(${cx} ${y - 500 * s}) scale(${bScale})` }, parent);
    V2.glow(0, 0, 300, "Warm", 0.7, bg);
    E("rect", { x: -w / 2, y: -50, width: w, height: 100, rx: 18, fill: "#1A0402", stroke: K.bounty, "stroke-width": 7 }, bg);
    V2.txt(0, 18, "$999,999,999", { "text-anchor": "middle", "font-family": MONO, "font-size": bfont, "font-weight": 700, fill: K.bounty, stroke: "#FFE8E0", "stroke-width": 2.5 }, bg);
  } else if (o.sticker !== false) {
    const pk = o.peel || 0;
    const g2 = E("g", { transform: `translate(${sx - 46 * pk} ${sy - pk * 46 + 66 * pk}) rotate(${pk * 34}) scale(${s * 1.0})`, opacity: pk > 0.92 ? 0 : 1 }, parent);
    E("rect", { x: -62, y: -48, width: 124, height: 96, rx: 14, fill: "#05060F", opacity: 0.32 }, g2);
    E("rect", { x: -52, y: -38, width: 104, height: 76, rx: 10, fill: "#262C4A", stroke: "#CBD6F2", "stroke-width": 6 }, g2);
    E("path", { d: "M -40 8 C -20 22 6 20 38 4", stroke: "#3A4272", "stroke-width": 5, fill: "none", opacity: 0.7 }, g2);
    V2.txt(0, 8, "$0", { "text-anchor": "middle", "font-family": MONO, "font-size": 56, "font-weight": 700, fill: P.cream, stroke: P.ink, "stroke-width": 3, "paint-order": "stroke" }, g2);
  }
}

/* ---------- shadow monster: tall ink giant, ember eyes ---------- */
function monster(parent, x, y, s, o) {
  o = o || {};
  const t = o.t || 0;
  const g = E("g", { transform: `translate(${x} ${y}) scale(${s}) rotate(${o.rot || 0})`, opacity: o.alpha === undefined ? 1 : o.alpha }, parent);
  const hunch = Math.sin(t * 1.1 + x * 0.01) * 6;
  /* body: hunched pillar, ember rim (reads on the dark red bg) */
  E("path", { d: `M -46 0 C -58 -140 -44 -250 -12 -308 C 4 -336 44 -336 58 -300 C 84 -232 76 -120 62 0 Z`,
    fill: K.ink2, stroke: K.ember, "stroke-width": 4, "stroke-linejoin": "round", opacity: 0.96, transform: `rotate(${hunch * 0.2} 0 0)` }, g);
  E("path", { d: `M -46 0 C -58 -140 -44 -250 -12 -308 C 4 -336 44 -336 58 -300 C 84 -232 76 -120 62 0 Z`,
    fill: "none", stroke: "#04040C", "stroke-width": 9, opacity: 0.5, transform: `rotate(${hunch * 0.2} 0 0)` }, g);
  /* head: horned skull-ish blob */
  E("path", { d: "M -50 -292 C -66 -348 -20 -386 22 -372 C 66 -358 74 -306 40 -280 C 8 -262 -34 -264 -50 -292 Z",
    fill: K.ink2, stroke: K.ember, "stroke-width": 4 }, g);
  E("path", { d: "M -38 -318 L -54 -368 M 6 -332 L 2 -392 M 44 -314 L 66 -360", stroke: "#04040C", "stroke-width": 11, "stroke-linecap": "round" }, g);
  /* ember eyes */
  const blink = (t * 0.8 + x * 0.013) % 3.4 < 0.12 ? 0.3 : 1;
  [[-22, -318], [26, -310]].forEach(([ex, ey]) => {
    E("ellipse", { cx: ex, cy: ey, rx: 13, ry: 8, fill: K.ember, opacity: blink }, g);
    E("ellipse", { cx: ex, cy: ey, rx: 24, ry: 15, fill: K.ember, opacity: 0.22 * blink }, g);
  });
  /* jaw teeth */
  E("path", { d: "M -34 -278 L -24 -258 L -12 -276 L 0 -256 L 12 -276 L 24 -258 L 34 -278", stroke: "#04040C", "stroke-width": 6, fill: "none" }, g);
  /* long arms with claws */
  [-1, 1].forEach((sd) => {
    const sw = Math.sin(t * 1.3 + sd) * 9;
    E("path", { d: `M ${40 * sd} -240 C ${96 * sd + sw} -190 ${104 * sd + sw} -90 ${86 * sd + sw} -6`,
      stroke: K.ink2, "stroke-width": 30, fill: "none", "stroke-linecap": "round" }, g);

/* ---------- steel door (slams / opens / bolt) ---------- */
function door(parent, x, y, w, h, k, o) {
  o = o || {};
  const g = E("g", { transform: `translate(${x} ${y})` }, parent);
  /* frame */
  E("rect", { x: -w / 2 - 16, y: -h - 14, width: w + 32, height: h + 18, fill: K.bldgShade, stroke: P.ink, "stroke-width": 6 }, g);
  if (k > 0.02) { /* open wedge: warm interior (mansions are lit inside — silhouettes the steppers) */
    const ig = E("linearGradient", { id: V2.uid("kd"), x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
    [["0%", "#FFD9A0"], ["70%", "#C98A4A"], ["100%", "#7A4A22"]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, ig));
    E("path", { d: `M ${-w / 2} 0 L ${-w / 2 - k * 60} ${-h * (1 - k * 0.16)} L ${w / 2 - k * 30} ${-h * (1 - k * 0.2)} L ${w / 2} 0 Z`, fill: `url(#${ig.id})`, opacity: 0.82 }, g);
    /* light spill on the street */
    E("path", { d: `M ${-w / 2} 0 L ${w / 2} 0 L ${w / 2 + 90 * k} 120 L ${-w / 2 - 120 * k} 120 Z`, fill: "#FFD9A0", opacity: 0.14 * k, style: "mix-blend-mode:screen" }, g);
  }
  const sk = o.slam ? Math.sin(o.slam * Math.PI) : 0;
  const dg = E("g", { transform: `rotate(${k * -(o.openA || 46) + sk * 4} ${w / 2} 0)` }, g);
  E("rect", { x: -w / 2, y: -h, width: w, height: h, rx: 6, fill: o.leaf || K.steel, stroke: P.ink, "stroke-width": 7 }, dg);
  E("rect", { x: -w / 2 + 10, y: -h + 10, width: w - 20, height: h - 20, rx: 4, fill: "none", stroke: K.steelShade, "stroke-width": 5 }, dg);
  E("rect", { x: -w / 2 + 10, y: -h * 0.5, width: w - 20, height: h * 0.5 - 10, rx: 4, fill: "#000", opacity: 0.14 }, dg);
  for (let i = 0; i < 5; i++) { E("circle", { cx: -w / 2 + 18, cy: -h + 26 + i * (h - 52) / 4, r: 5, fill: K.steelHi }, dg); E("circle", { cx: w / 2 - 18, cy: -h + 26 + i * (h - 52) / 4, r: 5, fill: K.steelHi }, dg); }
  E("rect", { x: w / 2 - 34, y: -h * 0.56, width: 22, height: 60, rx: 8, fill: K.steelShade, stroke: P.ink, "stroke-width": 4 }, dg);
  if (o.bolt > 0) { /* bolt bar sliding */
    E("rect", { x: -w / 2 + 8 + o.bolt * (w - 52), y: -h * 0.52, width: 46, height: 18, rx: 8, fill: K.steelHi, stroke: P.ink, "stroke-width": 4 }, dg);
  }
  return g;
}
