<body>
<div id="stage"><svg id="frame" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script src="../../../engine/core.js"></script>
<script src="../../../engine/space.js"></script>
<script src="../../../engine/rig.js"></script>

<script>
/* ============================================================
   Short #0002 v3 — "Why do 10,000 birds never crash mid-air?"
   First video on ENGINE V3 (docs/engine-v3-spec.md):
   · v3#1 first frame = the premise (sky FULL of birds at t=0)
   · v3#2 sound design lives in the mix (tools/finish_v3.py)
   · v3#3 color script: dusk gradient world, one accent/scene
     (amber everywhere; teal reserved for the "seven" insight)
   · v3#4 cut rate 1-2s: sub-beat stamps inside scenes,
     everything flaps/drifts/breathes — nothing static
   · v3#5 caption craft: keyword pops (V2.caption + EMPHASIS)
   · v3#6 character identity: kip + dusk-orange scarf (outdoors)
   · v3#7 pacing: 178.8 WPM measured (vo/asr_report.json)
   Deterministic: every frame a pure function of t (L-043).
   Timeline injected by tools/render_short.py (__TIMELINE__).
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
V2.root = document.getElementById("frame");
const P = V2.P;

/* ---------- dusk palette (this short's world tokens, L-004) ---------- */
const DUSK = {
  skyTop: "#0B1B4A", skyMid: "#1E3A7A", skyLow: "#7A4A8C",
  horizon: "#FF8A3D", horizon2: "#FFB054", sun: "#FFD9A0",
  sil: "#10182E", sil2: "#0C1226", linkGlow: "#2FD4C5",
};

/* ---------- poses (rig-native fields) ---------- */
const POSES = {
  skygawk:  { tilt: -4, headTilt: -18, look: 0.15, expr: "shock",
              armL: { a: 24, b: -30 }, armR: { a: 150, b: -96 }, handR: "open",
              legL: { a: -13, b: 4 } },
  present:  { tilt: 2, yaw: 0.3, look: 0.4, headTilt: -6,
              armL: { a: 18, b: -14 }, armR: { a: 138, b: -10 }, handR: "point" },
  nod:      { tilt: 3, yaw: 0.25, look: 0.3, armL: { a: 26, b: -20 }, armR: { a: 30, b: -22 } },
  amazed:   { tilt: -3, look: 0, armL: { a: 150, b: -100 }, armR: { a: 146, b: -100 }, expr: "shock" },
  lean:     { tilt: 6, yaw: 0.45, look: 0.5, headTilt: -6,
              armL: { a: 30, b: -26 }, armR: { a: 34, b: -28 }, expr: "neutral" },
  calm:     { tilt: 2, yaw: 0.3, armL: { a: 34, b: -74 }, armR: { a: 30, b: -78 }, expr: "neutral" },
  driving:  { tilt: 2, headTilt: 3, look: 0.2, expr: "tired",
              armL: { a: 74, b: -60 }, armR: { a: 106, b: -64 } },
};
const idleBlink = (t, off) => (((t + (off || 0)) % 132) < 3 ? 1 : 0);
const pose = (name, t, x, y, scale, extra) => Object.assign({}, V2.basePose, POSES[name] || {},
  { x, y: y + Math.sin(t / 34) * 3, scale, blink: idleBlink(t, 40) }, extra || {});

/* ---------- the dusk scarf (v3#6 identity prop; drawn over the rig) ---------- */
function scarf(x, y, scale, t, parent) {
  const w = Math.sin(t / 5.5) * 8;
  const g = V2.el("g", {}, parent);
  V2.el("path", { d: `M ${x - 30 * scale} ${y - 118 * scale} q 30 ${14 * scale} 60 0 l 0 ${16 * scale} q -30 ${12 * scale} -60 0 z`,
    fill: DUSK.horizon, stroke: "#121019", "stroke-width": 4 }, g);
  V2.el("path", { d: `M ${x + 26 * scale} ${y - 108 * scale} q ${34 + w} ${10 * scale} ${20 + w * 1.4} ${54 * scale} q ${-14 - w * 0.4} ${-8 * scale} ${-26} ${-20 * scale} z`,
    fill: DUSK.horizon2, stroke: "#121019", "stroke-width": 4, "stroke-linejoin": "round" }, g);
}

/* ---------- the dusk world (sky, sun, stars, treeline, ground) ---------- */
function duskDefs() {
  const d = V2.el("defs", {}, V2.root);
  const g = V2.el("linearGradient", { id: "dzSky", x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  [["0%", DUSK.skyTop], ["44%", DUSK.skyMid], ["72%", DUSK.skyLow], ["86%", DUSK.horizon], ["100%", DUSK.horizon2]]
    .forEach(([o, c]) => V2.el("stop", { offset: o, "stop-color": c }, g));
  const rg = V2.el("radialGradient", { id: "dzSun" }, d);
  [["0%", DUSK.sun, 1], ["30%", DUSK.horizon2, 0.6], ["100%", DUSK.horizon, 0]]
    .forEach(([o, c, op]) => V2.el("stop", { offset: o, "stop-color": c, "stop-opacity": op }, rg));
  const hb = V2.el("linearGradient", { id: "dzHband", x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  [["0%", DUSK.horizon, 0], ["100%", DUSK.horizon2, 0.55]].forEach(([o, c, op]) =>
    V2.el("stop", { offset: o, "stop-color": c, "stop-opacity": op }, hb));
}
function duskSky(t, cam, opts) {
  const o = opts || {};
  V2.el("rect", { x: -260, y: -260, width: 1600, height: 2440, fill: "url(#dzSky)" }, cam);
  /* sun low near horizon */
  const sx = o.sunX === undefined ? 780 : o.sunX, sy = o.sunY === undefined ? 1130 : o.sunY;
  V2.el("circle", { cx: sx, cy: sy, r: 640, fill: "url(#dzSun)", opacity: 0.48, style: "mix-blend-mode:screen" }, cam);
  V2.el("circle", { cx: sx, cy: sy, r: 150, fill: "url(#dzSun)", opacity: 0.6, style: "mix-blend-mode:screen" }, cam);
  /* the dusk band: warm light pooling along the horizon */
  V2.el("rect", { x: -260, y: 980, width: 1600, height: 300, fill: "url(#dzHband)", opacity: 0.4, style: "mix-blend-mode:screen" }, cam);
  /* stars up top */
  V2.stars(t, 5, { x: -60, y: 0, w: 1200, h: 640 }, 46, 0.8, cam);
  /* drifting cloud strips catch the dusk light */
  for (let i = 0; i < 4; i++) {
    const cy = 300 + i * 150 + V2.rnd(9, i) * 60;
    const cx = ((t * (5 + i * 2) + V2.rnd(4, i) * 900) % 1500) - 210;
    V2.el("ellipse", { cx, cy, rx: 200 + V2.rnd(6, i) * 160, ry: 16 + V2.rnd(3, i) * 12,
      fill: i % 2 ? "#5A3E78" : "#8A5A8C", opacity: 0.32 }, cam);
  }
  /* treeline + hills silhouettes at the horizon */
  const tl = V2.el("g", {}, cam);
  for (let i = 0; i < 26; i++) {
    const hx = -80 + i * 52 + V2.rnd(11, i) * 18;
    const hh = 60 + V2.rnd(12, i) * 90;
    V2.el("path", { d: `M ${hx} 1210 L ${hx + 15} ${1210 - hh} L ${hx + 30} 1210 Z`, fill: DUSK.sil, opacity: 0.9 }, tl);
  }
  V2.el("path", { d: "M -80 1200 Q 200 1050 470 1180 Q 700 1290 900 1140 Q 1020 1060 1160 1170 L 1160 1350 L -80 1350 Z",
    fill: DUSK.sil2 }, tl);
  /* the ground: dark field the hero stands on */
  V2.el("rect", { x: -260, y: 1290, width: 1600, height: 900, fill: DUSK.sil2 }, cam);
  V2.el("rect", { x: -260, y: 1286, width: 1600, height: 10, rx: 5, fill: DUSK.horizon, opacity: 0.4 }, cam);
  for (let i = 0; i < 30; i++) {
    const gx = -100 + i * 44 + V2.rnd(21, i) * 20, gy = 1330 + V2.rnd(22, i) * 480;
    V2.el("path", { d: `M ${gx} ${gy} q 5 -14 10 0`, stroke: "#1A2440", "stroke-width": 3, fill: "none", opacity: 0.7 }, cam);
  }
}

/* ---------- ground patch: a lit pool so contact shadows READ on dark ground
   (gate round-1 fix: black shadow on near-black field = invisible) ---------- */
function groundPatch(x, hipsY, scale, parent) {
  const fy = hipsY + 140 * scale + 6;
  V2.el("ellipse", { cx: x, cy: fy + 8, rx: 120 * scale, ry: 26 * scale, fill: "#1E2A4E", opacity: 0.9 }, parent);
  V2.el("ellipse", { cx: x, cy: fy, rx: 86 * scale, ry: 17 * scale, fill: "#2B3A66", opacity: 0.95 }, parent);
}

/* ---------- birds ---------- */
/* small silhouette bird, wings flap; heading in radians */
function bird(x, y, s, ang, t, ph, parent, opts) {
  const o = opts || {};
  const flap = Math.sin(t * 11 + ph);
  const g = V2.el("g", { transform: `translate(${x} ${y}) rotate(${(ang * 180) / Math.PI})`, opacity: o.opacity === undefined ? 1 : o.opacity }, parent);
  const col = o.color || DUSK.sil;
  const wing = (dir) => V2.el("path", {
    d: `M 0 ${-s * 0.1} Q ${dir * s * 0.9} ${-s * (0.55 + 0.5 * flap)} ${dir * s * 1.5} ${-s * (0.35 + 0.45 * flap)}`,
    stroke: col, "stroke-width": Math.max(2, s * 0.34), fill: "none", "stroke-linecap": "round" }, g);
  wing(-1); wing(1);
  V2.el("ellipse", { cx: s * 0.1, cy: 0, rx: s * 0.78, ry: s * 0.4, fill: col }, g);
  V2.el("path", { d: `M ${-s * 0.6} 0 l ${-s * 0.42} ${-s * 0.18} l 0 ${s * 0.36} z`, fill: col }, g);
  V2.el("circle", { cx: s * 0.68, cy: -s * 0.14, r: s * 0.16, fill: col }, g);
  if (s > 20) { /* feature birds get a beak + warm rim + eye */
    V2.el("path", { d: `M ${s * 0.8} ${-s * 0.12} l ${s * 0.34} ${s * 0.06} l ${-s * 0.34} ${s * 0.1} z`, fill: DUSK.horizon2 }, g);
    V2.el("ellipse", { cx: s * 0.1, cy: 0, rx: s * 0.82, ry: s * 0.44, fill: "none", stroke: DUSK.horizon, "stroke-width": 4, opacity: 0.75 }, g);
    V2.el("circle", { cx: s * 0.68, cy: -s * 0.16, r: s * 0.07, fill: "#12101F" }, g);
  }
  return g;
}
/* deterministic murmuration: pure function of (t, i). Center wanders
   on incommensurate sines (sharp organic turns); birds orbit + jitter. */
function flockPos(i, t, seed, spread) {
  const cx = 560 + 210 * Math.sin(t / 3.1 + seed) + 120 * Math.sin(t / 1.7 + seed * 2.3);
  const cy = 700 + 120 * Math.sin(t / 2.3 + seed * 1.4) + 70 * Math.sin(t / 1.13 + seed);
  const r = spread * (0.3 + 0.7 * V2.rnd(seed + 40, i));
  const dir = V2.rnd(seed + 80, i) > 0.18 ? 1 : -1;
  const w = 0.55 + V2.rnd(seed + 120, i) * 0.5;
  const a = t * w * dir + V2.rnd(seed + 160, i) * 6.28;
  const sq = 0.62; /* vertical squash: wide ribbon mass */
  const jit = 26 + 20 * V2.rnd(seed + 200, i);
  const x = cx + Math.cos(a) * r + Math.sin(t / 0.9 + i * 1.7) * jit * 0.4;
  const y = cy + Math.sin(a) * r * sq + Math.cos(t / 0.7 + i * 2.1) * jit * 0.3;
  return { x, y, cx, cy };
}
function murmuration(t, n, seed, spread, cam, opts) {
  const o = opts || {};
  /* soft mass haze under the birds (reads as one creature) */
  const p0 = flockPos(0, t, seed, spread);
  V2.el("ellipse", { cx: p0.cx, cy: p0.cy, rx: spread * 1.15, ry: spread * 0.62,
    fill: DUSK.sil, opacity: 0.13, filter: "url(#vBlur16)" }, cam);
  for (let i = 0; i < n; i++) {
    const p = flockPos(i, t, seed, spread);
    const q = flockPos(i, t + 0.06, seed, spread);
    const ang = Math.atan2(q.y - p.y, q.x - p.x);
    const s = (o.s || 9) * (0.75 + V2.rnd(seed + 300, i) * 0.5);
    const straggler = i % 13 === 0;
    const px = straggler ? p.x + Math.sin(i * 3.1) * spread * 0.45 : p.x;
    const py = straggler ? p.y + Math.cos(i * 2.3) * spread * 0.3 : p.y;
    bird(px, py, s, ang, t, V2.rnd(seed + 400, i) * 6.28, cam,
      { opacity: o.opacity === undefined ? 1 : o.opacity });
  }
}

/* ---------- diagram furniture: stamp cards (v3#4 fast cuts) ---------- */
/* the stage panel: Kurzgesagt-style dark rounded panel that anchors a
   diagram beat (fix for the day-008 autopsy: 'floating in empty sky') */
function stagePanel(cam, opts) {
  const o = Object.assign({ x: 90, y: 360, w: 900, h: 700, op: 0.62 }, opts || {});
  const g = V2.el("g", {}, cam);
  V2.el("rect", { x: o.x - 24, y: o.y - 24, width: o.w + 48, height: o.h + 48, rx: 54,
    fill: "#0A0F26", opacity: o.op }, g);
  V2.el("rect", { x: o.x, y: o.y, width: o.w, height: o.h, rx: 40,
    fill: "#101832", stroke: "#2A3560", "stroke-width": 4, opacity: 0.92 }, g);
  V2.el("rect", { x: o.x + 14, y: o.y + 14, width: o.w - 28, height: o.h - 28, rx: 30,
    fill: "none", stroke: "#3A4878", "stroke-width": 2, opacity: 0.55 }, g);
  /* corner registration ticks */
  [[o.x + 26, o.y + 26, 1, 1], [o.x + o.w - 26, o.y + 26, -1, 1],
   [o.x + 26, o.y + o.h - 26, 1, -1], [o.x + o.w - 26, o.y + o.h - 26, -1, -1]]
    .forEach(([tx, ty, dx, dy]) =>
      V2.el("path", { d: `M ${tx + dx * 26} ${ty} L ${tx} ${ty} L ${tx} ${ty + dy * 26}`,
        stroke: "#59639A", "stroke-width": 4, fill: "none", opacity: 0.7 }, g));
  return g;
}
function stampCard(x, y, k, t0, icon, label, parent, accent, size) {
  /* k: 0..1 pop-in progress; anticipation + backOut settle;
     size: card box size in px (default 300) — scales icons too */
  const S = (size || 300) / 300;
  const pop = V2.backOut(V2.clamp01(k));
  const w = 300, h = 300;
  const g = V2.el("g", { transform: `translate(${x} ${y}) scale(${(0.5 + 0.5 * pop) * S}) translate(${-x} ${-y})`, opacity: Math.min(1, k * 3) }, parent);
  V2.glow(x, y, w * 1.25, accent === P.teal ? "Teal" : "Warm", 0.34, g);
  V2.el("rect", { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 34, fill: "#141B38", stroke: "#2A3560", "stroke-width": 5 }, g);
  V2.el("rect", { x: x - w / 2 + 12, y: y - h / 2 + 12, width: w - 24, height: h - 24, rx: 24, fill: "none", stroke: "#3A4878", "stroke-width": 2, opacity: 0.7 }, g);
  icon(g);
  if (label) V2.tag(x, y + h / 2 + 6, Math.max(0, k - 0.15) * 24, label, null, 18, g, accent || DUSK.horizon2);
  return g;
}
function xStrike(x, y, k, parent) {
  const p = V2.clamp01(k);
  V2.el("circle", { cx: x, cy: y, r: 116 + 26 * (1 - p), fill: "#FF5A4A", opacity: 0.13 * p, style: "mix-blend-mode:screen" }, parent);
  V2.el("path", { d: `M ${x - 34} ${y - 34} L ${x + 34} ${y + 34} M ${x + 34} ${y - 34} L ${x - 34} ${y + 34}`,
    stroke: "#FF5A4A", "stroke-width": 14, "stroke-linecap": "round", opacity: 0.95 * p }, parent);
}

/* ============================================================
   SCENES (u = local progress, t = global time)
   ============================================================ */
const SCENES = {

  /* HOOK — the premise at t=0: a dusk sky FULL of birds. Hero gawks. */
  hook(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 980, V2.kf(t, [[0, 1.0], [110, 1.07]])) });
    duskSky(t, cam);
    murmuration(t, 200, 3, 360, cam, { s: 8 });
    /* a second, higher sheet of stragglers — the sky is FULL */
    for (let i = 0; i < 36; i++) {
      const x = ((V2.rnd(31, i) * 1240 + t * (26 + V2.rnd(33, i) * 22)) % 1240) - 80;
      const y = 100 + V2.rnd(35, i) * 460 + Math.sin(t / 1.3 + i) * 18;
      bird(x, y, 6 + V2.rnd(37, i) * 4, Math.sin(t / 4 + i) * 0.24, t, i, cam);
    }
    /* hero small on the field, shield-eyes gawking up (spec: small, bottom-left) */
    const px = 240, py = 1395;
    groundPatch(px, py, 0.85, cam);
    scarf(px, py, 0.85, t, cam);
    V2.Hero(pose("skygawk", t, px, py, 0.85), null, "vRimR", 1, cam);
    /* one bird swoops LOW over the hero (near-ground whoosh) */
    const bx = -60 + u * 1250, by = 1240 + Math.sin(u * 5.2) * 60;
    bird(bx, by, 14, 0.1 + Math.sin(u * 5.2) * 0.2, t, 2, cam);
    /* KINETIC TITLE — the premise visualized, word-synced (final-check fix:
       frame 0 must sell "10,000 birds / no crashes", not just mood) */
    const tau = t - TL[0].start;
    const bigWord = (txt, at, y, size, fill) => {
      if (tau < at) return;
      const k = V2.backOut(V2.clamp01((tau - at) / 0.26));
      V2.txt(540, y + (1 - k) * 26, txt, { "text-anchor": "middle", "font-family": V2.UI_DISPLAY,
        "font-weight": 800, "font-size": size * (0.7 + 0.3 * k), fill,
        style: "filter: drop-shadow(0 6px 16px rgba(0,0,0,0.9)) drop-shadow(0 0 30px rgba(255,138,61,0.35))" }, cam);
    };
    if (tau > 0.12) V2.glow(540, 420, 330 * V2.clamp01((tau - 0.12) / 0.3), "Warm", 0.32, cam);
    bigWord("10,000 BIRDS", 0.15, 330, 128, "#FFFFFF");
    bigWord("1 SKY", 1.35, 460, 84, "#FFFFFF");
    bigWord("0 AIR TRAFFIC CONTROL", 1.95, 570, 62, "#FFD9A0");
  },

  /* S0 — the murmuration twists like ONE creature. near-miss spark. */
  s0(u, t) {
    const cam = V2.el("g", { transform: V2.cam(560, 880, V2.kf(t, [[0, 1.0], [150, 1.07]])) });
    duskSky(t, cam, { sunX: 300, sunY: 1160 });
    murmuration(t, 150, 11, 340, cam, { s: 9 });
    /* the near-miss: two birds cross CLOSE at "almost never hit" (~u .55) */
    const k = V2.clamp01((u - 0.5) / 0.12);
    if (k > 0) {
      const ax = 760 - u * 900, ay = 620 + Math.sin(u * 7) * 40;
      const bx2 = 320 + u * 760, by2 = 760 - Math.sin(u * 6) * 30;
      bird(ax, ay, 12, Math.PI - 0.2, t, 1, cam);
      bird(bx2, by2, 12, 0.2, t, 5, cam);
      if (k < 1) { /* amber spark + whoosh ticks at closest pass */
        const mx = (ax + bx2) / 2, my = (ay + by2) / 2;
        V2.sparkle(mx, my, t * 8 % 26, 0.8, "#FFD9A0", cam);
        [[-1, -0.4], [1, 0.4]].forEach(([sx, sy]) =>
          V2.el("line", { x1: mx + sx * 26, y1: my + sy * 26, x2: mx + sx * 54, y2: my + sy * 54,
            stroke: P.amber, "stroke-width": 4, "stroke-linecap": "round", opacity: 0.8 }, cam));
      }
    }
  },

  /* S1 — head-on course → the two cards → veer right + altitude split. */
  s1(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 900, V2.kf(t, [[0, 1.0], [160, 1.06]])) });
    duskSky(t, cam, { sunX: 940, sunY: 1250 });
    stagePanel(cam, { x: 90, y: 400, w: 900, h: 620 });
    const tau = t - TL[2].start; /* local seconds (audio-timed beats) */
    /* faint horizon line the altitude split will reference */
    V2.el("line", { x1: 160, y1: 800, x2: 920, y2: 800, stroke: "#8A93B8", "stroke-width": 3,
      "stroke-dasharray": "2 22", opacity: 0.5 }, cam);
    /* the impact-point telegraph: projected collision pulses with danger */
    if (tau < 2.55) {
      const pulse = 0.55 + 0.45 * Math.sin(t * 9);
      V2.el("circle", { cx: 540, cy: 730, r: 34 + 10 * pulse, fill: "none", stroke: "#FF5A4A",
        "stroke-width": 5, opacity: 0.85 * pulse }, cam);
      V2.el("path", { d: "M 526 716 L 554 744 M 554 716 L 526 744", stroke: "#FF5A4A",
        "stroke-width": 9, "stroke-linecap": "round", opacity: 0.9 }, cam);
      V2.el("circle", { cx: 540, cy: 730, r: 60, fill: "#FF5A4A", opacity: 0.14 * pulse, style: "mix-blend-mode:screen" }, cam);
    }
    /* two feature birds close head-on 0→2.3s, then the fork.
       Top-down chirality: each bird's RIGHT — left bird (heading east)
       breaks down-right; right bird (heading west) breaks up-left. */
    const closing = V2.clamp01(tau / 2.3);
    const veer = V2.easeInOut(V2.clamp01((tau - 2.55) / 0.7));
    const alt = V2.easeInOut(V2.clamp01((tau - 3.3) / 0.7));
    const lx0 = 200 + closing * 300, rx0 = 880 - closing * 300;
    const fork = 150 * veer;
    /* speed lines behind each closing bird (motion + tension) */
    if (tau < 2.6) {
      for (let k = 0; k < 3; k++) {
        V2.el("line", { x1: lx0 - 120 - k * 44, y1: 730 - k * 12, x2: lx0 - 54, y2: 730 - k * 12,
          stroke: "#8A93B8", "stroke-width": 5, "stroke-linecap": "round", opacity: 0.5 - k * 0.13 }, cam);
        V2.el("line", { x1: rx0 + 54, y1: 730 - k * 12, x2: rx0 + 120 + k * 44, y2: 730 - k * 12,
          stroke: "#8A93B8", "stroke-width": 5, "stroke-linecap": "round", opacity: 0.5 - k * 0.13 }, cam);
      }
    }
    /* trajectories: dashed amber, forking apart at the veer */

    const heroG = V2.el("g", { "clip-path": `url(#${clipId})` }, cam);
    scarf(760 + 82 * 1.34, 1480 - 16 * 1.34, 0.56, t, heroG);
    V2.Hero(pose("driving", t, 760 + 82 * 1.34, 1480 - 16 * 1.34, 0.56), null, "vRimR", 0, heroG);
    /* exhaust puffs from the lead car */
    for (let i = 0; i < 3; i++) {
      const pu = (t * 0.4 + i * 0.33) % 1;
      V2.el("circle", { cx: 360 + pu * 70, cy: 1320 - pu * 52, r: 10 + pu * 20, fill: "#8A93B8", opacity: 0.48 * (1 - pu) }, cam);
    }
    /* the bird: arrow-straight, clean, flies past and UP into the flock */
    const bx = -40 + u * 1160, by = 980 - tiltUp * 160 + Math.sin(u * 9) * 10;
    bird(bx, by, 24, -0.12, t, 2, cam);
    /* the flock it rejoins: sky fills as we tilt up (loop mirror of hook) */
    if (tiltUp > 0.05) {
      murmuration(t, 120, 3, 320, cam, { s: 8, opacity: 0.35 + 0.65 * tiltUp });
      for (let i = 0; i < 18; i++) {
        const x = ((V2.rnd(31, i) * 1240 + t * (26 + V2.rnd(33, i) * 22)) % 1240) - 80;
        const y = 140 + V2.rnd(35, i) * 340;
        bird(x, y, 6 + V2.rnd(37, i) * 4, Math.sin(t / 4 + i) * 0.24, t, i, cam,
          { opacity: 0.35 + 0.65 * tiltUp });
      }
    }
    /* no fade-out: the loop cuts straight back into the hook frame */
  },
};

const EMPHASIS = {
  hook: ["thousand", "zero"],
  s0: ["one", "creature"],
  s1: ["right", "height", "two"],
  s2: ["rule"],
  s3: ["seven", "flock"],
  s4: ["one", "bends"],
  s5: ["seven", "rule"],
  s6: ["solved"],
};

function renderFrame(t) {
  V2.root.innerHTML = "";
  duskDefs();
  V2.el("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: DUSK.skyTop });
  V2.defs(V2.root);
  let idx = TL.length - 1;
  for (let i = 0; i < TL.length; i++)
    if (t < TL[i].end - 1e-6) { idx = i; break; }
  const sc = TL[idx];
  const u = V2.clamp01((t - sc.start) / (sc.end - sc.start));
  (SCENES[sc.id] || SCENES.hook)(u, t);
  V2.grade(t);
  V2.caption(sc.narration, u, EMPHASIS[sc.id]);
}
window.renderFrame = renderFrame;
renderFrame(0);
</script>
