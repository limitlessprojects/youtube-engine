<script>
/* ============================================================
   Short #0007 — "What if you were the last doctor on Earth?"
   Compassion+dread+duty register (brief 9/10 alignment). Pattern
   = #0008 v3: ONE lit subject in the dark — a single hospital
   bed under a surgical lamp — one continuous take. C18: every
   event is timed on u (fraction of the scene) and lands u>=0.8;
   no fixed-seconds pops. Deterministic: pure function of t (C6).
   r1-r5 directives baked in from line one: title ON frame-0;
   exposure reads DARK-AND-LIT not void (floor band, ambient
   lift, vignette eased to 0.45); tighter cameras on the small
   count scenes (s1/s2/s3); s7 truck dominant; labels inside
   safe margins; blood-colour cue clearly visible in s1.
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
V2.root = document.getElementById("frame");
const P = V2.P;
const TITLE_FONT = "'Bricolage Grotesque', sans-serif";
const MONO = "'Fragment Mono', monospace";
const E = V2.el, cl = V2.clamp01, lerp = V2.lerp;
const _ctx = document.createElement("canvas").getContext("2d");
const meas = (s, font) => { _ctx.font = font; return _ctx.measureText(s).width; };
const sstep = (a, b, v) => { const x = cl((v - a) / (b - a)); return x * x * (3 - 2 * x); };
const seg = (u, a, b) => cl((u - a) / (b - a));
const pathOf = (a, close) => "M " + a.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ") + (close ? " Z" : "");
const pr = (x, z) => [x, z];

/* ---------- ward palette + layout (single source of truth — no magic 518s) ---------- */
const K = {
  sheet: "#F3ECDD", sheetDim: "#39415E", mattress: "#DCCFB6", rail: "#8B93B8",
  steel: "#DDE7F6", blood: "#B3392E", bloodHi: "#E06550", frost: "#CFE8FF",
  vial: "#EAF3FF", ice: "#9FC4E8", townLit: "#FFB054", sign: "#F6EFE3",
};
const BED = { x: 540, y: 1150, w: 470, sheetTop: 1042 };   /* the ONE lit bed */
const LAMP = { x: 540, headY: 556, coneR: 320 };           /* the only light source */
const WOUND = { x: 512, y: 1258, w: 300 };                 /* s4/s5 wound zone (arm on the bed) */
const FLOOR_Y = 1436;
const WIN_R = { x: 782, y: 648, w: 212, h: 356 };          /* the feature window (s6/s9) */

/* ---------- the doctor (recurring hero — r1 directive) ---------- */
const DOC_LOOK = {
  skin: "#F6EFE3", skinShade: "#E2D3BE", hand: "#F6EFE3",
  jacket: "#1E6E66", jacketShade: "#154F4A", accent: "#FFB054",
  limb: "#EFE2CC", line: "#121019", shoe: "#2FB7A6",
  face: "#1D2033", hair: "#1D2033", extra: "none",
};
const DPOSE = {
  watch: { tilt: -2, headTilt: 7, look: 0.5, expr: "neutral", armL: { a: 16, b: -10 }, armR: { a: 12, b: -6 } },
  reach: { tilt: 6, headTilt: 10, look: 0.6, expr: "worried", armR: { a: 64, b: -38 }, armL: { a: 20, b: -8 } },
  steady: { tilt: 0, headTilt: 9, look: 0.55, expr: "neutral", armL: { a: 14, b: -6 }, armR: { a: 40, b: -30 } },
  walkaway: { tilt: 3, headTilt: 4, look: 0.3, expr: "neutral", armL: { a: 22, b: -14 }, armR: { a: -6, b: -10 } },
  scribe: { tilt: -8, headTilt: 12, look: 0.7, expr: "tired", armR: { a: 58, b: -70 }, armL: { a: 30, b: -30 } },
};
const blinkAt = (t) => (V2.rnd(41, Math.floor(t / 2.3)) < 0.5 && (t % 2.3) < 0.14 ? 1 : 0);
function doctor(t, pose, x, y, sc, extra) {
  const base = DPOSE[pose] || {}, sw = Math.sin(t * 1.9) * 7;
  /* r8: idle life a 10fps filmstrip can SEE — weight-shift bob, deeper sway,
     breathing squash, slow head drift (character_life directive, round 7) */
  const p = Object.assign({}, V2.basePose, base, { x: x + Math.sin(t * 0.55) * 7 * sc,
    y: y - 6 * sc + Math.sin(t * 2.4) * 3 * sc + Math.sin(t * 0.8) * 5 * sc,
    scale: sc, facing: (extra && extra.facing) || -1, blink: blinkAt(t),
    tilt: (base.tilt || 0) + Math.sin(t * 1.6) * 1.8 + Math.sin(t * 0.7) * 1.2,
    headTilt: (base.headTilt || 0) + Math.sin(t * 0.5) * 2.2,
    squash: 0.021 * Math.sin(t * 2.4), sway: Math.sin(t * 1.9) * 9 }, extra || {});
  p.armL = Object.assign({}, p.armL, { a: p.armL.a + sw });
  p.armR = Object.assign({}, p.armR, { a: p.armR.a - sw * 0.7 });
  V2.Hero(p, DOC_LOOK, "vRimR", 1);
  /* stethoscope: a small arc + chestpiece at the torso — the doctor mark */
  const j = V2.joints(p), ch = j.head;
  E("path", { d: `M ${ch.x - 20 * sc} ${ch.y + 66 * sc} q ${-14 * sc} ${44 * sc} ${26 * sc} ${58 * sc}`, stroke: P.ink, "stroke-width": 7, fill: "none", "stroke-linecap": "round" });
  E("circle", { cx: ch.x + 6 * sc, cy: ch.y + 126 * sc, r: 11 * sc, fill: P.teal, stroke: P.ink, "stroke-width": 5 });
  return p;
}
const handOf = (p, arm) => V2.toWorld(p, V2.joints(p)[arm].end);

/* ---------- text systems (screen space; ≤8 words — C1) ---------- */
function title(lines, y, size, kf) {
  lines.forEach((ln, i) => {
    const k = kf(i); if (k <= 0.001) return;
    const pop = V2.backOut(cl(k));
    V2.txt(540, y + i * size * 1.06 + (1 - pop) * 50, ln, { "text-anchor": "middle", "font-family": TITLE_FONT, "font-weight": 800,
      "font-size": size, fill: P.cream, stroke: P.ink, "stroke-width": 16, "stroke-linejoin": "round", "paint-order": "stroke", opacity: cl(k * 2) });
  });
}
function chip(k, x, y, text, accent, size) {
  if (k <= 0.001) return;
  size = size || 44;
  const pop = V2.backOutBig(cl(k)), w = text.length * size * 0.6 + 86, h = size * 1.75;
  const g = E("g", { opacity: cl(k * 3), transform: `translate(${x} ${y}) scale(${0.7 + 0.3 * pop})` });
  E("rect", { x: -w / 2, y: -h / 2 + 7, width: w, height: h, rx: h * 0.28, fill: "#000", opacity: 0.35 }, g);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: h * 0.28, fill: P.ink, stroke: P.cream, "stroke-width": 4 }, g);
  E("rect", { x: -w / 2 + 18, y: -h * 0.25, width: 10, height: h * 0.5, rx: 5, fill: accent || P.teal }, g);
  V2.txt(14, size * 0.34, text, { "text-anchor": "middle", "font-family": MONO, "font-size": size, fill: P.cream, "letter-spacing": 1 }, g);
}
function stamp2(k, y, l1, l2, sub, subK) {
  if (k <= 0.001) return;
  const pop = V2.backOutBig(cl(k)), size = 96, font = `800 ${size}px ${TITLE_FONT}`;
  const w = Math.min(1000, Math.max(meas(l1, font), meas(l2, font)) + 90);
  const g = E("g", { opacity: cl(k * 3), transform: `translate(540 ${y}) scale(${0.6 + 0.4 * pop}) rotate(${(1 - pop) * -4})` });
  E("rect", { x: -w / 2, y: -158 + 12, width: w, height: 316, rx: 30, fill: "#000", opacity: 0.4 }, g);
  E("rect", { x: -w / 2, y: -158, width: w, height: 316, rx: 30, fill: P.ink, stroke: P.amber, "stroke-width": 6 }, g);
  V2.txt(0, -56, l1, { "text-anchor": "middle", "font-family": TITLE_FONT, "font-weight": 800, "font-size": size, fill: P.amber,
    textLength: Math.min(w - 80, meas(l1, font)), lengthAdjust: "spacingAndGlyphs" }, g);
  V2.txt(0, 64, l2, { "text-anchor": "middle", "font-family": TITLE_FONT, "font-weight": 800, "font-size": size, fill: P.amber,
    textLength: Math.min(w - 80, meas(l2, font)), lengthAdjust: "spacingAndGlyphs" }, g);
  if (sub && subK > 0.001) V2.txt(0, 134, sub, { "text-anchor": "middle", "font-family": MONO, "font-size": 40, fill: P.cream, opacity: cl(subK * 2), "letter-spacing": 1.5 }, g);
}
const ring = (x, y, k, col) => { if (k > 0 && k < 1) E("ellipse", { cx: x, cy: y, rx: 16 + k * 90, ry: 6 + k * 30, fill: "none", stroke: col || "#FFF6EA", "stroke-width": 8 * (1 - k), opacity: 1 - k }); };

/* ---------- the ward (walls, floor band, windows, distant beds) ---------- */
function wardBase(t, o) {
  o = o || {};
  E("rect", { x: -500, y: -500, width: 2080, height: 2920, fill: P.bgDeep });
  /* wainscot panels + horizon band */
  E("rect", { x: -500, y: 880, width: 2080, height: FLOOR_Y - 880, fill: "#0C1230" });
  for (let i = 0; i < 8; i++) E("rect", { x: -60 + i * 160, y: 906, width: 128, height: FLOOR_Y - 946, rx: 10, fill: P.bgRaised, opacity: 0.8 });
  E("rect", { x: -500, y: FLOOR_Y - 26, width: 2080, height: 26, fill: "#05060F" });
  /* floor with tiles + a soft catchlight streak under the lit bed */
  E("rect", { x: -500, y: FLOOR_Y, width: 2080, height: 2920 - FLOOR_Y, fill: "#0B0F24" });
  E("rect", { x: -500, y: FLOOR_Y, width: 2080, height: 6, fill: "#1A2138", opacity: 0.8 });
  for (let i = 0; i < 7; i++) E("path", { d: `M ${-260 + i * 270} 2920 L ${140 + i * 140} ${FLOOR_Y}`, stroke: "#141B33", "stroke-width": 5, fill: "none" });
  E("rect", { x: 248, y: FLOOR_Y, width: 584, height: 300, fill: "url(#wFloorGlow)" });
  /* windows: left small, right = the feature window; night state unless o.dawn */
  const win = (x, y, w, h, big) => {
    const id = V2.uid("wGlass"), cp = E("clipPath", { id }, V2.defsHold);
    E("rect", { x, y, width: w, height: h, rx: 8 }, cp);
    const gg = E("g", { "clip-path": `url(#${id})` });
    const lg = o.dawn ? "wDawn" : "wNight";
    E("rect", { x, y, width: w, height: h, fill: `url(#${lg})` }, gg);
    if (o.dawn) {
      E("circle", { cx: x + w * 0.42, cy: y + h * 0.62, r: 30, fill: "#FFE9C4" }, gg);
      V2.glow(x + w * 0.42, y + h * 0.62, w * 1.1, "Warm", 0.65, gg);
    } else {
      for (let i = 0; i < (big ? 7 : 4); i++) E("circle", { cx: x + 20 + V2.rnd(3, i) * (w - 40), cy: y + 20 + V2.rnd(4, i) * (h - 120), r: 1.6 + V2.rnd(5, i) * 1.6, fill: "#DDE7F6", opacity: 0.7 }, gg);
      if (big) { /* the night town: silhouettes + a handful of lit windows (s6 pays this off) */
        for (let i = 0; i < 6; i++) {
          const bw = w * (0.14 + V2.rnd(6, i) * 0.1), bh = h * (0.16 + V2.rnd(7, i) * 0.3), bx = x + 6 + i * (w / 6);
          E("rect", { x: bx, y: y + h - 26 - bh, width: bw, height: bh, fill: "#0A0D22" }, gg);
          E("rect", { x: bx, y: y + h - 26 - bh, width: bw, height: 4, fill: "#161B38" }, gg);
        }
        [[0.2, 0.72], [0.45, 0.6], [0.66, 0.78], [0.84, 0.55]].forEach((p, i) => {
          const on = o.townLights === undefined || o.townLights[i] !== 0;
          if (on) E("rect", { x: x + w * p[0], y: y + h * p[1], width: 9, height: 12, fill: K.townLit, opacity: 0.85 + 0.15 * Math.sin(t * 2 + i) }, gg);
        });
      } else E("circle", { cx: x + w * 0.7, cy: y + h * 0.3, r: 14, fill: "#E8EFFA", opacity: 0.85 }, gg);
    }
    E("rect", { x: x - 10, y: y - 10, width: w + 20, height: h + 20, rx: 12, fill: "none", stroke: P.ink, "stroke-width": 14 }, gg);
    E("path", { d: `M ${x + w / 2} ${y} L ${x + w / 2} ${y + h} M ${x} ${y + h / 2} L ${x + w} ${y + h / 2}`, stroke: P.ink, "stroke-width": 9 }, gg);
    return gg;
  };
  win(128, 668, 150, 250, false);
  win(WIN_R.x, WIN_R.y, WIN_R.w, WIN_R.h, true);
  /* distant empty beds: the ward has scale, and only ONE bed is lit */
  bedDark(196, 1298, 0.6, t); bedDark(884, 1298, 0.6, t); bedDark(36, 1272, 0.48, t);
  /* ceiling: the dead strip lights (s2 kills them) */
  o.strips !== 0 && [0, 1, 2, 3].forEach((i) => {
    const dead = o.strips || 0, k = seg(dead, i * 0.25, i * 0.25 + 0.55);
    const flick = (i === 3 && dead > 0.3 && dead < 0.62) ? (Math.sin(t * 46) > 0 ? 1 : 0.15) : 1;
    E("rect", { x: 130 + i * 230, y: 168, width: 150, height: 16, rx: 8, fill: "#1B2242", opacity: 1 }, V2.root);
    E("rect", { x: 130 + i * 230, y: 168, width: 150, height: 16, rx: 8, fill: "#BFD2EE", opacity: 0.30 * (1 - k) * flick }, V2.root);
  });
}
function bedDark(x, y, sc, t) {
  const g = E("g", { transform: `translate(${x} ${y}) scale(${sc})`, opacity: 0.9 });
  E("rect", { x: -150, y: -46, width: 300, height: 60, rx: 12, fill: "#232B4C", stroke: P.ink, "stroke-width": 7 }, g);
  E("path", { d: "M -150 -30 q 40 -26 90 -20 q 70 8 130 -6 l 0 26 l -220 0 Z", fill: "#2A3358", stroke: P.ink, "stroke-width": 6 }, g);
  E("path", { d: "M -160 -40 L -160 40 M 160 -40 L 160 40", stroke: "#39415E", "stroke-width": 10 }, g);
  E("circle", { cx: -96, cy: 44, r: 12, fill: "none", stroke: "#39415E", "stroke-width": 7 }, g);
  E("circle", { cx: 96, cy: 44, r: 12, fill: "none", stroke: "#39415E", "stroke-width": 7 }, g);
}
/* floor detail: light pool + props that occupy the bottom third (r1-vh fix) */
function floorDressing() {
  E("rect", { x: 208, y: FLOOR_Y, width: 664, height: 340, fill: "url(#wFloorGlow)" });
  /* r9: the bed's reflection — a soft cream column + horizontal seams the eye
     reads as a polished lit floor (kills the bottom-third dead zone globally) */
  E("rect", { x: 320, y: FLOOR_Y, width: 440, height: 330, fill: "url(#wRefl)" });
  E("path", { d: `M 300 ${FLOOR_Y + 96} L 780 ${FLOOR_Y + 96} M 340 ${FLOOR_Y + 186} L 740 ${FLOOR_Y + 186}`, stroke: "#FFD7A0", "stroke-width": 4, opacity: 0.10 }, V2.root);
  E("path", { d: `M 380 ${FLOOR_Y + 280} L 700 ${FLOOR_Y + 280}`, stroke: "#FFD7A0", "stroke-width": 3, opacity: 0.07 }, V2.root);
  E("ellipse", { cx: BED.x, cy: FLOOR_Y + 120, rx: 420, ry: 90, fill: "#FFB054", opacity: 0.07, style: "mix-blend-mode:screen" });
  /* IV stand right of the bed */
  E("path", { d: `M ${BED.x + 352} ${FLOOR_Y - 12} L ${BED.x + 352} ${FLOOR_Y - 300}`, stroke: "#59628C", "stroke-width": 9 }, V2.root);
  E("circle", { cx: BED.x + 352, cy: FLOOR_Y - 318, r: 22, fill: "none", stroke: "#59628C", "stroke-width": 8 }, V2.root);
  E("rect", { x: BED.x + 326, y: FLOOR_Y - 296, width: 52, height: 70, rx: 12, fill: K.blood, stroke: P.ink, "stroke-width": 5 }, V2.root);
  /* a dropped blanket near the left beds */
  E("path", { d: `M 96 ${FLOOR_Y + 88} q 44 -30 96 -6 q 52 22 88 -10 l -12 44 q -86 26 -160 2 Z`, fill: "#232B4C", stroke: P.ink, "stroke-width": 6 }, V2.root);
  for (let i = 0; i < 5; i++) E("circle", { cx: 140 + V2.rnd(51, i) * 320, cy: FLOOR_Y + 220 + V2.rnd(52, i) * 60, r: 2.5 + V2.rnd(53, i) * 3, fill: "#39415E", opacity: 0.6 }, V2.root);
}
/* ---------- the lit bed: frame, patient under a breathing sheet, rails ---------- */
function bedLit(t, breath) {
  const bx = BED.x, top = BED.sheetTop, w = BED.w;
  V2.glow(bx, top + 130, 420, "Warm", 0.55);
  const g = E("g", {});
  E("rect", { x: bx - w / 2 - 14, y: top + 148, width: w + 28, height: 26, rx: 10, fill: "#39415E", stroke: P.ink, "stroke-width": 7 }, g);
  E("path", { d: `M ${bx - w / 2 - 6} ${top + 150} L ${bx - w / 2 - 6} ${top - 40} M ${bx + w / 2 + 6} ${top + 150} L ${bx + w / 2 + 6} ${top - 40}`, stroke: "#59628C", "stroke-width": 12 }, g);
  /* mattress + the patient hump (breath: the sheet slowly rises and falls) */
  const br = (breath === undefined ? 1 : breath) * Math.sin(t * 1.05) * 0.5 + 0.5;
  E("rect", { x: bx - w / 2, y: top + 66, width: w, height: 70, rx: 14, fill: K.mattress, stroke: P.ink, "stroke-width": 7 }, g);
  E("path", { d: `M ${bx - w / 2} ${top + 70} q ${w * 0.16} ${-44 - br * 14} ${w * 0.30} ${-40 - br * 12} q ${w * 0.24} ${6} ${w * 0.40} ${-6} q ${w * 0.16} ${-10} ${w * 0.30} ${-16} L ${bx + w / 2} ${top + 70} Z`,
    fill: K.sheet, stroke: P.ink, "stroke-width": 8, "stroke-linejoin": "round" }, g);
  /* head on the pillow (right end) */
  E("circle", { cx: bx + w * 0.34, cy: top + 44 - br * 4, r: 34, fill: P.cream, stroke: P.ink, "stroke-width": 7 }, g);
  E("rect", { x: bx + w * 0.36, y: top + 96, width: 108, height: 34, rx: 14, fill: K.sheet, stroke: P.ink, "stroke-width": 6 }, g);
  /* side rail */
  E("path", { d: `M ${bx - w / 2 + 24} ${top + 96} L ${bx + w / 2 - 24} ${top + 96}`, stroke: K.rail, "stroke-width": 9 }, g);
  [0.25, 0.75].forEach((p) => E("path", { d: `M ${bx - w / 2 + p * w} ${top + 96} L ${bx - w / 2 + p * w} ${top + 150}`, stroke: K.rail, "stroke-width": 8 }, g));
  /* wheels */
  [-w / 2 - 6, w / 2 + 6].forEach((dx) => E("circle", { cx: bx + dx, cy: top + 186, r: 15, fill: "#232B4C", stroke: P.ink, "stroke-width": 6 }, g));
  return g;
}
/* ---------- the surgical lamp: the ward's only light ---------- */
function lamp(t, k) {
  k = k === undefined ? 1 : k;
  const g = E("g", { opacity: 1 });
  E("path", { d: `M ${LAMP.x + 190} 0 L ${LAMP.x + 60} ${LAMP.headY - 92} M ${LAMP.x - 190} 0 L ${LAMP.x - 60} ${LAMP.headY - 92}`, stroke: "#39415E", "stroke-width": 14 }, g);
  E("path", { d: `M ${LAMP.x} ${LAMP.headY - 96} L ${LAMP.x} ${LAMP.headY - 40}`, stroke: "#39415E", "stroke-width": 18 }, g);
  E("rect", { x: LAMP.x - 108, y: LAMP.headY - 42, width: 216, height: 52, rx: 18, fill: "#2E3A66", stroke: P.ink, "stroke-width": 7 }, g);
  [-66, -22, 22, 66].forEach((dx) => E("circle", { cx: LAMP.x + dx, cy: LAMP.headY - 16, r: 12, fill: "#FFE9C4", opacity: 0.9 * k }, g));
  /* the cone */
  const cg = E("linearGradient", { id: "wCone", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#FFE9C4", 0.34 * k], ["70%", "#FFD7A0", 0.10 * k], ["100%", "#FFD7A0", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, cg));
  E("path", { d: `M ${LAMP.x - 84} ${LAMP.headY + 8} L ${LAMP.x + 84} ${LAMP.headY + 8} L ${LAMP.x + LAMP.coneR} ${FLOOR_Y} L ${LAMP.x - LAMP.coneR} ${FLOOR_Y} Z`, fill: "url(#wCone)" }, g);
  V2.glow(LAMP.x, LAMP.headY + 10, 300 * k, "Warm", 0.8 * k, g);
  V2.glow(LAMP.x, BED.sheetTop + 120, 480 * k, "Warm", 0.5 * k, g);
  return g;
}
/* ---------- ECG: deterministic scrolling heartbeat on the rail ---------- */
function ecg(t, x, y, w, h, alive) {
  const g = E("g", {});
  E("rect", { x: x - 14, y: y - h / 2 - 14, width: w + 28, height: h + 28, rx: 14, fill: "#0A0E20", stroke: P.ink, "stroke-width": 7 }, g);
  let d = "";
  const period = 0.95, scroll = (t / period) * 46;
  for (let i = 0; i <= w; i += 4) {
    const ph = ((i + scroll) % 46) / 46, cyc = ph * period;
    let v = 0;
    if (cyc < 0.06) v = -Math.sin((cyc / 0.06) * Math.PI) * 0.35;
    else if (cyc < 0.16) v = Math.sin(((cyc - 0.06) / 0.10) * Math.PI) * 1.0;
    else if (cyc < 0.24) v = -Math.sin(((cyc - 0.16) / 0.08) * Math.PI) * 0.42;
    d += (i ? " L " : "M ") + (x + i).toFixed(1) + " " + (y + v * h * 0.42 * (alive === 0 ? 0.12 : 1)).toFixed(1);
  }

        [[hR, 0], [hL, 1]].forEach((pair, i) => {
          const h = pair[0];
          const gp = ((u - 0.24) * 3 + i * 0.5) % 1;
          E("path", { d: `M ${h[0]} ${h[1] - 10 - gp * 14} l 4 6 l -8 0 Z M ${h[0] - 2 + gp * 8} ${h[1] - 14 - gp * 14} l 2 10 l -6 -6`, stroke: "#FFFFFF", "stroke-width": 3, fill: "none", opacity: (1 - gp) * 0.9 }, V2.root);
        });
      }
      if (u >= 0.5 && u < 0.62) { const q = seg(u, 0.5, 0.62); E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "#FFE9C4", opacity: 0.22 * (1 - q) }, V2.root); ring(LAMP.x, LAMP.headY + 20, q, "#FFE9C4"); }
    } };
  },
  over(lt, u) {
    stamp2(seg(u, 0.52, 0.68), 620, "SOMEONE ALWAYS", "HAS TO STITCH.", "YOU'RE THE LAST DOCTOR ON EARTH", seg(u, 0.72, 0.84));
    title(TITLE, 205, 102, (i) => seg(u, 0.86 + i * 0.05, 0.96 + i * 0.05));
  } };

/* ---------- engine tail (the #0008 v3 pattern) ---------- */
function withCam(cam, fn) {
  const hold = V2.root;
  V2.root = E("g", { transform: V2.cam(cam[0], cam[1], cam[2]) }, hold);
  fn();
  V2.root = hold;
}
function camOf(idx, lt, dur) {
  const sc = SC[TL[idx].id], a = sc.cam[0], b = sc.cam[1], u = V2.easeInOut(cl(lt / dur) * 0.85 + 0.075);
  let c = [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
  if (idx > 0 && lt < 0.36) {   /* whip in from the previous scene's last camera: one continuous take */
    const pv = SC[TL[idx - 1].id].cam[1], k = V2.easeOutQuint(lt / 0.36);
    c = [lerp(pv[0], c[0], k), lerp(pv[1], c[1], k), lerp(pv[2], c[2], k)];
  }
  return c;
}

/* gradient defs used above (declared before renderFrame runs them lazily) */
function gradientDefs() {
  const rf = E("linearGradient", { id: "wRefl", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#F3ECDD", 0.16], ["60%", "#F3ECDD", 0.06], ["100%", "#F3ECDD", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, rf));
  const fog = E("linearGradient", { id: "wFog", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#243058", 0.0], ["55%", "#243058", 0.14], ["100%", "#243058", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, fog));
  const fb = E("linearGradient", { id: "wFogBand", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#243058", 0], ["50%", "#243058", 0.10], ["100%", "#243058", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, fb));
  const fg = E("linearGradient", { id: "wFloorGlow", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#FFB054", 0.10], ["100%", "#FFB054", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, fg));
  const ng = E("linearGradient", { id: "wNight", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#1A1038"], ["55%", "#0C1230"], ["100%", "#0A0D22"]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, ng));
  const dg = E("linearGradient", { id: "wDawn", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#FFD7A0"], ["40%", "#FFB054"], ["100%", "#3A2470"]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, dg));
}

function renderFrame(t) {
  V2.root.innerHTML = "";
  V2.defsHold = E("defs", {}, V2.root);
  V2.defs(V2.root);
  gradientDefs();
  let idx = TL.length - 1;
  for (let i = 0; i < TL.length; i++) if (t < TL[i].end - 1e-6) { idx = i; break; }
  const sc = TL[idx], def = SC[sc.id] || SC.hook;
  const lt = Math.max(0, t - sc.start), dur = sc.end - sc.start, u = cl(lt / dur);
  const cam = camOf(idx, lt, dur);
  const S = def.world(lt, u, t, dur);
  /* ambient lift: dark ward reads DARK-AND-LIT, never a void (r3/r4) */
  const amb = E("linearGradient", { id: "wAmb", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#243058", 0.16], ["60%", "#1A2444", 0.06], ["100%", "#05060F", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, amb));
  E("rect", { x: -20, y: -20, width: 1120, height: 1960, fill: "url(#wAmb)" });
  withCam(cam, () => {
    if (S.strips !== undefined) wardBase(t, { strips: S.strips, dawn: S.dawn });
    else if (S.dawn) wardBase(t, { dawn: true });
    else if (def !== SC.s7 && def !== SC.s8) wardBase(t, {});
    if (S.over) S.over();
  });
  def.over(lt, u, t, dur, cam);
  const vg = E("radialGradient", { id: "wVig", cx: "50%", cy: "46%" }, V2.defsHold);
  [["60%", "#05050A", 0], ["100%", "#05050A", 0.45]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, vg));
  E("rect", { x: -20, y: -20, width: 1120, height: 1960, fill: "url(#wVig)" });
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, filter: "url(#vGrain)", opacity: 0.5, transform: `translate(${(Math.floor(t * 15) % 2) * 3} ${Math.floor(t * 15) % 3})` });
}
window.renderFrame = renderFrame;
renderFrame(0);
</script>
