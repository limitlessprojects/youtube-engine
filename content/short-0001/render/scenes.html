<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#070A18;overflow:hidden;}
  #stage{width:1080px;height:1920px;position:relative;}
  svg{display:block;}
</style>
</head>
<body>
<div id="stage"><svg id="frame" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script src="../../../engine/core.js"></script>
<script src="../../../engine/space.js"></script>
<script src="../../../engine/rig.js"></script>
<script src="../../../engine/world.js"></script>
<script src="../../../engine/diagram.js"></script>
<script src="../../../engine/caption.js"></script>
<script>
/* ============================================================
   Short #0001 v2 — "What if a black hole appeared in your pocket?"
   Rebuilt on engine v2 (docs/visual-craft.md):
   · one rig character (kip) — two-segment limbs, mittens, shoes,
     expressions, rim light, contact shadow (anti-twig-man)
   · world fullness: night street w/ 25+ objects, lamp light,
     LightVeil pools, dust; space scenes w/ nebula depth layers
   · Kurzgesagt diagrams: chunky broken rings, glowing cores,
     draw-on schematic labels, counting numbers
   · the finish: vignette + grain on twos; three-type system
   Seek-driven: renderFrame(t) draws global time t.
   Timeline injected by tools/render_short.py (__TIMELINE__).
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
V2.root = document.getElementById("frame");
const P = V2.P;

/* ---------- pose presets (rig-native fields) ---------- */
const POSES = {
  curious:  { tilt: 4, yaw: 0.4, look: 0.35, headTilt: 4,
              armL: { a: 16, b: -12 }, armR: { a: 112, b: -58 }, handR: "point" },
  pointup:  { yaw: 0.75, tilt: 2, headTilt: -4, look: 0.5,
              armL: { a: -16, b: -10 }, armR: { a: 148, b: -4 }, handR: "point" },
  peerdown: { tilt: 9, yaw: 0.25, look: 0.9, headTilt: 12,
              armL: { a: 20, b: -16 }, armR: { a: 26, b: -18 } },
  amazed:   { tilt: -3, look: 0, armL: { a: 152, b: -102 }, armR: { a: 148, b: -102 }, expr: "shock" },
  shocked:  { tilt: -6, look: 0, armL: { a: 168, b: -18 }, armR: { a: 172, b: -18 }, expr: "shock" },
  calm:     { tilt: 2, yaw: 0.3, armL: { a: 34, b: -74 }, armR: { a: 30, b: -78 }, expr: "neutral" },
  smug:     { tilt: 3, yaw: 0.3, look: 0.2, armL: { a: 18, b: -12 },
              armR: { a: 30, b: -96 }, expr: "smug" },
};
/* idle blink: a blink every ~4.5s, offset per scene */
const idleBlink = (t, off) => (((t + (off || 0)) % 140) < 3 ? 1 : 0);
/* assemble a full pose: preset + micro-life (breath bob) */
const pose = (name, t, x, y, scale, extra) => Object.assign({}, V2.basePose, POSES[name] || {},
  { x, y: y + Math.sin(t / 34) * 3, scale, blink: idleBlink(t, 40) }, extra || {});

/* ---------- shared scene furniture ---------- */
/* the deck platform the hero stands on in space scenes */
function deck(x, y, w, parent) {
  V2.el("rect", { x: x - w * 0.42, y: y + 14, width: w * 0.84, height: 20, rx: 7, fill: "#232845" }, parent);
  V2.el("rect", { x: x - w, y: y - 22, width: w * 2, height: 38, rx: 15, fill: "#363C66" }, parent);
  V2.el("rect", { x: x - w, y: y - 22, width: w * 2, height: 12, rx: 6, fill: "#59639A" }, parent);
  V2.el("rect", { x: x - w * 0.55, y: y - 24, width: w * 1.1, height: 7, rx: 3, fill: "#8A93C8", opacity: 0.85 }, parent);
  /* contact shadow ON the deck's top face, under the feet */
  V2.el("ellipse", { cx: x, cy: y + 6, rx: w * 0.72, ry: 10, fill: "#000", opacity: 0.5 }, parent);
  V2.el("ellipse", { cx: x, cy: y + 16, rx: w + 30, ry: 18, fill: "#000", opacity: 0.35 }, parent);
}
/* the hero + rim + platform in one call (space scenes) */
function heroSpace(name, t, x, y, scale, rim, parent, extra) {
  deck(x, y + V2.feetBelowHips(scale), 105 * scale, parent);
  V2.Hero(pose(name, t, x, y, scale, extra), null, rim || "vRimR", 0, parent);
}
/* pocket hole: the black hole living in the hoodie pocket */
function pocketHole(g, x, y, r, t, glowK) {
  V2.glow(x, y, r * 5.2, "Warm", glowK === undefined ? 0.55 : glowK, g);
  const spin = t * 0.9;
  for (let k = 0; k < 2; k++) {
    const f = 1.85 - k * 0.4;
    [0, 2.6].forEach((a0) => {
      const p0 = { x: x + Math.cos(a0 + spin * (1 - k * 0.2)) * r * f, y: y + Math.sin(a0 + spin * (1 - k * 0.2)) * r * f * 0.62 };
      const p1 = { x: x + Math.cos(a0 + 2.0 + spin * (1 - k * 0.2)) * r * f, y: y + Math.sin(a0 + 2.0 + spin * (1 - k * 0.2)) * r * f * 0.62 };
      V2.el("path", { d: `M ${p0.x} ${p0.y} A ${r * f} ${r * f * 0.62} 0 0 1 ${p1.x} ${p1.y}`, fill: "none",
        stroke: k ? P.orange : P.amber, "stroke-width": r * 0.3, "stroke-linecap": "round", opacity: 0.9 - k * 0.25 }, g);
    });
  }
  V2.el("circle", { cx: x, cy: y, r: r * 1.22, fill: "none", stroke: "#FFE7B3", "stroke-width": Math.max(2.5, r * 0.12), opacity: 0.9 }, g);
  V2.el("circle", { cx: x, cy: y, r: r * 1.06, fill: "#000" }, g);
}

/* ---------- scenes (u = local progress, t = global time) ---------- */
const SCENES = {

  /* HOOK — night street, lamp light, the pocket glows. wide → push-in. */
  hook(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 1000, V2.kf(t, [[0, 1.0], [74, 1.06]])) });
    const st = V2.streetNight(t, 3, { lampX: 260, lampY: 1210, lampScale: 1.05 }, cam);
    V2.veil("hk", [st.lampLight, [700, 1245, 150]], 0.34, cam);
    V2.glow(st.headX, st.headY + 40, 300, "Warm", 0.4, cam);
    /* the hero, lit by the lamp, staring into his own pocket (deep peerdown) */
    const px = 680, py = 1252;
    V2.Hero(pose("peerdown", t, px, py, 0.98, { expr: "worried", headTilt: 20, tilt: 13, look: 0.7 }), null, "vRimR", 1, cam);
    /* the pocket hole on the hoodie's front pouch */
    pocketHole(cam, px + 8, py - 18, 14, t);
    V2.sparkle(px + 66, py - 130, (t + 8) % 70, 1.1, "#FFD9C4", cam);
    /* depth: blurred dark foreground — building edges */
    V2.foreground((g) => {
      V2.el("rect", { x: -80, y: 1380, width: 300, height: 620, rx: 24, fill: "#0A0C1C" }, g);
      V2.el("rect", { x: 940, y: 1300, width: 260, height: 700, rx: 24, fill: "#0A0C1C" }, g);
    }, 10, cam);
  },

  /* S0 — macro insert: the magnifier over the pocket. "coin-sized". */
  s0(u, t) {
    const cam = V2.el("g", { transform: V2.cam(560, 1010, 1.18) });
    const st = V2.streetNight(t, 3, { lampX: 190, lampY: 1240, lampScale: 1.1 }, cam);
    V2.veil("s0", [st.lampLight, [770, 950, 210]], 0.36, cam);
    /* hero curious, left, looking into the lens */
    V2.Hero(pose("curious", t, 300, 1290, 0.92), null, "vRimR", 1, cam);
    /* the magnifier, huge: glass, rim, handle — the black hole inside */
    const mgx = 770, mgy = 880, mr = 200;
    V2.glow(mgx, mgy, mr * 2.1, "Warm", 0.35, cam);
    V2.el("circle", { cx: mgx, cy: mgy, r: mr, fill: "#9FC0FF", opacity: 0.08 }, cam);
    pocketHole(cam, mgx, mgy, 26, t, 0.5);
    V2.el("circle", { cx: mgx, cy: mgy, r: mr, fill: "none", stroke: "#3A4066", "stroke-width": 22 }, cam);
    V2.el("circle", { cx: mgx, cy: mgy, r: mr, fill: "none", stroke: "#171B30", "stroke-width": 30, opacity: 0.6 }, cam);
    V2.el("path", { d: `M ${mgx - mr * 0.62} ${mgy - mr * 0.78} A ${mr * 0.95} ${mr * 0.95} 0 0 1 ${mgx + mr * 0.2} ${mgy - mr * 0.97}`,
      fill: "none", stroke: "#DDE6FF", "stroke-width": 12, "stroke-linecap": "round", opacity: 0.7 }, cam);
    const ha = Math.PI / 4;
    V2.el("line", { x1: mgx + Math.cos(ha) * mr * 0.95, y1: mgy + Math.sin(ha) * mr * 0.95,
      x2: mgx + Math.cos(ha) * (mr + 130), y2: mgy + Math.sin(ha) * (mr + 130),
      stroke: "#171B30", "stroke-width": 34, "stroke-linecap": "round" }, cam);
    V2.el("line", { x1: mgx + Math.cos(ha) * mr * 0.95, y1: mgy + Math.sin(ha) * mr * 0.95,
      x2: mgx + Math.cos(ha) * (mr + 130), y2: mgy + Math.sin(ha) * (mr + 130),
      stroke: "#3A4066", "stroke-width": 22, "stroke-linecap": "round" }, cam);
    V2.sparkle(mgx + mr * 0.72, mgy - mr * 0.7, (t + 30) % 90, 1.2, "#FFE7B3", cam);
    if (u > 0.42) V2.tag(540, 1495, (u - 0.42) * 90, "≈ 1 CM", null, 20, cam);
  },

  /* S1 — space: the balance. hole vs Earth. */
  s1(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 950, V2.kf(t, [[0, 1.04], [99, 1.1]])) });
    V2.nebulaField(t, 11, cam, 1);
    V2.speedLines(t, 5, 240, 760, 5, "#4AA8FF", cam);
    /* the balance */
    const bx = 590, by = 800;
    const tilt = 13 * (1 - V2.easeInOut(V2.clamp01(u / 0.72)));
    V2.el("path", { d: `M ${bx - 14} ${by - 250} L ${bx + 14} ${by - 250} L ${bx + 7} ${by} L ${bx - 7} ${by} Z`, fill: "#232841" }, cam);
    V2.el("circle", { cx: bx, cy: by, r: 20, fill: "#3A4066" }, cam);
    V2.el("circle", { cx: bx, cy: by, r: 20, fill: "none", stroke: "#59639A", "stroke-width": 4 }, cam);
    const arm = V2.el("g", { transform: `rotate(${tilt} ${bx} ${by})` }, cam);
    V2.el("rect", { x: bx - 280, y: by - 9, width: 560, height: 18, rx: 9, fill: "#3A4066" }, arm);
    V2.el("rect", { x: bx - 280, y: by - 9, width: 560, height: 7, rx: 3, fill: "#59639A" }, arm);
    [[-250, "hole"], [250, "earth"]].forEach(([dx, kind]) => {
      const px = bx + dx, pyTop = by;
      /* strings from the beam ends to the pan's rim */
      V2.el("line", { x1: px - 70, y1: pyTop, x2: px - 70, y2: pyTop + 130, stroke: "#59639A", "stroke-width": 4 }, arm);
      V2.el("line", { x1: px + 70, y1: pyTop, x2: px + 70, y2: pyTop + 130, stroke: "#59639A", "stroke-width": 4 }, arm);
      V2.el("path", { d: `M ${px - 96} ${pyTop + 130} L ${px + 96} ${pyTop + 130} L ${px + 62} ${pyTop + 190} L ${px - 62} ${pyTop + 190} Z`,
        fill: "#232841", stroke: "#3A4066", "stroke-width": 4 }, arm);
      V2.el("rect", { x: px - 96, y: pyTop + 126, width: 192, height: 8, rx: 4, fill: "#59639A" }, arm);
      if (kind === "hole") pocketHole(arm, px, pyTop + 96, 16, t, 0.5);
      else V2.earth(px, pyTop + 96, 40, t, { night: 0.35 }, arm);
    });
    /* hero bottom-left on a deck, pointing up at the balance */
    heroSpace("pointup", t, 200, 1415, 0.86, "vRimTealR", cam);
    if (u > 0.55) V2.tag(700, 1330, (u - 0.55) * 80, "≈ 1 EARTH MASS", null, 16, cam);
    V2.sparkle(150, 700, (t + 51) % 100, 1.0, "#BFD4FF", cam);
  },

  /* S2 — cross-section: it falls through everything. */
  s2(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 980, 1.02) });
    /* the strata: surface air, floorboards, sidewalk, rock (chunky bands w/ texture) */
    V2.strata(120, 960, [
      { y0: 470, y1: 640, fill: "#0C1128" },
      { y0: 640, y1: 830, fill: "#6B4B42", fill2: "#57392F", boards: true, line: "#3A2826", n: 18 },   /* floor */
      { y0: 830, y1: 1090, fill: "#4A4E60", fill2: "#3A3E4E", tiles: true, line: "#383C4E", n: 30 },   /* sidewalk */
      { y0: 1090, y1: 1650, fill: "#57392F", fill2: "#432A22", n: 40 },                                  /* rock */
    ], cam);
    V2.el("rect", { x: 120, y: 1560, width: 840, height: 90, fill: "url(#vAOd)" }, cam);
    /* ground line + grass edge on top */
    V2.el("rect", { x: 120, y: 632, width: 840, height: 10, rx: 5, fill: "#2E5240" }, cam);
    /* labels draw on, timed to the words */
    V2.drawOn(`M 150 620 L 340 620`, t * 2 - 2, 8, P.cream, 4, "none", cam, 0.55);
    V2.schLabel(430, 570, u * 40 - 2, "HAND", 34, "#B9C4D6", "start", cam);
    V2.schLabel(215, 745, u * 40 - 13, "FLOOR", 34, "#B9C4D6", "start", cam);
    V2.schLabel(215, 975, u * 40 - 24, "SIDEWALK", 34, "#B9C4D6", "start", cam);
    V2.schLabel(215, 1330, u * 40 - 33, "ROCK", 34, "#B9C4D6", "start", cam);
    /* the hero stands on the lawn edge, peering into the cutaway */
    V2.Hero(pose("peerdown", t, 235, 531, 0.72, { expr: "shock", look: 0.85 }), null, "vRimR", 1, cam);
    /* the fall: hole + dashed trail + vertical speed ticks + micro jolt per layer */
    const fy = 470 + V2.easeInOut(V2.clamp01((u - 0.04) / 0.72)) * 1120;
    const jolt = V2.settle(Math.max(0, t - 11.2), 3, 2.2, 5) * (u > 0.45 ? 1 : 0);
    const fg = V2.el("g", { transform: `translate(0 ${jolt})` }, cam);
    V2.el("line", { x1: 560, y1: 470, x2: 560, y2: fy - 60, stroke: P.amber, "stroke-width": 6, "stroke-dasharray": "4 26", opacity: 0.55 }, fg);
    for (let k = 0; k < 3; k++) {
      const ty = fy - 90 - k * 55 - (t * 160 % 55);
      if (ty > 480) V2.el("line", { x1: 560, y1: ty, x2: 560, y2: ty + 26, stroke: P.amber, "stroke-width": 5, "stroke-linecap": "round", opacity: 0.5 - k * 0.12 }, fg);
    }
    V2.blackHole(560, fy, 30, t, { jets: false, halo: 0.45 }, fg);
    /* impact sparkle where it is right now */
    V2.sparkle(560 + 34, fy - 20, (t * 6) % 30, 0.7, "#FFD9C4", fg);
  },

  /* S3 — the atom: matter is mostly empty space. schematic + count-up. */
  s3(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 900, V2.kf(t, [[0, 1.0], [134, 1.05]])) });
    V2.schematic(t, "s3", cam, { cy: 760 });
    V2.atomIcon(540, 700, 310, t, 1, cam);
    V2.countUp(450, 1210, u * 130 - 23, 99.9999, 36, 64, P.amber, "% EMPTY",
      (v) => v.toFixed(4).replace(/\.?0+$/, "") + (v >= 99.9999 ? "…" : ""), cam);
    V2.focusRings(540, 700, u * 130 - 96, "#7DF0E4", cam);
    /* hero, amazed, bottom-right on a deck (clear of the caption band) */
    heroSpace("amazed", t, 905, 1355, 0.72, "vRimTealL", cam, { glint: u > 0.3 ? 0.9 : 0, glintColor: "#00E5FF" });
    V2.sparkle(250, 420, (t + 62) % 110, 1.1, "#BFD4FF", cam);
  },

  /* S4 — it loops the planet; every pass cracks the crust. */
  s4(u, t) {
    const cam = V2.el("g", { transform: V2.cam(560, 940, V2.kf(t, [[0, 1.02], [135, 1.08]])) });
    V2.nebulaField(t, 17, cam, 0.9);
    const cx = 560, cy = 760, R = 250;
    V2.orbitRings(cx, cy, R * 1.62, R * 0.66, -16, t, { n: 3, w: 17, colors: [P.blue, P.teal, P.nebPurple], seed: 9, opacity: 0.88 }, cam);
    const passes = Math.min(4, Math.floor(u * 4.3));
    V2.earth(cx, cy, R, t, { cracks: passes * 3, night: 0.45 }, cam);
    /* the orbit's near-side arc passes OVER the planet: it loops through the core */
    const frontArc = V2.el("g", { transform: `rotate(-16 ${cx} ${cy})`, opacity: 0.9 }, cam);
    [[0.75, 3.05]].forEach(([a0, a1]) => {
      const q0 = { x: cx + Math.cos(a0) * R * 1.62, y: cy + Math.sin(a0) * R * 0.66 };
      const q1 = { x: cx + Math.cos(a1) * R * 1.62, y: cy + Math.sin(a1) * R * 0.66 };
      V2.el("path", { d: `M ${q0.x} ${q0.y} A ${R * 1.62} ${R * 0.66} 0 0 1 ${q1.x} ${q1.y}`, fill: "none",
        stroke: P.teal, "stroke-width": 17, "stroke-linecap": "round", opacity: 0.5 }, frontArc);
    });
    /* the hole zips along the orbit with a comet trail */
    const ph = -1.2 + u * 6.42 * Math.PI;
    const pNow = V2.onOrbit(cx, cy, R * 1.62, R * 0.66, -16, 1, (ph * 180) / Math.PI);
    const trail = V2.el("g", {}, cam);
    for (let k = 1; k <= 6; k++) {
      const pT = V2.onOrbit(cx, cy, R * 1.62, R * 0.66, -16, 1, ((ph - k * 0.14) * 180) / Math.PI);
      V2.el("circle", { cx: pT.x, cy: pT.y, r: 10 - k * 1.4, fill: P.amber, opacity: 0.5 - k * 0.07 }, trail);
    }
    V2.blackHole(pNow.x, pNow.y, 17, t, { halo: 0.5 }, cam);
    /* impact rings on each pass */
    if (u > 0.16) V2.focusRings(cx, cy, ((u - 0.16) * 130) % 30, P.orange, cam);
    V2.chip(540, 240, t, `PASS ${String(Math.min(4, passes + 1)).padStart(2, "0")}/04`, "dot", cam);
    heroSpace("shocked", t, 195, 1415, 0.8, "vRimR", cam);
  },

  /* S5 — it eats slowly: atom by atom. calm, patient, long take. */
  s5(u, t) {
    const cam = V2.el("g", { transform: V2.cam(560, 950, V2.kf(t, [[0, 1.0], [240, 1.05]])) });
    V2.nebulaField(t, 23, cam, 0.55);
    const cx = 700, cy = 830, R = 235;
    const hx = 250, hy = 980;
    V2.earth(cx, cy, R, t, { cracks: 3, crackOp: 0.5, night: 1, atmos: 0.5, oceanDim: true }, cam);
    /* the trickle: a visibly dashed amber guide from limb to hole, with flow chevrons */
    const pathD = `M ${cx - R * 0.86} ${cy + R * 0.4} Q ${(cx + hx) / 2 - 80} ${(cy + hy) / 2 + 140} ${hx + 30} ${hy - 26}`;
    V2.el("path", { d: pathD, fill: "none", stroke: P.amber, "stroke-width": 4.5,
      "stroke-dasharray": "5 22", "stroke-linecap": "round", opacity: 0.45 }, cam);
    for (let c = 0; c < 3; c++) {
      const cu = 0.32 + c * 0.22;
      const qx = (1 - cu) * (1 - cu) * (cx - R * 0.86) + 2 * (1 - cu) * cu * ((cx + hx) / 2 - 80) + cu * cu * (hx + 30);
      const qy = (1 - cu) * (1 - cu) * (cy + R * 0.4) + 2 * (1 - cu) * cu * ((cy + hy) / 2 + 140) + cu * cu * (hy - 26);
      const ang = Math.atan2(hy - 26 - qy, hx + 30 - qx);
      V2.el("path", { d: `M ${qx - 10 * Math.cos(ang - 0.5)} ${qy - 10 * Math.sin(ang - 0.5)} L ${qx + 8 * Math.cos(ang)} ${qy + 8 * Math.sin(ang)} L ${qx - 10 * Math.cos(ang + 0.5)} ${qy - 10 * Math.sin(ang + 0.5)}`,
        fill: "none", stroke: P.amber, "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round",
        opacity: 0.55 + 0.2 * Math.sin(t / 6 + c) }, cam);
    }
    /* atom dots pulled one by one — patient (they leave from the trickle path's end) */
    for (let i = 0; i < 9; i++) {
      const au = V2.easeInOut(V2.clamp01((u - i * 0.082) / 0.5));
      if (au <= 0) continue;
      const a = 1.7 + i * 0.12;
      const sx = cx + Math.cos(a) * R * 0.98, sy = cy + Math.sin(a) * R * 0.98;
      const x = sx + (hx - sx) * au, y = sy + (hy - sy) * au;
      V2.el("circle", { cx: x, cy: y, r: 9, fill: i % 3 ? "#FFFFFF" : P.teal, opacity: 1 - au * 0.25 }, cam);
      if (au > 0.94) V2.sparkle(hx + 20, hy - 14, (t * 5 - i * 12) % 24, 0.6, "#FFD9C4", cam);
    }
    V2.blackHole(hx, hy, 17, t, { halo: 0.5 }, cam);
    V2.tag(770, 1300, u * 90 - 20, "1 ATOM AT A TIME", null, 20, cam, P.teal);
    heroSpace("calm", t, 205, 1400, 0.82, "vRimTealR", cam);
  },

  /* S6 — the planet folds itself into a marble. */
  s6(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 920, V2.kf(t, [[0, 1.0], [171, 1.1]])) });
    V2.nebulaField(t, 29, cam, 1);
    const cx = 560, cy = 800;
    const shrink = V2.easeInOut(V2.clamp01(u / 0.85));
    const R = 245 * (1 - shrink) + 34 * shrink;
    if (shrink < 0.985) {
      V2.earth(cx, cy, R, t, { cracks: 7, night: 0.5 }, cam);
      /* fold chords sweep across as it collapses */
      const folds = Math.floor(shrink * 7);
      for (let i = 0; i < folds; i++) {
        const yy = cy - R + (i + 1) * ((2 * R) / (folds + 1));
        V2.el("line", { x1: cx - R * 0.82, y1: yy, x2: cx + R * 0.82, y2: yy, stroke: P.amber, "stroke-width": 5, opacity: 0.65, "stroke-linecap": "round" }, cam);
      }
      /* amber shockwave rings pulse with each fold */
      if (folds > 0)
        for (let i = 0; i < Math.min(2, folds); i++)
          V2.el("circle", { cx, cy, r: R * (1.25 + i * 0.18) + 10 * Math.sin(t / 5), fill: "none",
            stroke: P.amber, "stroke-width": 5, opacity: 0.32 - i * 0.1 }, cam);
      /* radial compression spokes */
      if (shrink > 0.12 && shrink < 0.92)
        for (let i = 0; i < 8; i++) {
          const a = i * 0.785 + 0.4;
          const r1 = R * 1.14 + 30 * Math.sin(shrink * Math.PI);
          V2.el("line", { x1: cx + Math.cos(a) * R * 1.12, y1: cy + Math.sin(a) * R * 1.12,
            x2: cx + Math.cos(a) * r1, y2: cy + Math.sin(a) * r1, stroke: P.orange, "stroke-width": 5, opacity: 0.5, "stroke-linecap": "round" }, cam);
        }
    } else {
      /* the marble */
      V2.glow(cx, cy, 190, "Warm", 0.6, cam);
      V2.earth(cx, cy, 34, t, { cracks: 3, night: 0.4 }, cam);
      V2.el("circle", { cx, cy, r: 58, fill: "none", stroke: P.amber, "stroke-width": 6, opacity: 0.85 }, cam);
      V2.el("circle", { cx, cy, r: 82, fill: "none", stroke: P.amber, "stroke-width": 4, opacity: 0.5 }, cam);
      V2.sparkle(cx + 60, cy - 50, (t * 4) % 40, 1.4, "#FFE7B3", cam);
    }
    heroSpace("shocked", t, 195, 1400, 0.8, "vRimR", cam);
  },

  /* S7 — check your pocket. the universe already did. */
  s7(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 1000, 1.04) });
    const st = V2.streetNight(t, 3, { lampX: 830, lampY: 1210, lampScale: 1.05, moonX: 200 }, cam);
    V2.veil("s7", [st.lampLight, [520, 1250, 160]], 0.36, cam);
    V2.glow(st.headX, st.headY + 40, 300, "Warm", 0.4, cam);
    const px = 470, py = 1252;
    V2.Hero(pose("smug", t, px, py, 0.98,
      { armR: { a: 44, b: -38 }, handR: "open" }), null, "vRimR", 1, cam);
    /* an open pocket flap ON the jacket so 'empty' reads at feed size */
    V2.el("path", { d: `M ${px - 44} ${py - 30} q 46 -12 90 0 l -7 48 q -38 12 -76 0 z`,
      fill: "#2A3054", stroke: "#121019", "stroke-width": 4, "stroke-linejoin": "round" }, cam);
    /* the pocket: empty now — a faint ring where the hole used to be */
    if (u > 0.3) {
      const p = V2.easeOut(V2.clamp01((u - 0.3) / 0.3));
      V2.el("circle", { cx: px, cy: py - 8, r: 15, fill: "none", stroke: "#7A86B8", "stroke-width": 3, "stroke-dasharray": "5 9", opacity: p * 0.8 }, cam);
      if (u > 0.5) V2.tag(px + 250, py - 190, (u - 0.5) * 60, "NOTHING.", null, 14, cam, "#7A86B8");
    }
    V2.sparkle(120, 620, (t + 20) % 90, 1.0, "#BFD4FF", cam);
    V2.foreground((g) => {
      V2.el("rect", { x: -80, y: 1380, width: 300, height: 620, rx: 24, fill: "#0A0C1C" }, g);
      V2.el("rect", { x: 940, y: 1300, width: 260, height: 700, rx: 24, fill: "#0A0C1C" }, g);
    }, 10, cam);
    if (u > 0.86) V2.el("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "#05050A", opacity: V2.clamp01((u - 0.86) / 0.12) });
  },
};

const EMPHASIS = {
  hook: ["hole", "pocket"], s0: ["coin-sized", "lying"], s1: ["earth"],
  s2: ["hand", "floor", "sidewalk"], s3: ["empty", "rumor"], s4: ["core", "crust"],
  s5: ["atom"], s6: ["marble"], s7: ["universe"],
};

function renderFrame(t) {
  V2.root.innerHTML = "";
  V2.el("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: P.bgDeep });
  V2.defs(V2.root);
  let idx = TL.length - 1;
  for (let i = 0; i < TL.length; i++)
    if (t < TL[i].end - 1e-6) { idx = i; break; }
  const sc = TL[idx];
  const u = V2.clamp01((t - sc.start) / (sc.end - sc.start));
  (SCENES[sc.id] || SCENES.hook)(u, t);
  V2.grade(t);
  V2.caption(sc.narration, u, EMPHASIS[sc.id]);
}
window.renderFrame = renderFrame;
renderFrame(0);
</script>
</body>
