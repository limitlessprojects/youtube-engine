<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#070A18;overflow:hidden;}
  #stage{width:1080px;height:1920px;position:relative;}
  svg{display:block;}
</style>
</head>
<body>
<div id="stage"><svg id="frame" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script src="../../../engine/core.js"></script>
<script src="../../../engine/space.js"></script>
<script src="../../../engine/rig.js"></script>
<script src="../../../engine/world.js"></script>
<script src="../../../engine/diagram.js"></script>
<script src="../../../engine/caption.js"></script>
<script>
/* ============================================================
   Short #0006 v3 — "The stitch surgeons hide under your skin"
   REBUILD (2026-11-15). v1/v2 (scenes.v2-carried.html) carried at
   6.72/6.61: a navy dermis on a navy sky with a 13px thread — the
   subject never owned the frame (C2/C3/L-085/L-112).

   v3 design law — ONE lit object, ONE continuous take:
   · a textbook SKIN BLOCK (top face = skin surface in perspective,
     front face = cross-section: epidermis / dermis / fat) fills the
     frame bottom-to-top. Warm lit flesh on deep navy = C2 by
     construction; the front face runs off the bottom edge, so there
     is no dead band to fill (L-112 #1).
   · the wound runs front-to-back, so the SAME object shows the gap
     from above AND in section. The camera never leaves the block:
     scenes are camera moves (whip-eased), not set changes.
   · thread = TEAL (the one cool accent) on warm flesh.
   · "under the surface" is literal: under-skin objects are drawn
     BETWEEN the dermis underlayer and a skin COVER layer; x-ray =
     the cover going translucent. Nothing is faked with labels.
   · accuracy (C17): curved needle, wavy dermal-epidermal junction,
     capillary loops, hair follicle, sweat gland, fat lobules; the
     thread path is the real subcuticular ladder (bite along one
     edge, cross, bite along the other).
   Deterministic: every frame is a pure function of t (C6).
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
V2.root = document.getElementById("frame");
const P = V2.P;
const TITLE_FONT = "'Bricolage Grotesque', sans-serif";
const MONO = "'Fragment Mono', monospace";
const E = V2.el, cl = V2.clamp01, lerp = V2.lerp;
const _ctx = document.createElement("canvas").getContext("2d");
const meas = (s, font) => { _ctx.font = font; return _ctx.measureText(s).width; };
const sstep = (a, b, v) => { const x = cl((v - a) / (b - a)); return x * x * (3 - 2 * x); };

/* ---------- flesh world tokens (terrain family, bible §1 scene rule) ---------- */
const K = {
  skinF: "#F8DCC4", skinB: "#E9B998", skinLine: "#D9A483", pore: "#C98F70",
  epiTop: "#FCE9D8", epiLow: "#F1C6A8",
  derm0: "#EE9A86", derm1: "#D0696C", fiber: "#F6B39C", fiberD: "#B9545C",
  fat0: "#F0A048", fatL: "#FFCB78", fatS: "#DE8530",
  gap0: "#6A1D3E", gap1: "#24091F", wall: "#E08F86",
  seam: "#A94A62", thread: P.teal, threadHi: "#B8FFF6",
  steel: "#DDE7F6", steelD: "#8FA0C2",
  vein: P.blue, cap: "#C2447E", hair: "#4A3430",
};

/* ---------- block projection: x in [-1,1], z in [0,1] (0 = front edge), d = px below surface ---------- */
const FY = 1180, TD = 540, HWF = 480, HWB = 384;
const pr = (x, z, d) => [540 + x * (HWF + (HWB - HWF) * z), FY - z * TD + (d || 0)];
const pts = (a) => a.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const pathOf = (a, close) => "M " + a.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ") + (close ? " Z" : "");
const EPI = 46, DERM = 356, ZB = 0.93, G0 = 0.088;
const shape = (z) => Math.sqrt(Math.max(0, 1 - Math.pow(z / ZB, 2.4)));
const band = (z0, z1) => [pr(-1.02, z0), pr(1.02, z0), pr(1.02, z1), pr(-1.02, z1)];

/* ---------- state defaults ---------- */
const S0 = () => ({ open: () => 1, xray: 0, scanZ: 2, seam: 0, th: null, stitches: null,
  cells: 0, needle: null, xs: false, knot: null, light: 1 });

function gapPoly(S) {
  const L = [], R = [];
  for (let i = 0; i <= 24; i++) {
    const z = (i / 24) * ZB, g = G0 * S.open(z) * shape(z);
    L.push(pr(-g, z)); R.push(pr(g, z));
  }
  return L.concat(R.reverse());
}

/* the subcuticular ladder: bite along one edge, cross, bite along the other */
const NPASS = 8;
function threadVerts(S) {
  const v = [], tight = S.th ? S.th.tight || 0 : 0;
  for (let i = 0; i < NPASS; i++) {
    const side = i % 2 ? 1 : -1, z0 = 0.085 + i * 0.098;
    for (const z of [z0, z0 + 0.058]) {
      const g = G0 * S.open(z) * shape(z);
      v.push(pr(side * (g + lerp(0.085, 0.03, tight)), z));
    }
  }
  return v;
}
function partial(v, p) {
  let tot = 0; const seg = [];
  for (let i = 0; i < v.length - 1; i++) { const l = Math.hypot(v[i + 1][0] - v[i][0], v[i + 1][1] - v[i][1]); seg.push(l); tot += l; }
  let want = tot * cl(p); const out = [v[0]]; let head = v[0], dir = [1, 0], idx = 0;
  for (let i = 0; i < seg.length; i++) {
    dir = [(v[i + 1][0] - v[i][0]) / (seg[i] || 1), (v[i + 1][1] - v[i][1]) / (seg[i] || 1)];
    if (want >= seg[i]) { out.push(v[i + 1]); want -= seg[i]; head = v[i + 1]; idx = i + 1; }
    else { head = [v[i][0] + dir[0] * want, v[i][1] + dir[1] * want]; out.push(head); idx = i + want / (seg[i] || 1); break; }
  }
  return { pts: out, head, dir, idx };
}
function threadStroke(d, parent, o, w) {
  w = w || 1;
  E("path", { d, stroke: P.ink, "stroke-width": 17 * w, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: o }, parent);
  E("path", { d, stroke: K.thread, "stroke-width": 10 * w, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: o }, parent);
  E("path", { d, stroke: K.threadHi, "stroke-width": 2.6 * w, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.75 * o }, parent);
}

/* curved surgical needle: arc of a circle, tip leads at angle a (deg, screen), body trails `sweep` deg */
function needleArc(parent, cx, cy, R, a, sweep, sy, o, dir) {
  dir = dir || -1;
  const p = [];
  for (let i = 0; i <= 26; i++) {
    const an = ((a + (dir * sweep * i) / 26) * Math.PI) / 180;
    p.push([cx + R * Math.cos(an), cy + R * Math.sin(an) * sy]);
  }
  const d = pathOf(p);
  const g = E("g", { opacity: o === undefined ? 1 : o }, parent);
  E("path", { d, stroke: P.ink, "stroke-width": 19, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  E("path", { d, stroke: K.steelD, "stroke-width": 12, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  E("path", { d, stroke: K.steel, "stroke-width": 7.5, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  E("path", { d: pathOf(p.slice(2, 16)), stroke: "#FFFFFF", "stroke-width": 2.6, fill: "none", "stroke-linecap": "round", opacity: 0.85 }, g);
  /* tapered point */
  const t0 = p[0], t1 = p[1], dx = t0[0] - t1[0], dy = t0[1] - t1[1], l = Math.hypot(dx, dy) || 1;
  const ux = dx / l, uy = dy / l, tipP = [t0[0] + ux * 30, t0[1] + uy * 30];
  E("path", { d: `M ${t0[0] - uy * 9.5} ${t0[1] + ux * 9.5} L ${tipP[0]} ${tipP[1]} L ${t0[0] + uy * 9.5} ${t0[1] - ux * 9.5} Z`,
    fill: K.steel, stroke: P.ink, "stroke-width": 5, "stroke-linejoin": "round" }, g);
  return { tip: tipP, tail: p[p.length - 1] };
}

/* ---------- the room (screen-space, parallax 0.3) ---------- */
function room(t, cam) {
  const bs = 1 + (cam[2] - 1) * 0.3;
  const g = E("g", { transform: `translate(540 960) scale(${bs}) translate(${-540 - (cam[0] - 540) * 0.3} ${-960 - (cam[1] - 940) * 0.3})` });
  const lg = E("linearGradient", { id: "kRoom", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", P.bgDeep], ["34%", "#161A45"], ["52%", P.nebPurple2], ["70%", "#161A45"], ["100%", P.bgDeep]]
    .forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, lg));
  E("rect", { x: -400, y: -400, width: 1880, height: 2720, fill: "url(#kRoom)" }, g);
  /* tiled theatre wall, value-only (no outlines on background masses) */
  for (let i = 0; i < 9; i++) E("rect", { x: -400, y: 60 + i * 96, width: 1880, height: 2, fill: "#2A2F66", opacity: 0.35 }, g);
  for (let i = 0; i < 12; i++) E("rect", { x: -80 + i * 118, y: -100, width: 2, height: 900, fill: "#2A2F66", opacity: 0.22 }, g);
  /* vitals monitor: the live ECG is the room's secondary motion */
  const mx = 78, my = 356;
  E("rect", { x: mx, y: my, width: 250, height: 150, rx: 16, fill: "#0B1030", stroke: "#2A3270", "stroke-width": 4 }, g);
  let d = "";
  for (let i = 0; i <= 60; i++) {
    const ph = ((i / 60) * 2.2 + t * 0.9) % 1;
    const sp = Math.exp(-Math.pow((ph - 0.5) / 0.022, 2)) * 54 - Math.exp(-Math.pow((ph - 0.56) / 0.02, 2)) * 20 + Math.exp(-Math.pow((ph - 0.72) / 0.06, 2)) * 10;
    d += (i ? " L " : "M ") + (mx + 20 + i * 3.5).toFixed(1) + " " + (my + 92 - sp).toFixed(1);
  }
  E("path", { d, stroke: P.teal, "stroke-width": 4, fill: "none", "stroke-linejoin": "round", opacity: 0.85 }, g);
  E("circle", { cx: mx + 222, cy: my + 26, r: 7, fill: P.teal, opacity: 0.35 + 0.65 * Math.pow(Math.max(0, Math.sin(t * 5.65)), 6) }, g);
  V2.glow(mx + 125, my + 80, 190, "Teal", 0.16, g);
  /* instrument shelf silhouette, right */
  E("rect", { x: 800, y: 470, width: 330, height: 14, rx: 6, fill: "#0B1030" }, g);
  [[832, 54, 30], [878, 86, 22], [918, 40, 40], [978, 70, 26]].forEach(([x, h, w]) =>
    E("rect", { x, y: 470 - h, width: w, height: h, rx: 7, fill: "#0D1338" }, g));
}

/* surgical lamp + cone: the visible light source (bible §2 depth grade) */
function lamp(t, k) {
  const cg = E("linearGradient", { id: "kCone", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#FFE9C8", 0.34], ["100%", "#FFE9C8", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, cg));
  E("path", { d: `M 420 150 L 660 150 L ${pr(1.0, 0.1)[0]} ${FY} L ${pr(-1.0, 0.1)[0]} ${FY} Z`, fill: "url(#kCone)", opacity: 0.55 * k, style: "mix-blend-mode:screen" });
  V2.dust(t * 30, 9, { x: 260, y: 190, w: 560, h: 480 }, 22, 0.42 * k);
  E("ellipse", { cx: 540, cy: 122, rx: 196, ry: 44, fill: "#1B2250", stroke: P.ink, "stroke-width": 5 });
  E("ellipse", { cx: 540, cy: 136, rx: 168, ry: 30, fill: "#0C1030" });
  for (let i = 0; i < 5; i++) {
    const bx = 540 + (i - 2) * 62, by = 138 + Math.abs(i - 2) * -3;
    E("ellipse", { cx: bx, cy: by, rx: 24, ry: 12, fill: "#FFF3DC", opacity: 0.95 * k });
    V2.glow(bx, by, 62, "Warm", 0.5 * k);
  }
  E("rect", { x: 526, y: -40, width: 28, height: 130, fill: "#1B2250", stroke: P.ink, "stroke-width": 5 });
}

/* ---------- the block ---------- */
function topFace(S, t) {
  const quad = [pr(-1, 0), pr(1, 0), pr(1, 1), pr(-1, 1)];
  const gp = gapPoly(S);
  const dg = E("linearGradient", { id: "kUnder", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#C96467"], ["100%", K.derm0]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, dg));
  const sg = E("linearGradient", { id: "kSkin", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", K.skinB], ["100%", K.skinF]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, sg));
  const gg = E("linearGradient", { id: "kGap", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", K.gap1], ["100%", K.gap0]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, gg));
  const cpTop = E("clipPath", { id: "kTopClip" }, V2.defsHold); E("polygon", { points: pts(quad) }, cpTop);
  /* contact shadow of the block on the room */
  E("ellipse", { cx: 540, cy: pr(0, 1)[1] + 6, rx: 470, ry: 34, fill: "#000", opacity: 0.4 });

  /* a) dermis underlayer: what x-ray sees */
  const under = E("g", { "clip-path": "url(#kTopClip)" });
  E("polygon", { points: pts(quad), fill: "url(#kUnder)" }, under);
  for (let i = 0; i < 44; i++) {
    const x = -0.96 + V2.rnd(71, i) * 1.92, z = 0.03 + V2.rnd(72, i) * 0.94;
    const [ax, ay] = pr(x, z), w = (70 + V2.rnd(73, i) * 90) * (1 - z * 0.3), wob = Math.sin(t * 1.3 + i) * 3;
    E("path", { d: `M ${ax} ${ay} q ${w * 0.25} ${-10 + wob} ${w * 0.5} 0 t ${w * 0.5} 0`, stroke: i % 3 ? K.fiber : K.fiberD,
      "stroke-width": 4.5, fill: "none", "stroke-linecap": "round", opacity: 0.5 }, under);
  }
  for (let i = 0; i < 7; i++) {   /* capillary net */
    const [ax, ay] = pr(-0.9 + i * 0.3 + V2.rnd(75, i) * 0.1, 0.1 + V2.rnd(76, i) * 0.7);
    E("path", { d: `M ${ax} ${ay} q 26 -30 60 -12 q 30 16 54 -14`, stroke: K.cap, "stroke-width": 3.5, fill: "none", "stroke-linecap": "round", opacity: 0.6 }, under);
  }
  /* b) the wound opening */
  E("polygon", { points: pts(gp), fill: "url(#kGap)" });
  /* c) under-skin objects */
  const ug = E("g", {});
  if (S.underDraw) S.underDraw(ug);
  if (S.th && S.th.p > 0.001) drawThread(S, t, ug);
  if (S.needle && S.needle.plane === "flat") drawFlatNeedle(S, ug);

  /* d) skin cover with the wound cut out; x-ray thins it in front of scanZ */
  const cover = (clipId, op) => {
    if (op <= 0.001) return;
    const g = E("g", { opacity: op, "clip-path": `url(#${clipId})` });
    E("path", { d: pathOf(quad, true) + " " + pathOf(gp, true), "fill-rule": "evenodd", fill: "url(#kSkin)" }, g);
    const det = E("g", { "clip-path": "url(#kTopClip)" }, g);
    for (let i = 0; i < 46; i++) {   /* skin micro-furrows */
      const x = -0.97 + V2.rnd(81, i) * 1.94, z = 0.02 + V2.rnd(82, i) * 0.95;
      if (Math.abs(x) < 0.13) continue;
      const [ax, ay] = pr(x, z), l = (26 + V2.rnd(83, i) * 30) * (1 - z * 0.35), s = V2.rnd(84, i) > 0.5 ? 1 : -1;
      E("path", { d: `M ${ax} ${ay} l ${l} ${s * l * 0.2}`, stroke: K.skinLine, "stroke-width": 2.6, "stroke-linecap": "round", opacity: 0.55 }, det);
    }
    for (let i = 0; i < 70; i++) {   /* pores */
      const x = -0.97 + V2.rnd(85, i) * 1.94, z = 0.02 + V2.rnd(86, i) * 0.95;
      if (Math.abs(x) < 0.11) continue;
      const [ax, ay] = pr(x, z);
      E("ellipse", { cx: ax, cy: ay, rx: 3.4 * (1 - z * 0.35), ry: 1.9 * (1 - z * 0.35), fill: K.pore, opacity: 0.55 }, det);
    }
    /* lamp pool + back falloff */
    const lp = E("radialGradient", { id: clipId + "lp" }, V2.defsHold);
    [["0%", "#FFFFFF", 0.42], ["100%", "#FFFFFF", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, lp));
    E("ellipse", { cx: 540, cy: FY - TD * 0.42, rx: 400, ry: 230, fill: `url(#${clipId}lp)`, opacity: S.light }, det);
    /* raised wound lips */
    E("path", { d: pathOf(gp, true), fill: "none", stroke: K.wall, "stroke-width": 7, "stroke-linejoin": "round", opacity: 0.95 }, g);
    E("path", { d: pathOf(gp, true), fill: "none", stroke: "#FFE7D6", "stroke-width": 2.4, "stroke-linejoin": "round", opacity: 0.8,
      transform: "translate(0 -3)" }, g);
  };
  const cA = E("clipPath", { id: "kCovA" }, V2.defsHold); E("polygon", { points: pts(band(-0.05, Math.min(1.05, S.scanZ))) }, cA);
  const cB = E("clipPath", { id: "kCovB" }, V2.defsHold); E("polygon", { points: pts(band(Math.min(1.05, S.scanZ), 1.05)) }, cB);
  cover("kCovA", 1 - 0.8 * S.xray);
  if (S.scanZ < 1.04) {
    cover("kCovB", 1);
    if (S.scanZ > -0.04) {   /* the scan bar */
      const a = pr(-1, S.scanZ), b = pr(1, S.scanZ);
      E("path", { d: `M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}`, stroke: K.threadHi, "stroke-width": 7, "stroke-linecap": "round" });
      E("path", { d: `M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}`, stroke: P.teal, "stroke-width": 26, opacity: 0.35, "stroke-linecap": "round" });
      V2.glow(540, a[1], 330, "Teal", 0.34);
    }
  }
  /* e) on-surface things */
  if (S.seam > 0.01) {
    const sp = [];
    for (let i = 0; i <= 20; i++) { const z = (i / 20) * ZB; sp.push(pr(Math.sin(i * 1.9) * 0.006, z)); }
    E("path", { d: pathOf(sp), stroke: K.seam, "stroke-width": 2 + 5 * S.seam, fill: "none", "stroke-linecap": "round", opacity: 0.25 + 0.7 * S.seam });
  }
  if (S.cells > 0.001) drawCells(S, t);
  if (S.stitches) drawStitches(S, t);
  /* a few fine hairs at the margins (the field itself is shaved — C17) */
  for (let i = 0; i < 9; i++) {
    const side = i % 2 ? 1 : -1, x = side * (0.62 + V2.rnd(91, i) * 0.33), z = 0.06 + V2.rnd(92, i) * 0.86;
    const [ax, ay] = pr(x, z), l = 44 * (1 - z * 0.3), sw = Math.sin(t * 1.4 + i * 2) * 4;
    E("path", { d: `M ${ax} ${ay} q ${side * 10 + sw} ${-l * 0.7} ${side * 26 + sw * 1.6} ${-l}`, stroke: K.hair, "stroke-width": 3, fill: "none", "stroke-linecap": "round", opacity: 0.75 });
  }
}

function drawThread(S, t, parent) {
  const v = threadVerts(S), th = S.th;
  const part = partial(v, th.p);
  const diss = th.dissolve || 0;
  if (diss <= 0) {
    threadStroke(pathOf(part.pts), parent, th.alpha === undefined ? 1 : th.alpha);
  } else {
    /* dissolve front→back: thread breaks into drifting motes */
    const n = 120;
    for (let i = 0; i < n; i++) {
      const q = partial(v, i / (n - 1)), f = i / (n - 1);
      const k = cl((diss * 1.5 - f * 0.9) / 0.6);
      if (k >= 1) continue;
      const dx = (V2.rnd(51, i) - 0.5) * 120 * k, dy = -k * (50 + V2.rnd(52, i) * 90);
      if (k <= 0) continue;
      E("circle", { cx: q.head[0] + dx, cy: q.head[1] + dy, r: lerp(7, 1.5, k), fill: k > 0.3 ? K.threadHi : K.thread, opacity: 1 - k }, parent);
    }
    const solid = cl((diss * 1.5 - 0.0) / 0.9);   /* fraction already breaking up, from the front */
    if (solid < 1) { const rev = v.slice().reverse(); threadStroke(pathOf(partial(rev, 1 - solid).pts), parent, 1); }
  }
  S._head = part;
}
function drawFlatNeedle(S, parent) {
  const h = S._head; if (!h) return;
  const ang = (Math.atan2(h.dir[1], h.dir[0]) * 180) / Math.PI;
  const g = E("g", { transform: `translate(${h.head[0]} ${h.head[1]}) rotate(${ang}) scale(1.5 0.84)` }, parent);
  needleArc(g, -62, -34, 70, 30, 150, 1, 1);
}
function drawStitches(S, t) {
  S.stitches.forEach((k, i) => {
    if (k <= 0.001) return;
    const z = 0.14 + i * 0.165, a = pr(-0.25, z), b = pr(0.25, z), pop = V2.backOut(cl(k));
    const fall = S.stitchFall ? S.stitchFall[i] : 0;
    const g = E("g", { opacity: (1 - fall) * cl(k * 3), transform: `translate(0 ${-fall * 90}) rotate(${fall * (i % 2 ? 24 : -24)} 540 ${a[1]})` });
    const lift = 30 * pop;
    const d = `M ${a[0]} ${a[1]} Q 540 ${a[1] - lift} ${b[0]} ${b[1]}`;
    E("path", { d, stroke: P.ink, "stroke-width": 17, fill: "none", "stroke-linecap": "round" }, g);
    E("path", { d, stroke: "#39407A", "stroke-width": 9.5, fill: "none", "stroke-linecap": "round" }, g);
    E("path", { d, stroke: "#7C86C8", "stroke-width": 2.5, fill: "none", "stroke-linecap": "round", opacity: 0.8, transform: "translate(0 -3)" }, g);

function chip(k, x, y, text, accent, size, strike) {

  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: h * 0.28, fill: P.ink, stroke: P.cream, "stroke-width": 4 }, g);
  E("rect", { x: -w / 2 + 18, y: -h * 0.25, width: 10, height: h * 0.5, rx: 5, fill: accent || P.teal }, g);
  V2.txt(14, size * 0.34, text, { "text-anchor": "middle", "font-family": MONO, "font-size": size, fill: P.cream, "letter-spacing": 1 }, g);

  if (k <= 0.001) return;

    const p = V2.easeInOut(cl((lt - 0.15) / (dur - 0.55)));
    S.th = { p: 0.02 + 0.98 * p, tight: 0 };
    S.needle = { plane: "flat" };
    S.overDraw = () => {
      /* bite rings where the needle has just caught an edge */
      const v = threadVerts(S), h = S._head;
      v.forEach((q, i) => {
        if (i % 2) return;
        const age = (h.idx - i) / 1.6;
        if (age <= 0 || age > 1) return;
        E("circle", { cx: q[0], cy: q[1], r: 14 + age * 46, fill: "none", stroke: K.threadHi, "stroke-width": 7 * (1 - age), opacity: 1 - age });
      });
    };
    return S;
  },
  over(lt, u, t, dur) {
    const p = V2.easeInOut(cl((lt - 0.15) / (dur - 0.55)));
    const n = Math.min(NPASS, 1 + Math.floor(p * NPASS * 0.999));
    chip(cl((lt - 0.2) / 0.3), 540, 300, "PASS " + n + " / " + NPASS, P.teal, 58);
  } };

SC.s4 = { cam: [[540, 880, 1.34], [540, 870, 1.26]],
  world(lt, u, t, dur) {
    const S = S0();
    S.xray = 1;
    const zc = V2.easeInOut(cl((lt - 0.35) / 2.0)) * 1.15 - 0.1;
    S.open = (z) => sstep(zc, zc + 0.14, z);
    S.th = { p: 1, tight: V2.easeInOut(cl((lt - 0.35) / 2.0)) };

      const h1 = handOf(hp, "armL"), v = threadVerts(S), e = v[v.length - 1];

        for (let i = 0; i < 7; i++) {

          E("path", { d: `M ${sx + Math.cos(a) * 14} ${sy + Math.sin(a) * 8} L ${sx + Math.cos(a) * r} ${sy + Math.sin(a) * r * 0.6}`, stroke: K.threadHi, "stroke-width": 5, "stroke-linecap": "round" });

  },
  over() {} };

SC.s5 = { cam: [[540, 1395, 1.7], [540, 1410, 1.9]],
  world(lt, u, t) {
    const S = S0();

    S.knot = { d: lerp(34, 170, dive), sq: V2.settle((lt - 1.15) * 30, 0.5, 0.9, 5) * (lt > 1.15 ? 1 : 0) + 0.25 * Math.sin(cl(lt / 0.5) * Math.PI),

    };

  over(lt) { chip(cl((lt - 1.3) / 0.3), 540, 250, "BURIED KNOT", P.teal, 58); } };

SC.s6 = { cam: [[540, 900, 1.22], [540, 900, 1.28]],
  world(lt, u, t) { const S = S0(); S.open = () => 0; S.seam = 0.55; S.light = 0.5; return S; },
  over(lt, u, t) {
    E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "#070A18", opacity: 0.74 * cl(lt / 0.2) });
    const med = (k, cx, cy, kind) => {
      if (k <= 0.001) return;
      const pop = V2.backOutBig(cl(k)), r = 232;
      const g = E("g", { opacity: cl(k * 3), transform: `translate(${cx} ${cy}) scale(${0.6 + 0.4 * pop})` });
      const id = "kMed" + kind, cp = E("clipPath", { id }, V2.defsHold); E("circle", { cx: 0, cy: 0, r }, cp);
      E("circle", { cx: 0, cy: 12, r: r + 8, fill: "#000", opacity: 0.4 }, g);
      const c = E("g", { "clip-path": `url(#${id})` }, g);
      E("rect", { x: -r, y: -r, width: 2 * r, height: 2 * r, fill: "url(#kSkin)" }, c);
      for (let i = 0; i < 26; i++) E("ellipse", { cx: (V2.rnd(61, i) - 0.5) * 2 * r, cy: (V2.rnd(62, i) - 0.5) * 2 * r, rx: 5, ry: 3, fill: K.pore, opacity: 0.5 }, c);
      if (kind === "bad") {
        E("path", { d: `M ${-r} 6 Q 0 -10 ${r} 8`, stroke: K.seam, "stroke-width": 10, fill: "none" }, c);
        for (let i = 0; i < 6; i++) {
          const x = -190 + i * 76, y = 2 - Math.sin((i / 5) * Math.PI) * 6;
          E("path", { d: `M ${x} ${y - 62} L ${x + 6} ${y + 62}`, stroke: K.seam, "stroke-width": 7, "stroke-linecap": "round", opacity: 0.85 }, c);
          [[x, y - 62], [x + 6, y + 62]].forEach(([px, py]) => E("circle", { cx: px, cy: py, r: 10, fill: K.seam }, c));
        }
      } else {
        E("path", { d: `M ${-r} 6 Q 0 -10 ${r} 8`, stroke: "#D99C86", "stroke-width": 4, fill: "none", opacity: 0.85 }, c);
        const tw = 0.5 + 0.5 * Math.sin(t * 6);
        E("path", { d: "M 70 -70 l 0 -44 M 70 -70 l 0 44 M 70 -70 l -44 0 M 70 -70 l 44 0", stroke: "#FFFFFF", "stroke-width": 8, "stroke-linecap": "round", opacity: 0.5 + 0.5 * tw,
          transform: `rotate(${t * 40} 70 -70)` }, c);
      }
      E("circle", { cx: 0, cy: 0, r, fill: "none", stroke: kind === "bad" ? "#FF5A4A" : P.teal, "stroke-width": 12 }, g);
      E("circle", { cx: 0, cy: 0, r: r + 9, fill: "none", stroke: P.ink, "stroke-width": 6 }, g);
    };
    const kb = cl((lt - 0.05) / 0.3), kg = cl((lt - 1.05) / 0.3);
    med(kb, 540, 520, "bad"); med(kg, 540, 1130, "good");
    chip(cl((lt - 0.2) / 0.28), 540, 800, "STITCH TRACKS", "#FF5A4A", 46, cl((lt - 0.55) / 0.28));
    chip(cl((lt - 1.2) / 0.28), 540, 1412, "CLEAN SEAM", P.teal, 46);
  } };

SC.s8 = { cam: [[540, 900, 1.46], [540, 890, 1.56]],
  world(lt, u, t) {
    const S = S0();
    S.open = () => 0;
    const c = cl((lt - 0.15) / 1.55);
    S.cells = c; S.seam = 0.6 * (1 - sstep(0.5, 1, c)) + 0.06;

      V2.txt(0, 116, done > 0 ? "SURFACE SEALED" : "SEALING...", { "text-anchor": "middle", "font-family": MONO, "font-size": 44, fill: P.cream, "letter-spacing": 2 }, g);
    }
  } };

SC.s9 = { cam: [[540, 900, 1.34], [540, 930, 1.16]],

      E("path", { d: `M ${lx - 54} ${ly - 30} q 20 -34 54 -42`, stroke: "#FFFFFF", "stroke-width": 9, fill: "none", "stroke-linecap": "round", opacity: 0.8 }, c);
      E("circle", { cx: lx, cy: ly, r, fill: "none", stroke: P.ink, "stroke-width": 20 });

        fill: P.cream, stroke: P.ink, "stroke-width": 14, "paint-order": "stroke", opacity: cl(q * 2), transform: `rotate(${Math.sin(t * 4) * 6} ${lx} ${ly - r - 40})` });
    };

  },

SC.s10 = { cam: [[540, 930, 1.2], [540, 938, 1.13]],
  world(lt, u, t) {
    const S = S0(); S.open = () => 0; S.seam = 0.07;

SC.s11 = { cam: [[540, 938, 1.13], [540, 940, 1.12]],
  world(lt, u, t, dur) {
    /* loop mirror: the seam unzips and the needle swings back in — last frame == frame 0 */
    const S = S0();
    const o = V2.easeInOut(cl((lt - 0.05) / 0.5));
    S.open = (z) => sstep(ZB * (1 - o * 1.2), ZB * (1 - o * 1.2) + 0.2, z + 0.0) * 0 + o;
    S.seam = 0.07 * (1 - o);
    const k = V2.easeOut(cl((lt - 0.2) / 0.6));
    const zn = 0.42, [gx, gy] = pr(0, zn), R = 112, cx = gx - 6;
    S.overDraw = () => {
      const g = E("g", { transform: `translate(${(1 - k) * 330} ${(1 - k) * -820})` });
      const n = needleArc(g, cx, gy - 16, R, -176, 168, 0.95, 1, 1);
      const far = [cx + 400, gy - 1000];
      threadStroke(`M ${n.tail[0]} ${n.tail[1]} C ${n.tail[0] + 40} ${n.tail[1] - 260} ${far[0] - 330} ${far[1] + 520} ${far[0]} ${far[1]}`, g, 1);
    };
    S._hero = [lt > 0.35 ? "skygawk" : "happy", 0.74, 0.86, 0.6, { facing: -1 }];
    return S;
  },
  over() { title(TITLE, 262, 108, () => 1); } };

function withCam(cam, fn) {
  const hold = V2.root;
  V2.root = E("g", { transform: V2.cam(cam[0], cam[1], cam[2]) }, hold);
  fn();
  V2.root = hold;
}
function camOf(idx, lt, dur) {
  const sc = SC[TL[idx].id], a = sc.cam[0], b = sc.cam[1], u = V2.easeInOut(cl(lt / dur) * 0.85 + 0.075);
  let c = [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
  if (idx > 0 && lt < 0.36) {   /* whip in from the previous scene's last camera: one continuous take */
    const pv = SC[TL[idx - 1].id].cam[1], k = V2.easeOutQuint(lt / 0.36);
    c = [lerp(pv[0], c[0], k), lerp(pv[1], c[1], k), lerp(pv[2], c[2], k)];
  }
  return c;
}

function renderFrame(t) {
  V2.root.innerHTML = "";
  V2.defsHold = E("defs", {}, V2.root);
  V2.defs(V2.root);
  let idx = TL.length - 1;
  for (let i = 0; i < TL.length; i++) if (t < TL[i].end - 1e-6) { idx = i; break; }
  const sc = TL[idx], def = SC[sc.id] || SC.hook;
  const lt = Math.max(0, t - sc.start), dur = sc.end - sc.start, u = cl(lt / dur);
  const cam = camOf(idx, lt, dur);
  room(t, cam);
  const S = def.world(lt, u, t, dur);
  withCam(cam, () => {
    block(S, t);
    if (S._hero) { const h = S._hero, ex = Object.assign({}, h[4]); const y0 = ex.y0 || 0; delete ex.y0;
      const hold = V2.root; V2.root = E("g", { transform: `translate(0 ${y0})` }, hold); hero(t, h[0], h[1], h[2], h[3], ex); V2.root = hold; }
  });
  def.over(lt, u, t, dur, cam);
  const vg = E("radialGradient", { id: "kVig" }, V2.defsHold);
  [["62%", "#05050A", 0], ["100%", "#05050A", 0.5]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, vg));
  E("rect", { x: -20, y: -20, width: 1120, height: 1960, fill: "url(#kVig)" });
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, filter: "url(#vGrain)", opacity: 0.5,
    transform: `translate(${(Math.floor(t * 15) % 2) * 3} ${Math.floor(t * 15) % 3})` });
}
window.renderFrame = renderFrame;
renderFrame(0);
