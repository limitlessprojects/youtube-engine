<div id="stage"><svg id="frame" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>

<script>
/* ============================================================
   Short #0008 — "The deadliest hunter on Earth looks like a moon lander"
   Topic-pull experiment: topic taken from Kurzgesagt's most-viewed list
   (bacteriophage); script, structure, drawings and audio are ours (Q6).
   Pattern = #0006 v3 (docs/handoff-day-018.md): ONE lit object, ONE take —
   a bacterium whose dome fills the lower frame like a moon, the phage
   lands on it. Rule C18 from the first line: every event is timed on u
   (fraction of the scene) and lands at u >= 0.8; no fixed-seconds pops.
   Deterministic: pure function of t (C6).
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
V2.root = document.getElementById("frame");
const P = V2.P;
const TITLE_FONT = "'Bricolage Grotesque', sans-serif";
const MONO = "'Fragment Mono', monospace";
const E = V2.el, cl = V2.clamp01, lerp = V2.lerp;
const _ctx = document.createElement("canvas").getContext("2d");
const meas = (s, font) => { _ctx.font = font; return _ctx.measureText(s).width; };
const sstep = (a, b, v) => { const x = cl((v - a) / (b - a)); return x * x * (3 - 2 * x); };
const seg = (u, a, b) => cl((u - a) / (b - a));           /* C18 helper: progress of an event occupying [a,b] of the scene */
const pathOf = (a, close) => "M " + a.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ") + (close ? " Z" : "");
const pr = (x, z) => [x, z];   /* hero helper expects pr(); here x,z are already screen px */

const K = {
  cellTop: "#FFC873", cellLow: "#F08E3A", wallO: "#D9702A", wallI: "#FFD79A", cyto0: "#FFE6B0", cyto1: "#F7B25A",
  ribo: "#C77A3A", host: P.blue, dna: "#E0457F", dnaHi: "#FF9CC4",
  head: "#F6EFE3", headS: "#D2C4AD", sheath: P.teal, sheathD: "#1E9C92", plate: "#2A6FB8", steel: "#DDE7F6",
  human: "#F3B7A8", humanS: "#D98A86", nucleus: "#8E5BB5",
};
const D = { cx: 540, cy: 2330, rx: 980, ry: 1230, wall: 36 };
const surfY = (x, k) => D.cy - (D.ry * (k || 1)) * Math.sqrt(Math.max(0, 1 - Math.pow((x - D.cx) / (D.rx * (k || 1)), 2)));
const LAND = [540, surfY(540) - 18];      /* baseplate rest position */

/* ---------- water (screen space, parallax) ---------- */
function water(t, cam, day) {
  const bs = 1 + (cam[2] - 1) * 0.25;
  const g = E("g", { transform: `translate(540 960) scale(${bs}) translate(${-540 - (cam[0] - 540) * 0.25} ${-960 - (cam[1] - 940) * 0.25})` });
  const lg = E("linearGradient", { id: "kSea", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#236C9A"], ["30%", P.earthSea2], ["70%", "#10264E"], ["100%", P.bgDeep]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, lg));
  E("rect", { x: -500, y: -500, width: 2080, height: 2920, fill: "url(#kSea)" }, g);
  const sg = E("linearGradient", { id: "kShaft", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", "#CFF3FF", 0.42], ["100%", "#CFF3FF", 0]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, sg));
  for (let i = 0; i < 5; i++) {   /* light shafts from the surface: the visible source */
    const x = 120 + i * 220 + Math.sin(t * 0.5 + i * 1.7) * 40, w = 90 + (i % 2) * 60, lean = -160 + Math.sin(t * 0.4 + i) * 30;
    E("path", { d: `M ${x} -200 L ${x + w} -200 L ${x + w * 2.2 + lean} 1500 L ${x - w + lean} 1500 Z`, fill: "url(#kShaft)", opacity: (0.5 + 0.2 * Math.sin(t * 0.9 + i * 2)) * (day === undefined ? 1 : day), style: "mix-blend-mode:screen" }, g);
  }
  for (let i = 0; i < 46; i++) {  /* drifting plankton + bubbles */
    const sp = 0.4 + V2.rnd(3, i), x = ((V2.rnd(1, i) * 1400 - 160 + Math.sin(t * 0.7 * sp + i) * 26 - t * 14 * sp) % 1400 + 1400) % 1400 - 160;
    const y = ((V2.rnd(2, i) * 2100 - t * 46 * sp) % 2100 + 2100) % 2100 - 90, r = 2 + V2.rnd(4, i) * 5;
    if (i % 5 === 0) E("circle", { cx: x, cy: y, r: r + 5, fill: "none", stroke: "#CFF3FF", "stroke-width": 2.5, opacity: 0.45 }, g);
    else E("circle", { cx: x, cy: y, r, fill: i % 3 ? "#9FD8F0" : "#7DF0E4", opacity: 0.2 + V2.rnd(5, i) * 0.3 }, g);
  }
}

/* ---------- the phage (origin = baseplate centre) ---------- */
function phage(parent, x, y, s, o) {
  o = o || {};
  const land = o.land === undefined ? 1 : o.land, q = o.squat || 0, dna = o.dna === undefined ? 1 : o.dna;
  const g = E("g", { transform: `translate(${x} ${y}) rotate(${o.rot || 0}) scale(${s})`, opacity: o.alpha === undefined ? 1 : o.alpha }, parent);
  const Ls = lerp(172, 92, q), tubeB = lerp(-6, 86, q);
  const leg = (side, depth, i) => {
    const w = (o.wig || 0) * Math.sin((o.t || 0) * 5 + i * 1.9) * 16 * (1 - land);
    const hip = [side * 30 * depth, -6], knee = [side * lerp(64, 128, land) * depth + w, lerp(-150, -92 + q * 34, land)],
      foot = [side * lerp(88, 196, land) * depth + w * 1.6, lerp(-44, 26 + Math.abs(side) * 4 * (1 - depth), land)];
    const d = `M ${hip[0]} ${hip[1]} L ${knee[0]} ${knee[1]} L ${foot[0]} ${foot[1]}`;
    E("path", { d, stroke: P.ink, "stroke-width": 15, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: depth < 1 ? 0.75 : 1 }, g);
    E("path", { d, stroke: depth < 1 ? "#7FB6C9" : K.steel, "stroke-width": 7.5, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    E("circle", { cx: knee[0], cy: knee[1], r: 7, fill: K.sheath, stroke: P.ink, "stroke-width": 4 }, g);
  };
  [[-1, 0.62, 0], [1, 0.62, 1]].forEach((a) => leg(...a));           /* far pair */
  /* tail tube (the needle) */
  E("path", { d: `M -9 ${-Ls} L 9 ${-Ls} L 9 ${tubeB - 16} L 0 ${tubeB} L -9 ${tubeB - 16} Z`, fill: K.steel, stroke: P.ink, "stroke-width": 5, "stroke-linejoin": "round" }, g);
  /* contractile sheath with rings */
  E("rect", { x: -27, y: -Ls, width: 54, height: Ls - 10, rx: 10, fill: K.sheath, stroke: P.ink, "stroke-width": 6 }, g);
  for (let i = 1; i < 9; i++) E("path", { d: `M -24 ${-Ls + (i / 9) * (Ls - 10)} L 24 ${-Ls + (i / 9) * (Ls - 10)}`, stroke: K.sheathD, "stroke-width": 5 }, g);
  E("rect", { x: -20, y: -Ls + 4, width: 9, height: Ls - 20, rx: 4, fill: "#B8FFF6", opacity: 0.7 }, g);
  /* baseplate */
  E("path", { d: "M -46 -12 L 46 -12 L 34 6 L -34 6 Z", fill: K.plate, stroke: P.ink, "stroke-width": 6, "stroke-linejoin": "round" }, g);
  [-26, 0, 26].forEach((sx) => E("path", { d: `M ${sx} 6 l 0 ${10 + q * 6}`, stroke: P.ink, "stroke-width": 6, "stroke-linecap": "round" }, g));
  [[-1, 1, 2], [1, 1, 3], [-0.45, 0.9, 4], [0.45, 0.9, 5]].forEach((a) => leg(...a));   /* near legs */
  /* collar + head */
  const hy = -Ls - 16;
  E("rect", { x: -19, y: hy, width: 38, height: 18, rx: 6, fill: K.plate, stroke: P.ink, "stroke-width": 5 }, g);
  const H = [[0, hy], [78, hy - 54], [78, hy - 156], [0, hy - 210], [-78, hy - 156], [-78, hy - 54]];
  E("path", { d: pathOf(H, true), fill: K.head, stroke: P.ink, "stroke-width": 7, "stroke-linejoin": "round" }, g);
  const id = V2.uid("hd"), cp = E("clipPath", { id }, V2.defsHold); E("path", { d: pathOf(H, true) }, cp);
  const hc = E("g", { "clip-path": `url(#${id})` }, g);
  E("path", { d: pathOf([[0, hy], [78, hy - 54], [78, hy - 156], [0, hy - 210]], true), fill: K.headS, opacity: 0.8 }, hc);
  if (dna > 0.01) {   /* packed genome, drains from the top as it is injected */
    const top = hy - 200 + (1 - dna) * 190;
    let dd = "";
    for (let i = 0; i < 9; i++) { const yy = hy - 14 - i * 21; if (yy < top) break; dd += `M -52 ${yy} q 26 -16 52 0 t 52 0 `; }
    E("path", { d: dd, stroke: K.dna, "stroke-width": 11, fill: "none", "stroke-linecap": "round" }, hc);
    E("path", { d: dd, stroke: K.dnaHi, "stroke-width": 3, fill: "none", "stroke-linecap": "round", transform: "translate(0 -3)" }, hc);
  }
  E("path", { d: `M 0 ${hy} L 0 ${hy - 210} M -78 ${hy - 54} L 0 ${hy - 105} L 78 ${hy - 54}`, stroke: P.ink, "stroke-width": 3, fill: "none", opacity: 0.35 }, g);
  E("path", { d: `M -60 ${hy - 140} L -30 ${hy - 180}`, stroke: "#FFFFFF", "stroke-width": 9, "stroke-linecap": "round", opacity: 0.8 }, g);
  return g;
}
/* cheap copy for crowds */
function mini(parent, x, y, s, rot, o) {
  const g = E("g", { transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})`, opacity: o === undefined ? 1 : o }, parent);
  E("path", { d: "M 0 0 L -40 30 M 0 0 L 40 30 M 0 0 L -22 34 M 0 0 L 22 34", stroke: P.ink, "stroke-width": 13, "stroke-linecap": "round" }, g);
  E("path", { d: "M 0 0 L -40 30 M 0 0 L 40 30", stroke: K.steel, "stroke-width": 6, "stroke-linecap": "round" }, g);
  E("rect", { x: -13, y: -92, width: 26, height: 92, rx: 7, fill: K.sheath, stroke: P.ink, "stroke-width": 9 }, g);
  E("path", { d: "M 0 -92 L 46 -124 L 46 -186 L 0 -218 L -46 -186 L -46 -124 Z", fill: K.head, stroke: P.ink, "stroke-width": 10, "stroke-linejoin": "round" }, g);
  E("path", { d: "M 0 -92 L 46 -124 L 46 -186 L 0 -218 Z", fill: K.headS, opacity: 0.8 }, g);
  E("circle", { cx: 0, cy: -155, r: 17, fill: K.dna }, g);
}

/* ---------- the bacterium (a dome that runs off the bottom edge) ---------- */
function dome(S, t) {
  const k = 1 + (S.bulge || 0);
  const ell = (dr) => `M ${D.cx - (D.rx + dr) * k} ${D.cy} A ${(D.rx + dr) * k} ${(D.ry + dr) * k} 0 0 1 ${D.cx + (D.rx + dr) * k} ${D.cy} L ${D.cx + 1400} 2600 L ${D.cx - 1400} 2600 Z`;
  V2.glow(D.cx, surfY(D.cx, k) + 120, 760, "Warm", 0.3 * (1 - (S.gone || 0)));
  if ((S.gone || 0) >= 1) return;
  const g = E("g", { opacity: 1 - (S.gone || 0) });
  const cg = E("linearGradient", { id: "kCyto", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", K.cyto0], ["60%", K.cyto1]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, cg));
  const sg = E("linearGradient", { id: "kCell", x1: 0, y1: 0, x2: 0, y2: 1 }, V2.defsHold);
  [["0%", K.cellTop], ["55%", K.cellLow]].forEach(([o, c]) => E("stop", { offset: o, "stop-color": c }, sg));
  const inId = "kIn", icp = E("clipPath", { id: inId }, V2.defsHold); E("path", { d: ell(-D.wall) }, icp);
  /* wall: outer membrane / periplasm / inner membrane */
  E("path", { d: ell(0), fill: K.wallO, stroke: P.ink, "stroke-width": 7 }, g);
  E("path", { d: ell(-10), fill: K.wallI }, g);
  E("path", { d: ell(-D.wall + 8), fill: K.wallO }, g);
  /* interior */
  const inn = E("g", { "clip-path": `url(#${inId})` }, g);
  E("path", { d: ell(-D.wall), fill: "url(#kCyto)" }, inn);
  for (let i = 0; i < 90; i++) {
    const x = 90 + V2.rnd(11, i) * 900, y = 1170 + V2.rnd(12, i) * 780;
    if (y < surfY(x) + 60) continue;
    E("circle", { cx: x + Math.sin(t * 1.5 + i) * 5, cy: y + Math.cos(t * 1.2 + i * 2) * 5, r: 6 + V2.rnd(13, i) * 4, fill: lerp(0, 1, S.hijack || 0) > V2.rnd(14, i) ? K.dna : K.ribo, opacity: 0.6 }, inn);
  }
  if (S.inside) S.inside(inn);
  /* opaque surface (x-ray thins it) */
  const cov = E("g", { opacity: 1 - 0.9 * (S.xray || 0), "clip-path": `url(#${inId})` }, g);
  E("path", { d: ell(-D.wall), fill: "url(#kCell)" }, cov);
  for (let i = 0; i < 70; i++) {
    const x = 60 + V2.rnd(21, i) * 960, y = 1140 + V2.rnd(22, i) * 820;
    if (y < surfY(x) + 50) continue;
    E("ellipse", { cx: x, cy: y, rx: 13 + V2.rnd(23, i) * 12, ry: 7 + V2.rnd(24, i) * 6, fill: "#FFE0A6", opacity: 0.4 }, cov);
    E("circle", { cx: x + 30, cy: y + 34, r: 5, fill: K.wallO, opacity: 0.45 }, cov);
  }
  E("ellipse", { cx: D.cx - 190, cy: 1260, rx: 300, ry: 70, fill: "#FFF3D6", opacity: 0.35, transform: `rotate(-9 ${D.cx - 190} 1260)` }, cov);
  /* pili along the horizon */
  for (let i = 0; i < 26; i++) {
    const x = 40 + i * 40 + V2.rnd(31, i) * 16; if (Math.abs(x - 540) < 230) continue;
    const y = surfY(x, k), l = 34 + V2.rnd(32, i) * 40, sw = Math.sin(t * 1.6 + i) * 8, nx = (x - D.cx) / D.rx;
    E("path", { d: `M ${x} ${y} q ${nx * 30 + sw} ${-l * 0.6} ${nx * 50 + sw * 1.8} ${-l}`, stroke: P.ink, "stroke-width": 9, fill: "none", "stroke-linecap": "round" }, g);
    E("path", { d: `M ${x} ${y} q ${nx * 30 + sw} ${-l * 0.6} ${nx * 50 + sw * 1.8} ${-l}`, stroke: K.cellTop, "stroke-width": 4, fill: "none", "stroke-linecap": "round" }, g);
  }
  /* lysis: bright cracks eating the wall from inside */
  const c = S.cracks || 0;
  if (c > 0) for (let i = 0; i < 11; i++) {
    const x = 70 + i * 94, y = surfY(x, k), kk = cl(c * 1.4 - V2.rnd(41, i) * 0.4), L = 150 * kk + 420 * kk * kk;
    if (kk <= 0) continue;
    const d = `M ${x} ${y + 6} l ${10} ${L * 0.3} l ${-16} ${L * 0.3} l ${12} ${L * 0.4}`;
    E("path", { d, stroke: "#FFFFFF", "stroke-width": 16, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.9 }, g);
    E("path", { d, stroke: K.dna, "stroke-width": 6, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    V2.glow(x, y + 10, 90 * kk, "Warm", 0.7, g);
  }
}
const COPY = []; for (let i = 0; i < 100; i++) {
  let x, y, n = 0; do { x = 110 + V2.rnd(51, i + n * 100) * 860; y = 1230 + V2.rnd(52, i + n * 100) * 640; n++; } while (y < surfY(x) + 130 && n < 30);
  COPY.push([x, y, V2.rnd(53, i) * 360]);
}
function dnaPath(p) {
  const pts = [], N = 90, upto = Math.floor(N * cl(p));
  for (let i = 0; i <= upto; i++) {
    const s = i / N;
    if (s < 0.3) pts.push([540 + Math.sin(s * 40) * 18, LAND[1] + 100 + (s / 0.3) * 236]);
    else { const a = (s - 0.3) * 26, r = 30 + (s - 0.3) * 250; pts.push([540 + Math.cos(a + 1.57) * r, LAND[1] + 400 + Math.sin(a + 1.57) * r * 0.62]); }
  }
  return pts;
}
function strand(parent, pts, col, hi, w) {
  if (pts.length < 2) return;
  E("path", { d: pathOf(pts), stroke: P.ink, "stroke-width": w + 8, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
  E("path", { d: pathOf(pts), stroke: col, "stroke-width": w, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
  E("path", { d: pathOf(pts), stroke: hi, "stroke-width": w * 0.28, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.8 }, parent);
}
function hostDNA(parent, t, takeover, shatter) {
  const c = [540, LAND[1] + 400];
  if (shatter >= 1) return;
  for (let j = 0; j < 7; j++) {
    const pts = [], a0 = j * 0.9, fly = V2.easeOut(shatter) * (120 + j * 30);
    for (let i = 0; i <= 12; i++) { const a = a0 + i * 0.075, r = 120 + Math.sin(a * 7 + j + t * 1.2) * 34; pts.push([c[0] + Math.cos(a) * (r + fly), c[1] + Math.sin(a) * (r + fly) * 0.6]); }
    const g = E("g", { opacity: 1 - shatter }, parent);
    strand(g, pts, takeover > j / 7 ? K.dna : K.host, takeover > j / 7 ? K.dnaHi : "#BFE0FF", 15);
  }
}
/* ---------- hero ---------- */
const POSES = {
  skygawk: { tilt: -4, headTilt: -14, look: -0.6, expr: "shock", armL: { a: 30, b: -34 }, armR: { a: 148, b: -100 }, legL: { a: -14, b: 4 } },
  recoil:  { tilt: 11, headTilt: 10, look: -0.7, expr: "oops", armL: { a: 70, b: -120 }, armR: { a: 118, b: -118 }, legR: { a: -24, b: 26 } },
  point:   { tilt: -5, headTilt: -8, look: -0.6, expr: "happy", armL: { a: 74, b: -14 }, armR: { a: -8, b: -6 } },
  amazed:  { tilt: 0, headTilt: -12, look: -0.5, expr: "shock", armL: { a: 44, b: -44 }, armR: { a: 132, b: -92 } },
  pull:    { tilt: 14, headTilt: 4, look: -0.6, expr: "smug", armL: { a: 62, b: -12 }, armR: { a: -52, b: -34 }, legL: { a: 24, b: -4 }, legR: { a: -22, b: 22 } },
  inspect: { tilt: -16, headTilt: -16, look: -0.8, expr: "neutral", armL: { a: 52, b: 6 }, armR: { a: -24, b: -18 }, legL: { a: 10, b: 0 }, legR: { a: -14, b: 10 } },
  happy:   { tilt: -3, headTilt: 6, look: -0.3, expr: "happy", armL: { a: 150, b: -24 }, armR: { a: 150, b: -24 } },
};
const blinkAt = (t) => (V2.rnd(41, Math.floor(t / 2.3)) < 0.5 && (t % 2.3) < 0.14 ? 1 : 0);
function hero(t, name, x, z, sc, extra) {
  const [fx, fy] = pr(x, z), base = POSES[name] || {}, sw = Math.sin(t * 2.2) * 5;
  const p = Object.assign({}, V2.basePose, base, { x: fx, y: fy - 140 * sc - 6 * sc + Math.sin(t * 2.6) * 3 * sc, scale: sc, blink: blinkAt(t),
    tilt: (base.tilt || 0) + Math.sin(t * 1.7) * 2, squash: 0.014 * Math.sin(t * 2.6), sway: Math.sin(t * 2.2) * 6 }, extra || {});
  p.armL = Object.assign({}, p.armL, { a: p.armL.a + sw });
  p.armR = Object.assign({}, p.armR, { a: p.armR.a - sw * 0.7 });
  E("ellipse", { cx: fx, cy: fy + 4, rx: 92 * sc, ry: 20 * sc, fill: "#7A3340", opacity: 0.42 });
  V2.Hero(p, null, "vRimL", 0);
  return p;
}
const handOf = (p, arm) => V2.toWorld(p, V2.joints(p)[arm].end);

/* ---------- text systems (screen space; ONE per scene, ≤8 words — C1) ---------- */
function title(lines, y, size, kf) {
  lines.forEach((ln, i) => {
    const k = kf(i); if (k <= 0.001) return;
    const pop = V2.backOut(cl(k));
    V2.txt(540, y + i * size * 1.06 + (1 - pop) * 50, ln, { "text-anchor": "middle", "font-family": TITLE_FONT, "font-weight": 800,
      "font-size": size, fill: P.cream, stroke: P.ink, "stroke-width": 16, "stroke-linejoin": "round", "paint-order": "stroke", opacity: cl(k * 2) });
  });
}
function chip(k, x, y, text, accent, size, strike) {
  if (k <= 0.001) return;
  size = size || 44;
  const pop = V2.backOutBig(cl(k)), w = text.length * size * 0.6 + 86, h = size * 1.75;
  const g = E("g", { opacity: cl(k * 3), transform: `translate(${x} ${y}) scale(${0.7 + 0.3 * pop})` });
  E("rect", { x: -w / 2, y: -h / 2 + 7, width: w, height: h, rx: h * 0.28, fill: "#000", opacity: 0.35 }, g);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: h * 0.28, fill: P.ink, stroke: P.cream, "stroke-width": 4 }, g);

function camOf(idx, lt, dur) {
  const sc = SC[TL[idx].id], a = sc.cam[0], b = sc.cam[1], u = V2.easeInOut(cl(lt / dur) * 0.85 + 0.075);
  let c = [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
  if (idx > 0 && lt < 0.36) {   /* whip in from the previous scene's last camera: one continuous take */
    const pv = SC[TL[idx - 1].id].cam[1], k = V2.easeOutQuint(lt / 0.36);
    c = [lerp(pv[0], c[0], k), lerp(pv[1], c[1], k), lerp(pv[2], c[2], k)];
  }
  return c;
}

function renderFrame(t) {
  V2.root.innerHTML = "";
  V2.defsHold = E("defs", {}, V2.root);
  V2.defs(V2.root);
  let idx = TL.length - 1;
  for (let i = 0; i < TL.length; i++) if (t < TL[i].end - 1e-6) { idx = i; break; }
  const sc = TL[idx], def = SC[sc.id] || SC.hook;
  const lt = Math.max(0, t - sc.start), dur = sc.end - sc.start, u = cl(lt / dur);
  const cam = camOf(idx, lt, dur);
  const S = def.world(lt, u, t, dur);
  if (S.shake) cam[1] += S.shake;
  water(t, cam, S.day);
  withCam(cam, () => { if (!S.noDome) dome(S, t); if (S.over) S.over(); });
  def.over(lt, u, t, dur, cam);
  const vg = E("radialGradient", { id: "kVig" }, V2.defsHold);
  [["62%", "#05050A", 0], ["100%", "#05050A", 0.5]].forEach(([o, c, a]) => E("stop", { offset: o, "stop-color": c, "stop-opacity": a }, vg));
  E("rect", { x: -20, y: -20, width: 1120, height: 1960, fill: "url(#kVig)" });
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, filter: "url(#vGrain)", opacity: 0.5, transform: `translate(${(Math.floor(t * 15) % 2) * 3} ${Math.floor(t * 15) % 3})` });
}
window.renderFrame = renderFrame;
renderFrame(0);
</script>
