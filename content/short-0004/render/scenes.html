<script>
/* ============================================================
   Short #0004 v3 — "Why is the sky blue? (It's not the ocean)"
   ENGINE V3, third video — FIRST under the day-010 rules:
   · L-073 orient: beat 1 NAMES the topic (question-first hook)
   · L-075 pacing: 11 beats, mean 2.8s, max 3.2s, 0.25s gaps
   · L-076 keyword captions ONLY (≤5 words, scrim pill, no
     full-sentence subtitles — hook/closer use the kinetic title
     AS the caption, never two competing text systems)
   · L-077 one spine one closer (no tangent entities late)
   · character life: 11 distinct poses, breath bob ×2, blinks
   · cards BREATHE: ease-in 0.25 → hold ≥0.5 → ease-out 0.25
   · contrast: brighter panels, thicker beams, bigger photons
   · day variant of the channel world (azure dome, sea, dunes)
   Deterministic: every frame a pure function of t (L-043).
   Timeline injected by tools/render_short.py (__TIMELINE__).
   ============================================================ */
const TL = __TIMELINE__;
const T_END = __T_END__;
V2.root = document.getElementById("frame");
const P = V2.P;

/* ---------- DAY palette (channel world, daylight variant) ---------- */
const DAY = {
  skyTop: "#123C8C", skyMid: "#1E5AC8", skyLow: "#3E8BDD", horizon: "#BFE0FF",
  sun: "#FFF6D8", sunGlow: "#FFE9A8",
  sea: "#14509E", sea2: "#0D3A78", seaLit: "#2E7BC8",
  sand: "#E8C87A", sand2: "#D4A84E", sand3: "#B8873C",
  photon: "#5AB8FF", photonHot: "#8FD3FF",
  panel: "#1D2F5E", panelLine: "#5566A0", panelInner: "#4A5A94",
};
const RAINBOW = ["#8A5AFF", "#3E7BFF", "#37C4A0", "#FFD23E", "#FF9A3D", "#FF5A4A"];

/* ---------- poses — 11 distinct, no adjacent repeats (L-day-010 rule 16) ---------- */
const POSES = {
  skygawk: { tilt: -4, headTilt: -16, look: 0.15, expr: "shock",
             armL: { a: 24, b: -30 }, armR: { a: 150, b: -96 }, handR: "open",
             legL: { a: -13, b: 4 } },
  lean:    { tilt: 6, yaw: 0.45, look: 0.5, headTilt: -6,
             armL: { a: 30, b: -26 }, armR: { a: 34, b: -28 }, expr: "neutral" },
  shield:  { tilt: -2, headTilt: -14, look: 0.1,
             armL: { a: 148, b: -14 }, armR: { a: 40, b: -20 }, handL: "open",
             expr: "neutral" },
  present: { tilt: 2, yaw: 0.3, look: 0.4, headTilt: -6,
             armL: { a: 18, b: -14 }, armR: { a: 138, b: -10 }, handR: "point" },
  pointup: { tilt: -3, look: -0.2, headTilt: -10,
             armL: { a: 20, b: -18 }, armR: { a: 152, b: -14 }, handR: "point",
             expr: "neutral" },
  amazed:  { tilt: -3, look: 0, armL: { a: 150, b: -100 }, armR: { a: 146, b: -100 }, expr: "shock" },
  away:    { tilt: 4, yaw: -0.35, look: -0.45, headTilt: -4,
             armL: { a: 140, b: -18 }, armR: { a: 26, b: -22 }, handL: "point",
             expr: "neutral" },
  smug:    { tilt: 0, yaw: 0.5, look: 0.55, headTilt: 2,
             armL: { a: 58, b: -96 }, armR: { a: 122, b: -96 }, expr: "smug" },
  peer:    { tilt: 14, headTilt: 24, look: 0.25,
             armL: { a: 26, b: -22 }, armR: { a: 34, b: -26 }, expr: "neutral" },
  happy:   { tilt: 0, look: 0.1, headTilt: -4,
             armL: { a: 22, b: -16 }, armR: { a: 26, b: -22 },
             expr: "happy" },
};
/* character LIFE: doubled breath bob, blink every ~3s, look drift (day-010) */
const idleBlink = (t, off) => ((((t + (off || 0)) % 70) < 4 ? 1 : 0) ||
                               (((t + (off || 0)) % 70) > 64 ? 0.6 : 0));
const pose = (name, t, x, y, scale, extra) => Object.assign({}, V2.basePose, POSES[name] || {},
  { x, y: y + Math.sin(t / 12) * 8, scale,
    blink: idleBlink(t, 40),
    look: (POSES[name] || {}).look !== undefined
      ? Math.max(-1, Math.min(1, (POSES[name]).look + Math.sin(t / 9) * 0.12)) : 0,
  }, extra || {});

/* ---------- scarf (channel identity prop, windier today) ---------- */
function scarf(x, y, scale, t, parent) {
  const w = Math.sin(t / 3.2) * 14;
  const g = V2.el("g", {}, parent);
  V2.el("path", { d: `M ${x - 30 * scale} ${y - 118 * scale} q 30 ${14 * scale} 60 0 l 0 ${16 * scale} q -30 ${12 * scale} -60 0 z`,
    fill: P.orange, stroke: "#121019", "stroke-width": 4 }, g);
  V2.el("path", { d: `M ${x + 26 * scale} ${y - 108 * scale} q ${40 + w} ${12 * scale} ${22 + w * 1.5} ${58 * scale} q ${-16 - w * 0.4} ${-9 * scale} ${-28} ${-22 * scale} z`,
    fill: P.amber, stroke: "#121019", "stroke-width": 4, "stroke-linejoin": "round" }, g);
}

/* ---------- the DAY world ---------- */
function dayDefs() {
  const d = V2.el("defs", {}, V2.root);
  const g = V2.el("linearGradient", { id: "dzDay", x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  [["0%", "#1B4CA6"], ["42%", "#2E6ED4"], ["78%", "#5FA5E8"], ["100%", "#CDE6FF"]]
    .forEach(([o, c]) => V2.el("stop", { offset: o, "stop-color": c }, g));
  const g2 = V2.el("linearGradient", { id: "dzDayDeep", x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  [["0%", "#12388A"], ["45%", "#1E56C4"], ["80%", "#3F8ADC"], ["100%", "#A8D0F4"]]
    .forEach(([o, c]) => V2.el("stop", { offset: o, "stop-color": c }, g2));
  const rg = V2.el("radialGradient", { id: "dzSunD" }, d);
  [["0%", DAY.sun, 1], ["32%", DAY.sunGlow, 0.55], ["100%", DAY.sunGlow, 0]]
    .forEach(([o, c, op]) => V2.el("stop", { offset: o, "stop-color": c, "stop-opacity": op }, rg));
  const sg = V2.el("linearGradient", { id: "dzSea", x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  [["0%", DAY.seaLit], ["34%", DAY.sea], ["100%", DAY.sea2]]
    .forEach(([o, c]) => V2.el("stop", { offset: o, "stop-color": c }, sg));
  /* DAY vignette: light, airy — the dusk V2.grade vignette reads 'night' on azure */
  const vg = V2.el("radialGradient", { id: "dayVig", cx: 0.5, cy: 0.42, r: 0.75 }, d);
  [["0%", "#06122E", 0], ["62%", "#06122E", 0], ["100%", "#06122E", 0.16]]
    .forEach(([o, c, op]) => V2.el("stop", { offset: o, "stop-color": c, "stop-opacity": op }, vg));
}
function daySky(t, cam, opts) {
  const o = opts || {};
  const deep = o.deep || 0;  /* s2: sweep to the saturated deep dome */
  if (deep > 0) {
    V2.el("rect", { x: -260, y: -260, width: 1600, height: 2440, fill: "url(#dzDay)" }, cam);
    V2.el("rect", { x: -260, y: -260, width: 1600, height: 2440, fill: "url(#dzDayDeep)", opacity: deep }, cam);
  } else {
    V2.el("rect", { x: -260, y: -260, width: 1600, height: 2440, fill: "url(#dzDay)" }, cam);
  }
  const sx = o.sunX === undefined ? 820 : o.sunX, sy = o.sunY === undefined ? 260 : o.sunY;
  V2.el("circle", { cx: sx, cy: sy, r: 560, fill: "url(#dzSunD)", opacity: 0.4, style: "mix-blend-mode:screen" }, cam);
  V2.el("circle", { cx: sx, cy: sy, r: 120, fill: "url(#dzSunD)", opacity: 0.75, style: "mix-blend-mode:screen" }, cam);
  V2.el("circle", { cx: sx, cy: sy, r: 54, fill: DAY.sun, opacity: 0.95 }, cam);
  /* drifting fair-weather cumulus */
  for (let i = 0; i < 4; i++) {
    const cy2 = 190 + i * 105 + V2.rnd(5, i) * 40;
    const cx2 = ((t * (7 + i * 3) + V2.rnd(8, i) * 1400) % 1600) - 260;
    const s = 0.7 + V2.rnd(6, i) * 0.7;
    const cl = V2.el("g", { opacity: 0.85 - i * 0.12 }, cam);
    [[0, 0, 74], [-64, 14, 46], [66, 12, 50], [22, -30, 44], [-30, -24, 36]].forEach(([dx, dy, r]) =>
      V2.el("circle", { cx: cx2 + dx * s, cy: cy2 + dy * s, r: r * s, fill: "#FFFFFF" }, cl));
  }
  if (o.horizonY !== undefined)
    V2.el("rect", { x: -260, y: o.horizonY, width: 1600, height: 8, rx: 4, fill: DAY.horizon, opacity: 0.7 }, cam);
}
function seaBand(t, cam, y0, h) {
  V2.el("rect", { x: -260, y: y0, width: 1600, height: h, fill: "url(#dzSea)" }, cam);
  /* sun glitter path on the water */
  for (let i = 0; i < 14; i++) {
    const gy = y0 + 26 + i * (h / 16);
    const wob = Math.sin(t / 4 + i) * 30;
    const wpx = 260 - i * 12 + wob;
    V2.el("rect", { x: 540 - wpx / 2, y: gy, width: Math.max(40, wpx), height: 7, rx: 4,
      fill: DAY.sunGlow, opacity: 0.5 - i * 0.03, style: "mix-blend-mode:screen" }, cam);
  }
  /* foam lines */
  for (let i = 0; i < 5; i++) {
    const fy = y0 + h - 30 - i * 26;
    V2.el("path", { d: `M ${-100 + Math.sin(t / 3 + i * 2) * 40} ${fy} q 130 ${-16} 260 0 t 260 0 t 260 0 t 260 0 t 260 0`,
      stroke: "#DCEFFF", "stroke-width": 5, fill: "none", opacity: 0.35 }, cam);
  }
}
function dunes(t, cam) {
  /* layered dune hills, warm sand tones */
  V2.el("path", { d: "M -260 1180 Q 140 1010 460 1130 Q 760 1230 1060 1080 Q 1240 1000 1340 1090 L 1340 1450 L -260 1450 Z",
    fill: DAY.sand2 }, cam);
  V2.el("path", { d: "M -260 1270 Q 200 1150 520 1250 Q 820 1340 1340 1200 L 1340 1450 L -260 1450 Z",
    fill: DAY.sand }, cam);
  /* wind ripples on the front dune */
  for (let i = 0; i < 8; i++) {
    const ry = 1290 + i * 22;
    V2.el("path", { d: `M ${-140 + i * 22} ${ry} q 90 ${-10} 190 2 t 200 2`,
      stroke: DAY.sand3, "stroke-width": 4, fill: "none", opacity: 0.4 }, cam);
  }
  /* heat shimmer bands */
  for (let i = 0; i < 3; i++) {
    V2.el("rect", { x: -260, y: 1090 + i * 36 + Math.sin(t / 5 + i) * 5, width: 1600, height: 9,
      fill: DAY.horizon, opacity: 0.20, style: "mix-blend-mode:screen" }, cam);
  }
  V2.el("rect", { x: -260, y: 1440, width: 1600, height: 620, fill: DAY.sand2 }, cam);
}
function groundPatch(x, hipsY, scale, parent, col) {
  const fy = hipsY + 140 * scale + 6;
  V2.el("ellipse", { cx: x, cy: fy + 8, rx: 120 * scale, ry: 26 * scale, fill: col || "#0D2250", opacity: 0.55 }, parent);
  V2.el("ellipse", { cx: x, cy: fy, rx: 86 * scale, ry: 17 * scale, fill: col ? "#FFFFFF" : "#1E3A7A", opacity: col ? 0.25 : 0.75 }, parent);
}

/* ---------- photon: bigger + hotter than #0003 (contrast fix) ---------- */
function photon(x, y, r, col, t, parent, seed) {
  const g = V2.el("g", {}, parent);
  V2.el("circle", { cx: x, cy: y, r: r * 3.0, fill: col, opacity: 0.2, style: "mix-blend-mode:screen" }, g);
  V2.el("circle", { cx: x, cy: y, r: r, fill: col,
    style: `filter: drop-shadow(0 0 ${r * 2.2}px ${col})`, opacity: 0.98 }, g);
  return g;
}
function molecule(cx, cy, s, t, parent, col) {
  const g = V2.el("g", { transform: `translate(${cx} ${cy}) rotate(${Math.sin(t / 2.1) * 14})` }, parent);
  const c = col || DAY.photonHot;
  V2.el("circle", { cx: -s * 0.5, cy: s * 0.2, r: s * 0.42, fill: c, opacity: 0.95 }, g);
  V2.el("circle", { cx: s * 0.5, cy: -s * 0.15, r: s * 0.5, fill: "#CDD9EC", opacity: 0.95 }, g);
  V2.el("circle", { cx: 0, cy: s * 0.45, r: s * 0.3, fill: c, opacity: 0.8 }, g);
  return g;
}
/* bright panel (day-010 contrast fix: lighter fill, brighter lines) */
function stagePanel(cam, opts) {
  const o = Object.assign({ x: 90, y: 360, w: 900, h: 700, op: 0.6 }, opts || {});
  const g = V2.el("g", {}, cam);
  V2.el("rect", { x: o.x - 24, y: o.y - 24, width: o.w + 48, height: o.h + 48, rx: 54,
    fill: "#081028", opacity: o.op }, g);
  V2.el("rect", { x: o.x, y: o.y, width: o.w, height: o.h, rx: 40,
    fill: DAY.panel, stroke: DAY.panelLine, "stroke-width": 5, opacity: 0.94 }, g);
  V2.el("rect", { x: o.x + 14, y: o.y + 14, width: o.w - 28, height: o.h - 28, rx: 30,
    fill: "none", stroke: DAY.panelInner, "stroke-width": 2.5, opacity: 0.6 }, g);
  [[o.x + 26, o.y + 26, 1, 1], [o.x + o.w - 26, o.y + 26, -1, 1],
   [o.x + 26, o.y + o.h - 26, 1, -1], [o.x + o.w - 26, o.y + o.h - 26, -1, -1]]
    .forEach(([tx, ty, dx, dy]) =>
      V2.el("path", { d: `M ${tx + dx * 26} ${ty} L ${tx} ${ty} L ${tx} ${ty + dy * 26}`,
        stroke: "#7A8AC0", "stroke-width": 5, fill: "none", opacity: 0.85 }, g));
  return g;
}
/* BREATHE envelope (boss note: cards snap → let them hold).
   in 0.25s → hold → out 0.25s. at = in-start, outAt = out-start. */
const breathe = (tau, at, outAt) => {
  if (tau < at) return 0;
  if (outAt !== undefined && tau > outAt) return 1 - V2.easeInOut(Math.min(1, (tau - outAt) / 0.25));
  return V2.easeInOut(Math.min(1, (tau - at) / 0.25));
};
function stampCard(x, y, k, label, parent, accent, size) {
  const S = (size || 300) / 300;
  const pop = V2.backOut(V2.clamp01(k));
  const w = 460, h = 210;
  const g = V2.el("g", { transform: `translate(${x} ${y}) scale(${(0.6 + 0.4 * pop) * S}) translate(${-x} ${-y})`, opacity: Math.min(1, k * 3) }, parent);
  V2.glow(x, y, w * 0.9, "Teal", 0.3, g);
  V2.el("rect", { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 34, fill: "#101A3E", stroke: accent || DAY.panelLine, "stroke-width": 6 }, g);
  V2.txt(x, y + 20, label, { "text-anchor": "middle", "font-family": V2.UI_DISPLAY,
    "font-weight": 800, "font-size": 84, fill: "#FFFFFF",
    style: "filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8))" }, g);
  return g;
}

/* ============================================================
   SCENES (u = local progress, t = global time, tau = local seconds)
   ============================================================ */
const SCENES = {

  /* HOOK — orient + myth named (L-073). Shore world. The kinetic title
     IS the caption this scene — no band caption, one text system. */
  hook(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 980, V2.kf(t, [[0, 1.0], [90, 1.07]]) )});
    daySky(t, cam, { sunX: 780, sunY: 240 });
    seaBand(t, cam, 1080, 390);
    /* sun rays sweeping the mid-band + drifting photon motes (fill the void) */
    for (let i = 0; i < 7; i++) {
      const a = 2.05 + i * 0.13 + Math.sin(t / 40 + i) * 0.02;
      const len = 560 + Math.sin(t / 18 + i * 2.1) * 60;
      V2.el("line", { x1: 780, y1: 240, x2: 780 + Math.cos(a) * len, y2: 240 + Math.sin(a) * len,
        stroke: DAY.sunGlow, "stroke-width": 6, "stroke-linecap": "round", opacity: 0.13, style: "mix-blend-mode:screen" }, cam);
    }
    for (let i = 0; i < 14; i++) {
      const mx = ((t * (12 + i * 4) + V2.rnd(14, i) * 1300) % 1500) - 210;
      const my = 900 + V2.rnd(15, i) * 260 + Math.sin(t / 7 + i) * 24;
      photon(mx, my, 5 + V2.rnd(16, i) * 3, DAY.photonHot, t, cam, i);
    }
    /* shore rock bottom-right, hero BIG, gawking up (scaled for life) */
    V2.el("path", { d: "M 660 1520 Q 760 1300 930 1315 Q 1040 1330 1060 1520 Z", fill: "#0D2250", opacity: 0.92 }, cam);
    V2.el("path", { d: "M -260 1560 Q -60 1520 120 1560 T 500 1560 T 880 1560 T 1260 1560 L 1260 1620 L -260 1620 Z", fill: "#0B2E68", opacity: 0.85 }, cam);
    const px = 860, py = 1380;
    groundPatch(px, py, 1.12, cam);
        V2.Hero(pose("skygawk", t, px, py, 1.12), null, "vRimR", 1, cam);
    scarf(px, py, 1.12, t, cam);
    /* mirror shimmer line at the waterline (the myth, visually) */
    const shim = 0.5 + 0.5 * Math.sin(t / 2.6);
    V2.el("rect", { x: -260, y: 1076, width: 1600, height: 10, rx: 5, fill: "#FFFFFF", opacity: 0.35 + shim * 0.3, style: "mix-blend-mode:screen" }, cam);
    /* KINETIC TITLE = the caption (7 words total, word-synced, CENTERED in
       the mid-band — no dead void, warm white for daylight) */
    const tau = t - TL[0].start;
    const bigWord = (txt, at, y, size, fill) => {
      if (tau < at) return;
      const k = V2.backOut(V2.clamp01((tau - at) / 0.26));
      V2.txt(540, y + (1 - k) * 26, txt, { "text-anchor": "middle", "font-family": V2.UI_DISPLAY,
        "font-weight": 800, "font-size": size * (0.7 + 0.3 * k), fill,
        style: "filter: drop-shadow(0 6px 18px rgba(4,16,42,0.95)) drop-shadow(0 0 34px rgba(90,184,255,0.45))" }, cam);
    };
    if (tau > 0.10) V2.glow(540, 640, 400 * V2.clamp01((tau - 0.10) / 0.3), "Teal", 0.32, cam);
    bigWord("WHY IS THE", 0.10, 520, 102, "#FFFDF4");
    bigWord("SKY BLUE?", 0.42, 640, 116, "#FFFDF4");
    bigWord("THE OCEAN?", 1.55, 790, 92, "#FFD9A0");
  },

  /* S0 — the seduction: symmetric mirror, then the crack. */
  s0(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 980, V2.kf(t, [[0, 1.0], [96, 1.05]]) )});
    daySky(t, cam, { sunX: 540, sunY: 200 });
    /* sun rays fill the upper sky (no dead zone) */
    for (let i = 0; i < 5; i++) {
      const a = 2.1 + i * 0.16;
      V2.el("line", { x1: 540, y1: 200, x2: 540 + Math.cos(a) * 640, y2: 200 + Math.sin(a) * 640,
        stroke: DAY.sunGlow, "stroke-width": 7, "stroke-linecap": "round", opacity: 0.15, style: "mix-blend-mode:screen" }, cam);
    }
    /* the sea MIRRORS the sky (the seductive symmetry) */
    seaBand(t, cam, 1130, 360);
    const sym = 1 - breathe(tau0(t, 0), 1.9);   /* dims after the crack */
    V2.el("rect", { x: -260, y: 1130, width: 1600, height: 360, fill: "#FFFFFF", opacity: 0.10 * sym, style: "mix-blend-mode:screen" }, cam);
    for (let i = 0; i < 6; i++) {  /* reflected clouds in the water */
      const cy = 1180 + i * 52;
      V2.el("ellipse", { cx: 260 + (i % 3) * 280, cy, rx: 120 - i * 10, ry: 20, fill: "#FFFFFF", opacity: 0.16 * sym }, cam);
    }
    const tau = tau0(t, 0);
    /* ONE text system: the kinetic NOPE carries the strike beat; the
       mirror visual itself says below/above (ultracritic r1: two-caption
       conflict + label clipped behind the hero — killed the tag pair) */
    /* THE CRACK on "It's wrong." (~1.9s) */
    if (tau > 2.55) {
      const k = V2.backOut(V2.clamp01((tau - 2.55) / 0.22));
      V2.el("path", { d: "M 540 1010 l -34 130 l 48 96 l -60 120 l 52 130",
        stroke: "#FFFFFF", "stroke-width": 9 * k, fill: "none", "stroke-linecap": "round",
        style: "filter: drop-shadow(0 0 22px rgba(255,255,255,0.9))" }, cam);
      V2.glow(700, 900, 320 * k, "Warm", 0.45, cam);
      V2.txt(700, 950 - k * 14, "NOPE.", { "text-anchor": "middle", "font-family": V2.UI_DISPLAY,
        "font-weight": 800, "font-size": 132 * (0.7 + 0.3 * k), fill: "#FFFDF4",
        style: "filter: drop-shadow(0 6px 18px rgba(4,16,42,0.95))" }, cam);
    }
    /* hero leans in near the action line, reacts to the crack (oops face) */
    groundPatch(430, 1380, 1.3, cam);
        V2.Hero(pose("lean", t, 430, 1380, 1.3, tau > 2.55 ? { expr: "oops", headTilt: -12 } : null), null, "vRimR", 1, cam);
    scarf(430, 1380, 1.3, t, cam);
  },

  /* S1 — Sahara teardown 1a. Full desert swap. */
  s1(u, t) {
    const cam = V2.el("g", { transform: V2.cam(540, 950, V2.kf(t, [[0, 1.02], [87, 1.0]]) )});
    daySky(t, cam, { sunX: 860, sunY: 300 });
    dunes(t, cam);
    /* extra far ridge (fill the mid void, depth layer) */
    V2.el("path", { d: "M -260 1060 Q 300 940 700 1040 Q 1000 1100 1340 1010 L 1340 1200 L -260 1200 Z",
      fill: DAY.sand3, opacity: 0.45 }, cam);

          fill: DAY.photon, opacity: 0.45, stroke: DAY.photonHot, "stroke-width": 4 }, cam);
      });
    }
    const sg = breathe(tau, 0.9);
    if (sg > 0) {
      V2.glow(540, 1310, 360 * sg, "Teal", 0.4, cam);
      photon(340, 1290 - sg * 40, 8, DAY.photonHot, t, cam, 51);
      photon(700, 1330 - sg * 30, 7, DAY.photonHot, t, cam, 52);
      V2.el("rect", { x: -260, y: 1150, width: 1600, height: 300, fill: DAY.photon, opacity: 0.14 * sg, style: "mix-blend-mode:screen" }, cam);
    }
    /* hero relaxed on the shore rock — loop mirror of the hook */
    V2.el("path", { d: "M 620 1440 Q 700 1180 880 1200 Q 1000 1220 1020 1440 Z", fill: "#0D2250", opacity: 0.92 }, cam);
    const px = 850, py = 1400;
    groundPatch(px, py, 0.9, cam);
        V2.Hero(pose("happy", t, px, py, 1.25), null, "vRimR", 1, cam);
    scarf(px, py, 1.25, t, cam);
    /* KINETIC CLOSER = the caption (3 words) */
    const bigWord = (txt, at, y, size) => {
      if (tau < at) return;
      const k = V2.backOut(V2.clamp01((tau - at) / 0.26));
      V2.txt(540, y + (1 - k) * 26, txt, { "text-anchor": "middle", "font-family": V2.UI_DISPLAY,
        "font-weight": 800, "font-size": size * (0.7 + 0.3 * k), fill: "#FFFFFF",
        style: "filter: drop-shadow(0 6px 16px rgba(4,16,42,0.95)) drop-shadow(0 0 30px rgba(90,184,255,0.3))" }, cam);
    };
    if (tau > 0.9) V2.glow(540, 700, 330 * V2.clamp01((tau - 0.9) / 0.3), "Teal", 0.3, cam);
    bigWord("THEY JUST", 1.15, 660, 96);
    bigWord("MATCHED.", 1.5, 770, 104);
  },
};

/* local seconds inside scene n (TL index) */
function tau0(t, n) { return t - TL[n].start; }

/* caption keywords per scene — THE caption (L-076). hook + closer use the
   kinetic title instead (one text system, never two). */
const EMPHASIS = {
  hook: null,
  s0: null,
  s1: null,   /* SAHARA stamp is the text */
  s2: null,   /* SAME BLUE. stamp is the text */
  s3: null,  /* AIR label is the text */
  s4: null,   /* verdict stamp BLUE ≈ 6× IS the text (one system) */
  s5: null,  /* EVERY PATCH header is the text */
  s6: null, /* swatch labels are the text */
  s7: null,   /* NOT A MIRROR strike IS the text (one system) */
  s8: ["eats", "red", "keeps", "blue"],
  s9: null,
};

function renderFrame(t) {
  V2.root.innerHTML = "";
  dayDefs();
  V2.el("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: DAY.skyTop });
  V2.defs(V2.root);
  let idx = TL.length - 1;
  for (let i = 0; i < TL.length; i++)
    if (t < TL[i].end - 1e-6) { idx = i; break; }
  const sc = TL[idx];
  const u = V2.clamp01((t - sc.start) / (sc.end - sc.start));
  /* scene-entry soft-fade 0.12s (video pass r2: hard snap-cuts between
     environments — soften the seam without killing the cut rate) */
  const entryK = V2.clamp01((t - sc.start) / 0.12);
  (SCENES[sc.id] || SCENES.hook)(u, t);
  if (entryK < 1) V2.el("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: DAY.skyTop, opacity: (1 - entryK) * 0.55 });
  /* DAY grade: light airy vignette + fine grain (the dusk V2.grade
     vignette made azure skies read as night — ultracritic r1/gate r1) */
  V2.el("rect", { x: -20, y: -20, width: 1120, height: 1960, fill: "url(#dayVig)" });
  V2.el("rect", { x: 0, y: 0, width: 1080, height: 1920, filter: "url(#vGrain)", opacity: 0.35,
    transform: `translate(${(Math.floor(t / 2) % 2) * 3} ${Math.floor(t / 2) % 3})` });
  if (EMPHASIS[sc.id]) V2.caption(sc.narration, u, EMPHASIS[sc.id]);
}
window.renderFrame = renderFrame;
renderFrame(0);
</script>
